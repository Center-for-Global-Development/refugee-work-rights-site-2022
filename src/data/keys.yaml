de_facto:
  level_5: <p>Refugees are able to access their right to work in practice, face little discrimination from government officials, and have access to recourse for labor rights violations.</p>
  level_4: <p>Refugees face some discrimination from government officials in accessing employment or other barriers to their right to work in practice.</p>
  level_3: <p>Refugees face restrictive barriers to their right to work in practice. Alternatively, refugees are unable to access lawful employment but have some access to justice for workplace violations.</p>
  level_2: <p>Refugees face significant restrictive barriers to their right to work, such as little guarantee to work rights or little to no access to practical justice relating to the workplace. </p>
  level_1: <p>Refugees are unable to access lawful employment due to practical barriers and/or face significant discrimination from government officials, and they have little access to justice.</p>
  level_0: <p>Not enough data.</p>
de_jure:
  level_5: <p>Fully-functioning national policies support refugees’ right to work without restrictions and extend labor protections to refugees.</p>
  level_4: <p>There are national policies, but they limit full access to work rights, there are bureaucratic barriers that make the process onerous and/or untimely for livelihood purposes, and/or many labor protections are not extended to refugees.</p>
  level_3: <p>No existing national policies establish refugees’ right to work or their rights as workers, but ad hoc policies have allowed certain groups of displaced populations to work. Alternatively, the state mandates internment of refugees, preventing their lawful access to markets; the state’s legal recognition procedures create significant barriers to accessing the status needed to qualify for the right to work; and/or many labor protections are not extended to refugees.</p>
  level_2: <p>Existing national policies prohibit refugees from working by barring access to either work authorization or legal status. However, some inconsistencies among the policies can be read to provide certain limited de jure work rights.</p>
  level_1: <p>Existing national policies prohibit refugees from working. There is no law respecting refugees’ right to work or their rights as workers, and very few, if any, ad hoc policies exist permitting certain groups of refugees to work.</p>
  level_0: <p>Not enough data.</p>
