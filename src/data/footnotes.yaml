description_tab_footnotes: "<p><sub class=\"subscript\">Only reservations to the following articles in the 1951 Refugee Convention are considered, given their relevance to work rights: articles 13 (right to own property), 17 (right to wage earning employment ), 18 (right to self-employment), 19 (right to practice a liberal profession), 24 (right to benefit from labor regulations), 26 (right to move freely). Only reservations to the following articles in its 1967 Protocol are considered: articles 6 (right to work), 7 (right to the enjoyment of just and favorable conditions of work), 8 (right to form or join trade unions and to strike) and 9 (right to social security).</sub></p>"
survey_data_tab_footnotes: <p><sub class="subscript">Five is the highest score, with access equal to nationals, and one is the lowest score. Enforcement is only considered when permits are difficult to access. Strict enforcement of laws, reflected by a low score, is not penalized if permits are accessible. See the 2022 Global Refugee Work Rights Report for definitions, methodology, and survey questions.</sub></p>
