content: |-
  <p class="wp-block-paragraph">According to UNHCR, Liberia hosted 8,169 refugees and 9,818 asylum seekers in 2021. The most common country of origin for refugees and asylum seekers was Cote d’Ivoire.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Liberia is a party to the 1951 Refugee Convention and its 1967 Protocol, the ICESCR, and the 1969 Organization of African Unity regional convention. The <a href="https://www.refworld.org/legal/legislation/natlegbod/1994/en/57521">1993 Refugee Act</a> grants refugees the same right to work as other non-citizens. However, the country’s Labor Law requires permits for specific jobs and for <a href="https://www.refworld.org/reference/annualreport/uscri/2007/en/45245">employers to only hire non-citizens</a> if no qualified Liberians are present. Similarly, the Refugee Act allows people to claim asylum and recognized refugees freedom of movement. However, the Alien and Nationality Law states that non-citizens can be refused entry into the country.</p>



  <p class="wp-block-paragraph">This conflicting legislation means it is virtually impossible for refugees to legally work within Liberia; in 2006, four refugees applied for permits, and none were granted. The 1983 Constitution grants freedom of movement to refugees, and the Refugee Act allows refugees to “live in any place of his choice.” However, if a refugee leaves the camp, they forfeit their rights to humanitarian assistance; <a href="https://www.theguardian.com/global-development/gallery/2011/jun/29/education-refugee-camp-liberia-in-pictures">UNHCR therefore encourages refugees to move to the camps</a>. Legally, refugee children can access the same education as citizens.</p>



  <p class="wp-block-paragraph">There are many ongoing changes to the refugee situation in Liberia. In 2019, 98 percent of the refugees were from Cote d’Ivoire, living <a href="https://migrants-refugees.va/country-profile/liberia/">within three camps</a> (Bahn, PTP, and Little Weibo), as well as in urban areas such as Monrovia. As the situation in Cote d’Ivoire stabilised, many chose to return home. On June 30, 2022, <a href="https://www.unhcr.org/news/news-releases/cote-divoire-welcomes-returning-families-refugee-status-set-end">refugee status for Ivorian refugees was ended</a>. As a result, UNHCR is <a href="https://reporting.unhcr.org/west-and-central-africa-quarterly-operational-update">scaling down their presence in Liberia</a> and transferring responsibility for the remaining refugees to the Liberia Refugee Repatriation and Resettlement Committee (LRRRC). <a href="https://spotlightinitiative.org/news/homes-women-headed-households-and-vulnerable-ivoirian-refugees-liberia">Those that stay will receive Liberian citizenship</a>; <a href="https://frontpageafricaonline.com/news/liberia-un-eu-gol-collaborate-to-provide-stable-shelter-for-ivorian-refugees-in-liberia/">new homes have been built for them</a> within the camps.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">Most refugees engage in causal, informal, work either within the camp or in the surrounding areas. A <a href="https://www.rfi.fr/en/africa/20210224-ivorian-refugees-in-liberia-struggle-to-get-a-helping-hand">2021 report</a> notes that men are usually engaged to weed cassava bushes, brush cocoa fronds, clear brush, or deal with livestock, while women typically plant and harvest rice. They are paid minimal amounts for this work. UNHCR has been encouraging local integration by supporting refugees to access livestock which they can sell in local markets. Yet legal restrictions bar refugees from working in the formal market or exercising their professions.</p>



  <p class="wp-block-paragraph">Refugees are able to access education within Monrovia or nearby urban areas; in 2011, it was reported that in some places, schools were split into shifts with Ivorian and Liberian children getting half a day each. Many refugee children instead choose to attend the schools established by UNHCR in the camps, with all refugee camps having at least one school.</p>



  <p class="wp-block-paragraph">The refugee camps provided basic health services, while refugees could access secondary and tertiary health services in urban areas through referrals. However, the overall lack of health infrastructure impeded this access. In 2015, UNHCR conducted a <a href="https://microdata.worldbank.org/index.php/catalog/4801/related-materials">nutrition analysis</a> of 1,261 refugee heads of household across the three refugee camps. It found widespread malnutrition and food insecurity, forcing refugees to embark on negative coping strategies.</p>



