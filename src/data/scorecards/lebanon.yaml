content: |-
  <p class="wp-block-paragraph">According to UNHCR, Lebanon hosted 856,758 refugees, including 851,718 people from Syria in 2021. UNRWA also reports 479,000 refugees from Palestine.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">There is no national legal framework for refugee rights in Lebanon, and the country’s actions with regard to incoming refugees are primarily governed by ad hoc policies. Furthermore, domestic law does not distinguish asylum seekers and refugees from migrants. Lebanon is not a party to the 1951 Refugee Convention; however, the government ratified the ICESCR and has embedded principles of human rights law in the country’s constitution.</p>



  <p class="wp-block-paragraph">Syrian refugees in Lebanon must either be registered with UNHCR as refugees and be barred from working or must have a Lebanese sponsor to lawfully remain in the country and have access to formal employment. Annual renewal fees for such residency permits are prohibitively expensive for refugees, leaving many without legal status. Foreign labor is regulated by sector, and Syrian labor is restricted to the agriculture, construction, and sanitation sectors.</p>



  <p class="wp-block-paragraph">Palestinian refugees have access to formal employment, provided under the labor law amended in 2005 and 2010, enabling free work permits and access to work in restricted sectors. However, the process for obtaining work permits is lengthy and requires goodwill of employers, effectively barring Palestinians from successfully obtaining permits. In December 2021, Lebanon issued a decree relaxing sector restrictions for Palestinians born in Lebanon, including sectors such as business, tourism, health, and education. While a welcome change, barriers remain to realizing these opportunities, as low numbers of Palestinians obtain work permits and many employers are unwilling to hire Palestinians.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">Lebanon has one of the largest refugee populations per capita globally, hosting the second-largest population of Syrian refugees in addition to almost half a million Palestinians. Nationwide, Lebanon is also experiencing one of the worst economic crises since the mid-19th century, according to the World Bank, with real per capita GDP falling 37 percent between 2018 and 2021. In this context, the conditions for refugees have gone from bad to worse. For example, Syrians were under curfew in many municipalities even before COVID-19, and curfews targeting only Syrians expanded during the pandemic.</p>



  <p class="wp-block-paragraph">The labor market is also very difficult for refugees to access. Only 20 percent of Syrians have legal residency, as UNHCR has been unable to register refugees since 2015. Obtaining a work permit is “practically impossible” for Syrians, in the words of one survey respondent, and the sectors are significantly restricted even for Palestinians born in Lebanon. The EU-Lebanon Compact, signed in 2016, brought hope of expanded access for Syrians but made little tangible difference. Instead, authorities launched a crackdown in 2019 on businesses hiring foreign workers without proper paperwork. This combination of limited access to documentation and enforcement actions targeting businesses has contributed to the dire conditions experienced by Syrians in Lebanon, with more than 90 percent living in extreme poverty as of 2019.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong></p>



