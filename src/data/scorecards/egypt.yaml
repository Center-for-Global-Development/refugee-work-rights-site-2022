  de_facto: "3"
  overall: "3"
content: |-
  <p class="wp-block-paragraph">According to UNHCR, Egypt hosted 277,665 refugees and 57,320 asylum seekers in 2021. The majority of refugees and asylum seekers were from Syria, Palestine, and Sudan.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Egypt is a party to the 1951 Refugee Convention and its 1967 Protocol, the ICESCR, the Organization of African Unity regional convention, and the Arab Convention on Regulating Status of Refugees in the Arab Countries.</p>



  <p class="wp-block-paragraph">Article 91 of the 2014 Egyptian Constitution gives asylum seekers the right to seek asylum and prohibits the extradition of political refugees. However, despite the large number of refugees in the country, Egypt has yet to develop a clear set of national procedures to regulate the arrival of refugees. Refugee responsibilities and asylum applications are handled by UNHCR, which translates to inconsistencies in accessing documentation and obtaining formal employment.</p>



  <p class="wp-block-paragraph">Refugees in Egypt are legally viewed as foreigners under the 1982 Ministerial Resolution (Article 11) and are required to obtain a foreigner’s work permit, which is costly and requires renewal. Additional regulations include employer proof that no Egyptian national can perform the intended work prior to hiring a foreigner, and that there may only be a maximum of 10% foreign labor employed. Refugees have the right to establish or join a trade union organization in Egypt.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">Most refugees and asylum seekers do not have legal residency in Egypt, and few—only 9 percent in a recent study—have a valid passport. Even when refugees are able to obtain a work permit, the restrictions placed on Egyptian employers when hiring non-nationals means it is difficult for refugees to access the formal labor market at all. In addition, some, such as Palestinians, are legally barred from formal employment.</p>



  <p class="wp-block-paragraph">Refugees are legally able to register businesses, but the process is lengthy, complex, and requires a security clearance. Many therefore go through an Egyptian partner, which can lead to exploitative practices in the long run. As a result of these restrictions, most refugees are forced to work in the informal sector. Women often become domestic workers, while men become drivers, gardeners, and manual laborers. Men are more likely to be economically active, as are those with higher levels of education.</p>



  <p class="wp-block-paragraph">Refugees are largely able to access the healthcare system though often find it difficult to financially cover the medical premium. Barriers to education are more substantial. Access to public education in Egypt is nationality-based, which means some refugees (largely Africans) are barred from the public system. Most refugees also encounter low quality provision, high private education costs, and language barriers.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong></p>



  <p class="wp-block-paragraph">Government of Egypt, Decree (No. 25 for 1982) Concerning the Issuance of Work Permits for Foreigners, 1982, <a href="https://www.ilo.org/dyn/natlex/natlex4.detailp_lang=en&amp;p_isn=56976&amp;p_country=EGY&amp;p_count=549">https://www.ilo.org/dyn/natlex/natlex4.detailp_lang=en&amp;p_isn=56976&amp;p_country=EGY&amp;p_count=549</a></p>



  <p class="wp-block-paragraph">International Labor Organization, Refugees and the Egyptian Labour Market: An Analysis of the Potential Role of Employers’ Organizations (Cairo: International Labor Organization, 2021), <a href="https://www.ilo.org/global/programmes-and-projects/prospects/countries/egypt/WCMS_824111/lang--en/index.htm">https://www.ilo.org/global/programmes-and-projects/prospects/countries/egypt/WCMS_824111/lang&#8211;en/index.htm</a></p>



  <p class="wp-block-paragraph">League of Arab States, Arab Convention on Regulating Status of Refugees in the Arab Countries, 1994, <a href="https://www.refworld.org/docid/4dd5123f2.html">https://www.refworld.org/docid/4dd5123f2.html</a></p>



  <p class="wp-block-paragraph">Marina Andrade, Lucas Sato, and Maya Hammad, Improving Social Protection for Migrants, Refugees and Asylum Seekers in Egypt: An Overview of International Protection (BrasÍlia and Cairo: International Policy Centre for Inclusive Growth and UNICEF, 2021), <a href="https://www.unicef.org/egypt/media/6881/file/Improving%20social%20protection%20for%20migrants,%20refugees%20and%20asylum%20seekers%20in%20Egypt%20%7C%20Full%20report.pdf">https://www.unicef.org/egypt/media/6881/file/Improving%20social%20protection%20for%20migrants,%20refugees%20and%20asylum%20seekers%20in%20Egypt%20%7C%20Full%20report.pdf</a></p>



  <p class="wp-block-paragraph">Neemat Sharafeldin, Refugees in Egypt: practices and prospective law (Cairo: The American University in Cairo, 2020), <a href="https://fount.aucegypt.edu/cgi/viewcontent.cgi?article=2488&amp;context=etds">https://fount.aucegypt.edu/cgi/viewcontent.cgi?article=2488&amp;context=etds</a></p>



