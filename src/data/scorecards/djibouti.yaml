title: Djibouti
country_id: DJ
levels:
  de_jure: "5"
  de_facto: "4"
  overall: "4"
content: |-
  <p class="wp-block-paragraph">According to UNHCR, Djibouti hosted 23,232 refugees and 11,463 asylum seekers. The most common countries of origin for refugees and asylum seekers were Somalia and Ethiopia.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Djibouti is a party to the 1951 Refugee Convention and its 1967 Protocol, the ICESCR, and the 1969 Organization of African Unity regional convention. <a href="https://www.unhcr.org/uk/news/briefing-notes/unhcr-welcomes-djiboutis-new-refugee-laws">Prior to 2017</a>, refugees’ access to work was restricted to the informal sector, and education and health services were strictly provided through international organizations. In 2017, a new <a href="https://migrationpolicy.unescwa.org/sites/default/files/policies/2017_Djibouti_Law_No_159.pdf">Refugee Law</a> and two subsequent decrees&nbsp;were signed, giving refugees the same rights to work, move, and access services as nationals. Asylum-seekers are given the right to stay in the country for up to six months (renewable) while their claim is being heard. The documentation provided to asylum-seekers does allow them to work, but not to access other services such as bank accounts.&nbsp;</p>



  <p class="wp-block-paragraph">While refugees are free to live in urban areas, they forfeit their right to humanitarian assistance. Perhaps unsurprisingly, most refugees <a href="https://www.unhcr.org/countries/djibouti">therefore live in one of three refugee villages</a>—Ali-Addeh (49 percent), Holl-Holl (23 percent), and Markazi (8 percent)—while the remainder (20 percent) live in Djibouti City. Since 2017, these refugee villages are managed by the government, rather than UNHCR.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">The high unemployment rate within Djibouti makes finding formal work difficult, even for nationals. Yet refugees face <a href="https://documents1.worldbank.org/curated/en/826851636575674627/pdf/IDA19-Mid-Term-Refugee-Policy-Review.pdf">specific barriers in accessing the labor market</a>, including a lack of awareness among employers as to refugees’ right to work; the fact the two main refugee camps are far away from labor market opportunities; and the fact that asylum-seeker documentation is often not recognized or accepted. While there are opportunities in Djibouti City, it appears few refugees are exploiting these <a href="https://www.ilo.org/wcmsp5/groups/public/---ed_emp/documents/projectdocumentation/wcms_630922.pdf">due to a lack of information</a>. In 2001, the government created a ‘<a href="https://www.guichet-unique.dj/">one stop shop</a>’ to enable people to recognize a business, and in 2017, licence payments were cancelled. Refugees have been able to both access these ‘one stop shops’ and benefit from the cancellation of licence payments.</p>



  <p class="wp-block-paragraph">There are 15 refugee schools in the country, teaching the <a href="https://www.worldbank.org/en/news/feature/2024/01/11/djibouti-giving-refugee-children-a-chance-to-go-to-school">Djiboutian curriculum</a> following the IGAD “<a href="https://www.right-to-education.org/sites/right-to-education.org/files/resource-attachments/Djibouti_Declaration_Refugee_Education_2017_En.pdf">Djibouti Declaration on Refugee Education</a>”. However, as of 2020, <a href="https://migrants-refugees.va/country-profile/djibouti/">almost 70 percent of refugee children were still out of school</a>. This was attributed to a lack of infrastructure and teachers. It could also be partly due to the fact that <a href="https://www.upr-info.org/sites/default/files/documents/2018-04/unhcr_upr30_dji_e_main.pdf">refugees in urban areas need to register their children’s births and pay for all costs themselves</a>, something many parents are unable to do, meaning these children are not able to attend school.</p>



  <p class="wp-block-paragraph">Refugees are included within the national health system; every refugee village has one health centre, and urban-based refugees can use local centres. In both, refugees can access health services free of charge, which is better than the situation for locals (<a href="https://documents1.worldbank.org/curated/en/826851636575674627/pdf/IDA19-Mid-Term-Refugee-Policy-Review.pdf">who need to present proof of insurance or pay cash</a>).</p>



