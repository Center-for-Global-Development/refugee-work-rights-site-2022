title: Iraqi Kurdistan
country_id: IK
levels:
  de_jure: "3"
  de_facto: "4"
  overall: "4"
content: |-
  <p class="wp-block-paragraph">According to UNHCR, Iraqi Kurdistan hosted over 266,000 Syrian refugees in 2021, which is 98 percent of the Syrian refugees in Iraq and 92 percent of all refugees and asylum seekers in Iraq.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Iraqi Kurdistan is not a party to the 1951 Refugee Convention or its 1967 Protocol as part of the State of Iraq.</p>



  <p class="wp-block-paragraph">In the Kurdistan Region of Iraq (KRI), there is no specific law that governs asylum seeker or refugee rights and the right to work for refugees is not guaranteed in domestic law. The right to work is dependent on legal entry and residency status. Decree No. 7174 and Decree No. 10041 protect refugees and asylum seekers from detention for crossing borders without a visa or lawful status. Individuals seeking asylum are able to apply for a Refuge Asylum Application Certificate and temporary residency permit which must be renewed annually. With this residency permit, refugees in KRI are able to work. However, refugees in KRI are not legally eligible for permanent residency, which presents a barrier to safe, decent, and sustainable work entrepreneurship opportunities.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">Although the measure is not enshrined in law, the Kurdistan Regional Government has adopted a de facto policy of labor market access for Syrian refugees, who make up the majority of refugees in Iraqi Kurdistan. Syrians who register with UNHCR and pass a security check are provided with a one-year residency permit, which allows access to basic services such as healthcare and education and can be renewed. In practice, the cost to acquire residency (US$33–75) can be a barrier, but 93 percent of Syrians were registered as of 2018, according to a recent report by the Norwegian Refugee Council (NRC). Some Syrians obtained residency through shell companies that offered easier access to employment than refugee status, but the government has cracked down on these schemes recently, and many of these Syrians have moved to other countries.</p>



  <p class="wp-block-paragraph">With residency, Syrians are able to access private-sector jobs and start businesses. Survey respondents report that refugees can access jobs and obtain business permits, though the process for starting a business can be complicated. The recent report by the NRC also noted a perception that starting a business outside the camps requires an Iraqi sponsor, though this is not actually a provision of the policy. Refugees are prohibited from working in the public sector, which accounts for a substantial proportion of formal jobs available. Given these barriers, most refugees still work in the informal sector, where the NRC and other organizations have documented frequent violations of labor laws regarding working hours, the minimum wage, and safe working conditions. While the NRC report notes that “work rights violations are common, with redress almost impossible,” respondents to the survey from one NGO (Harikar) note that their legal unit takes many cases like these.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong></p>



  <p class="wp-block-paragraph">Caroline Zullo, “Closing the Gap: Syrian Refugees in Kurdistan Deserve Better Work Opportunities,” The New Arab, February 15, 2022, <a href="https://english.alaraby.co.uk/opinion/syrian-refugees-kurdistan-deserve-better-work-prospects">https://english.alaraby.co.uk/opinion/syrian-refugees-kurdistan-deserve-better-work-prospects</a></p>



  <p class="wp-block-paragraph">Naomi Petersohn, Closing the Gap: From Work Rights to Decent Work for Syrian Refugees in KRI (Oslo: Norwegian Refugee Council, n.d.), <a href="https://www.nrc.no/globalassets/pdf/reports/closing-the-gap/closing-the-gap---report-design.pdf">https://www.nrc.no/globalassets/pdf/reports/closing-the-gap/closing-the-gap&#8212;report-design.pdf</a></p>



  <p class="wp-block-paragraph">Respond Migration, Refugees in Iraq: Access to Work and Stable Livelihoods, March 1, 2021, <a href="https://respondmigration.com/policy-briefs/refugees-in-iraq-access-to-work-and-stable-livelihoods">https://respondmigration.com/policy-briefs/refugees-in-iraq-access-to-work-and-stable-livelihoods</a></p>



  <p class="wp-block-paragraph">UNHCR, “Global Focus: Iraq,” accessed May 23, 2022, <a href="https://reporting.unhcr.org/iraq">https://reporting.unhcr.org/iraq</a></p>



  <p class="wp-block-paragraph">UNHCR, “Iraq: 2021 Participatory Assessment of Refugees and Asylum-Seekers June – August 2021,” December 7, 2021, <a href="https://data2.unhcr.org/en/documents/details/89976">https://data2.unhcr.org/en/documents/details/89976</a></p>



  <p class="wp-block-paragraph">World Food Program / UNHCR / Kurdistan Region Statistics Office, Joint Vulnerability Assessment (Rome: World Food Program, 2018), <a href="https://www.wfp.org/publications/iraq-wfpunhcrkrso-joint-vulnerability-assessment-june-2018">https://www.wfp.org/publications/iraq-wfpunhcrkrso-joint-vulnerability-assessment-june-2018</a></p>



