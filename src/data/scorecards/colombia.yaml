content: |-
  <p class="wp-block-paragraph">According to UNHCR, Colombia hosted 964 refugees and 30,599 asylum seekers as well as 1,742,927 Venezuelans displaced abroad in 2021. The majority refugees and asylum seekers were from Venezuela.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Colombia is a party to the 1951 Refugee Convention and its 1967 Protocol, as well as the ICESCR and regional instruments such as the 1984 Cartagena Declaration.100 Colombia’s domestic legislation, specifically Decree 1067 of 2015, incorporates refugees’ rights to due process, recognition of refugee status, and access to work.</p>



  <p class="wp-block-paragraph">Resolution 6045 of 2017 specifies that recognized refugees are entitled to a type M migrant visa, which are valid for three years. This visa enables recognized refugees to engage in lawful employment, pursue self-employment, and access education services. After three years expire, renewal is required, and after the fifth year of continuous residence, refugees are eligible to apply for the Resident Visa (type R visa).</p>



  <p class="wp-block-paragraph">A person seeking refugee status upon entering Colombia may receive a three-month laissez-passer with a pending asylum application. This laissez-passer may be renewed for an additional 3 months. During this time, the person may not legally work, unless they have another migratory status in Colombia that allows it.</p>



  <p class="wp-block-paragraph">In 2021, the Colombian government issued the Temporary Statue of Protection for Venezuelan Migrants which is valid for ten years and enables work authorization. In 2020, Venezuelans were eligible for a Special Permit to Stay to Promote Formalization (PEP-FF) which enabled those to legalize their status if they were without lawful status in the country and held a formal job offer. Prior to this, in 2017, the Colombian government offered Venezuelans a Special Permit to Stay (PEP), which was valid for two years, and also enabled the right to work.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">Currently, the majority of Venezuelans in Colombia work in the informal sector regardless of their status in the country. Discrimination, lack of documentation, and inability to validate credentials are among the reasons preventing many Venezuelans from obtaining formal jobs. On average, Venezuelans in Colombia earn less than locals and enjoy little job security. Despite the challenges, the government of Colombia has implemented measures to improve the economic integration of Venezuelans. For example, the government has led programs to recognize the skills of Venezuelans, as well as to connect them with decent job opportunities, among other measures.</p>



  <p class="wp-block-paragraph">There are no effective mechanisms available to Venezuelans (or locals) to protect their working conditions in the informal sector. To avoid abuse, many Venezuelans in Colombia resort to self-employment as a livelihood strategy. While the formalization of businesses is dependent on having a regular status in the country, self-employment in informal settings is common and allowed.</p>



  <p class="wp-block-paragraph">To promote formalization, the government instituted a special visa for undocumented Venezuelans who receive a formal job offer. Nevertheless, the lack of understanding of all the types of visas and permits prevents many employers from hiring Venezuelans. Furthermore, it is very difficult for Venezuelans to validate their professional credentials in Colombia, which further affects their ability to obtain formal employment. Ultimately, those who obtain formal jobs have access to greater protections and safeguards in the labor market.</p>



