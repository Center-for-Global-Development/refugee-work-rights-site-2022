title: Democratic Republic of Congo
country_id: CD
levels:
  de_jure: "4"
  de_facto: "3"
  overall: "3"
content: |-
  <p class="wp-block-paragraph">According to UNHCR, the Democratic Republic of Congo (DRC) hosted 519,819 refugees and 16,595 asylum seekers in 2021. The majority of refugees and asylum seekers were from the Central African Republic and Rwanda.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">DRC is a party to the 1951 Refugee Convention and its 1967 Protocol, the ICESCR, and the 1969 Organization of African Unity regional convention. In 2002, DRC adopted the national Refugee Law consistent with its international obligations, providing refugees the right to work.</p>



  <p class="wp-block-paragraph">Under the country’s domestic laws, refugees in DRC enjoy the same treatment as nationals with regard to the exercise of political, social, economic, and cultural rights. Refugees and asylum seekers have access to documentation. Indeed, the government of DRC has biometrically registered all refugees and issued refugee ID cards to all those in camps and urban areas. Pursuant to the Refugee Law and the Foreigner Law, recognized refugees benefit from the right to freedom of movement, although asylum seekers must live in designated areas until they are recognized as refugees, which in practice can take years. Additionally, camp regulations state that refugees living in camps may not leave without permits, although in practice these regulations are not consistently enforced across the country.</p>



  <p class="wp-block-paragraph">Refugees with a valid work permit are able to access the formal labor market as foreign workers, subject to sector quotas imposed by the National Commission of Hiring Expatriate Workers. In 2019, the government pledged to provide ten-year residence permits for Rwandans whose refugee status was terminated.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">DRC maintains a range of barriers that prevent refugees from accessing formal work in host communities, camps, and settlements and that contribute to broader rights denials. The country faces immense political, economic, and security challenges in addition to hosting more than half a million refugees from neighboring countries. It has well over 100 armed groups and consistently produces some of the largest numbers of internally displaced persons and refugees in the world.</p>



  <p class="wp-block-paragraph">Survey respondents noted that refugees are able to travel throughout the country but may face some harassment from officials or armed groups in doing so. While refugees have difficulty accessing work permits, respondents emphasized that permits are not needed in many contexts. They also noted that in cities, some refugees are able to receive some support from the government and international organizations. In some parts of the country, refugees can access land to farm like the local population and engage in petty trade. Nonetheless, refugees and the broader population still struggle to access decent work opportunities and other basic rights.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong></p>



