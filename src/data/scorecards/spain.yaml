  de_facto: "4"
  overall: "4"
content: |-
  <p class="wp-block-paragraph">According to UNHCR, Spain hosted 115,258 refugees and 91,585 asylum seekers in 2021. The most common country of origin among refugees and asylum seekers was Venezuela, followed by Colombia.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Spain is a party to the 1951 Refugee Convention, its 1967 Protocol, and the ICESCR. These international obligations are supplemented by the EU Regional Council Directive, which requires that member states authorize recognized refugees to engage in lawful employment on par with nationals. Spain includes these rights in its domestic legislation, particularly in the Asylum Act of 2009.</p>



  <p class="wp-block-paragraph">Recognized refugees, asylum seekers, and those with subsidiary protection are guaranteed the right to work in Spain; however, asylum seekers are not granted the right to work until six months after submission of their asylum application. There are no restrictions on the sectors refugees, asylum seekers, or those with subsidiary protection may work in. In addition, refugees and those with subsidiary protection are guaranteed the same employment rights as Spanish citizens under Spanish law. Asylum seekers are granted the right to participate in vocational training and language instruction to facilitate greater economic integration.</p>



  <p class="wp-block-paragraph">Freedom of movement is guaranteed under Spanish law, yet in practice asylum seekers are often held in reception centers, which restricts their movement. Those who “lack financial means” are provided support for 18 to 24 months.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">The government of Spain grants long-term residency and work permits to all recognized refugees, which allow them to work and start a business. While recognized refugees enjoy full liberties in the country, refugees’ financial situation affects their economic inclusion and freedom of movement. The government provides accommodation and support within the refugee reception system for six months to all refugees and asylum seekers. </p>



  <p class="wp-block-paragraph">However, once refugees leave the protection centers, they often face financial precarity and struggle to incorporate into the labor market. Some of the barriers include difficulty learning the language, navigating the bureaucracy, and recognizing their credentials.</p>



  <p class="wp-block-paragraph">Most refugees work informally in jobs that require low levels of education. While Spain stipulates strict punishments for those hiring informal workers, in practice, survey respondents indicate that the authorities rarely check the documentation status of employees. As a result, even those without documentation can access jobs in Spain.</p>



  <p class="wp-block-paragraph">Spain grants work permits to asylum seekers six months after they submit their refugee applications, with some nationalities, such as Venezuelans, benefiting from a fast-tracked process. These permits allow them to stay and work in the country until their refugee status determination is completed. Forcibly displaced individuals without documented status can regularize after two years in the country. If they have a job offer, people who have been displaced can apply for a special authorization that allows them to remain and work in the country.</p>



  <p class="wp-block-paragraph">Despite these provisions, asylum seekers in some areas of Spain face increasing challenges to their freedom of movement. In particular, asylum seekers in the enclaves of Ceuta and Melilla—located on the African continent—are not allowed to leave their location. The government grants them an asylum-seeker identification card that is valid only in the city where they reside rather than in the whole country. Written authorization from the government is required in order for asylum seekers to move to mainland Spain. Survey respondents indicated that a similar measure is in place on the Canary Islands. The Supreme Court of Spain recently deemed illegal the restriction of movement of asylum seekers in Ceuta and Melilla, but the issue is yet to be resolved in practice.</p>



