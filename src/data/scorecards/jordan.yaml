content: |-
  <p class="wp-block-paragraph">According to UNHCR, Jordan hosted 708,308 refugees and 48,368 asylum seekers in 2021. The majority of refugees were from Syria.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Despite hosting one of the highest numbers of refugees in the world, Jordan is not a party the 1951 Refugee Convention and lacks comprehensive national refugee legislation. The country implemented an MOU with UNHCR in 1998, the primary policy establishing processing procedures for refugees.</p>



  <p class="wp-block-paragraph">The 1954 Jordanian Constitution reserves the right to work freely for Jordanian citizens only. Jordan does not have any formal legislation protecting refugees’ right to work. Nevertheless, in 2016 the government signed the “Jordan Compact,” establishing free work permits for 200,000 Syrian refugees, simplifying documentation requirements, and allowing at-home businesses. This enables work in certain sectors that are subject to quotas which limits the total number of foreign workers in each sector.</p>



  <p class="wp-block-paragraph">Since October 2018, Syrian refugees with work permits have been allowed to move freely between industrial sectors without being sponsored by an employer, but they are still subject to sector quotas. Syrian refugees currently residing in camps are allowed to obtain a permit to work outside the camp, which enables work in sectors approved for non-Jordanians.</p>



  <p class="wp-block-paragraph">This formal pathway is not available to refugees of other nationalities, such as those from Iraq, Yemen, Sudan, or Somalia. Palestinians who are citizens are eligible for full access to the labor market.</p>



  <p class="wp-block-paragraph">Faced with exclusion from formal employment, refugees must often decide between holding legal refugee status and renouncing that status to enter the formal labor market as a foreign worker. The migrant worker system is founded on employer sponsorship (kafala), except for those working in Qualified Industrial Zones, where migrants’ admission and lawful residency is tied to their employment.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">In practice, labor market access for registered Syrian refugees has improved since the implementation of the Jordan Compact. Work permits are issued, and restrictions on their applicability have slowly been relaxed. As of July 2021, Syrian refugees are able to work in all sectors where non-Jordanians are permitted, and exemptions were made for Syrian healthcare workers during the COVID-19 pandemic. Despite these improvements, 80 percent of Syrians live in poverty, with high debt and food insecurity. Furthermore, movement is restricted for the 18 percent of registered Syrian refugees who live in the two main camps. Residents must seek approval for movement passes that are valid for up to 30 days. Access to work permits and to movement passes is more limited in Azraq camp than in Za’atari camp.</p>



  <p class="wp-block-paragraph">The majority of Palestinian refugees are eligible for citizenship and therefore full access to the labor market. Their socioeconomic outcomes are similar to those of other Jordanians on average, though Palestinians in camps have lower incomes, and some groups of Palestinians who are not eligible for citizenship face restrictions in the labor market and on owning property.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong></p>



  <p class="wp-block-paragraph">Anna Kvittingen, Age A. Tiltnes, Ronia Salman, Hana Asfour, and Dina Baslan, ‘Just Getting By’: Ex-Gazans in Jerash and Other Refugee Camps in Jordan, Fafo Report 2019:34 (Oslo, Norway: Fafo, 2019), <a href="https://fafo.no/images/pub/2019/20731.pdf">https://fafo.no/images/pub/2019/20731.pdf</a></p>



  <p class="wp-block-paragraph">Human Rights Watch, “Jordan: Events of 2020,” accessed April 17, 2022, <a href="https://www.hrw.org/world-report/2021/country-chapters/jordan#331939">https://www.hrw.org/world-report/2021/country-chapters/jordan#331939</a></p>



  <p class="wp-block-paragraph">Omer Karasapan, “Syrian Refugees in Jordan: A Decade and Counting,” Future Development (blog), Brookings Institution, January 27, 2022, <a href="https://www.brookings.edu/blog/future-development/2022/01/27/syrian-refugees-in-jordan-a-decade-and-counting/">https://www.brookings.edu/blog/future-development/2022/01/27/syrian-refugees-in-jordan-a-decade-and-counting/</a></p>



  <p class="wp-block-paragraph">Shaiban Taqa, The Legal Framework of Migrant Workers Rights in the Arab Countries (Amman: Arab Network for Migrants Rights, 2013), <a href="https://dashboard.tamkeen-jo.org/wp-content/uploads/2022/02/The_Legal_Framework_of_Migrant_Workers_Rights_in_the_Arab_Countries.pdf">https://dashboard.tamkeen-jo.org/wp-content/uploads/2022/02/The_Legal_Framework_of_Migrant_Workers_Rights_in_the_Arab_Countries.pdf</a></p>



  <p class="wp-block-paragraph">Svein Erik Stave, Tewodros Aragie Kebede, and Maha Kattaa, Impact of Work Permits on Decent Work for Syrians in Jordan (Geneva: International Labor Organization, 2021), <a href="https://reliefweb.int/sites/reliefweb.int/files/resources/Impacts%20of%20Work%20Permit%20Regulations%20on%20Decent%20Work%20for%20Syrian%20refugees%20in%20Jordan.pdf">https://reliefweb.int/sites/reliefweb.int/files/resources/Impacts%20of%20Work%20Permit%20Regulations%20on%20Decent%20Work%20for%20Syrian%20refugees%20in%20Jordan.pdf</a></p>



  <p class="wp-block-paragraph">UNHCR, “Jordan Issues Record Number of Work Permits to Syrian Refugees,” January 25, 2022, <a href="https://www.unhcr.org/en-us/news/press/2022/1/61effaa54/jordan-issues-record-number-work-permits-syrian-refugees.html">https://www.unhcr.org/en-us/news/press/2022/1/61effaa54/jordan-issues-record-number-work-permits-syrian-refugees.html</a></p>



