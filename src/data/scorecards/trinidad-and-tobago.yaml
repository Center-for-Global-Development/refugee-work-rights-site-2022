title: Trinidad and Tobago
country_id: TT
levels:
  de_jure: "3"
  de_facto: "3"
  overall: "3"
content: |-
  <p>According to UNHCR, Trinidad and Tobago hosted 3,458 refugees and 21,089 asylum seekers in 2021. The majority of refugees and asylum seekers were from Venezuela, followed by Cuba.</p>
  <p><strong>De Jure Summary</strong></p>
  <p><i></i>Trinidad and Tobago is a party to the 1951 Refugee Convention, its 1967 Protocol, the ICESCR, and the Brazil Declaration and Action Plan. However, Trinidad and Tobago does not have national legislation protecting refugees or guaranteeing their work rights.</p>
  <p>Because there is a lack of legislation pertaining to refugees in particular, the government oversees refugees’ entry under the 1969 Immigration Act. In 2014, the government of Trinidad and Tobago charted a pathway toward the development of a national policy to address refugee and asylum matters, which would set forward a national refugee status determination process. This legislation has not yet been enacted.</p>
  <p>UNHCR is mandated to carry out refugee status determination in Trinidad and Tobago. However, in 2019, the government registered Venezuelan refugees who had arrived in the country and issued most Venezuelans permits to remain for six months. The government then extended renewal eligibility for six-month periods twice in 2020, and conducted a reregistration exercise in 2021, with the same six-month eligibility period.</p>
  <p>Trinidad and Tobago issued a Work Permit Exemption Order under the Venezuelan registration process, which enabled registered Venezuelans to lawfully work in Trinidad and Tobago for up to one year.</p>
  <p><strong>De Facto Summary</strong></p>
  <p>The lack of legislation concerning refugees in Trinidad and Tobago leaves them in a situation in which they are considered undocumented migrants. The implementation of special permits for Venezuelans allowed some 16,000 Venezuelans in the country to regularize their status. However, most of the 40,000 Venezuelans are still undocumented, and individuals of other nationalities do not even have the option to obtain a permit, leaving them subject to arrest and deportation.</p>
  <p>Displaced Venezuelans with a permit to stay in Trinidad and Tobago have more rights than other unrecognized refugees without these documents; they have freedom of movement and the right to work. But unrecognized refugees face increasing risks to their well-being and self-reliance. They cannot formalize their employment, open bank accounts, or access public schools or even health services. Many are subject to exploitation and abuse.</p>
  <p>Their immigration situation also leaves them vulnerable to being cheated by their employers and renters. For instance, some might be evicted after paying rent or earn considerably less than the agreed paycheck. Venezuelans in Trinidad and Tobago, particularly women and girls, are also at risk of sexual exploitation, and cases of sexual slavery and trafficking have been reported in the country among Venezuelans.</p>
  <p>In addition, the government has imposed harsh penalties on any individual who facilitates the stay of undocumented immigrants. This means that employers, landlords, and any other individual can be prosecuted if they knowingly support individuals who are in the country without a visa.</p>
  <p>Most Venezuelans in the country work informally, many in the tourism sector. Survey respondents indicate that the COVID-19 lockdowns disproportionately affected refugees’ livelihoods. As the government closed nonessential activities, the restaurants, bars, and other businesses that employed Venezuelans were significantly affected.</p>
  <p><strong>Sources</strong>:</p>
