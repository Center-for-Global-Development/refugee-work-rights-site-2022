content: |-
  <p class="wp-block-paragraph">According to UNHCR, Burundi hosted 76,837 refugees and 4,929 asylum seekers in 2021. The majority of refugees and asylum seekers were from the Democratic Republic of Congo.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Burundi is a party to the 1951 Refugee Convention and its 1967 Protocol, the ICESCR, and the Organization of African Unity regional convention.</p>



  <p class="wp-block-paragraph">Refugees in Burundi are given the right to work with a valid work permit, which may be obtained with a current employment contract and a valid refugee ID card. Work permits are free to obtain, and refugees may register their own businesses.</p>



  <p class="wp-block-paragraph">However, Articles 88 and 89 of the 2008 Asylum Act require refugees in Burundi to live in refugee camps. While this restriction is paired with the requirement that work permit holders be allowed to move freely outside the camp, legally mandated internment poses a significant barrier to full exercise of work rights for a majority of refugees in the country. All refugees have access to identity cards and travel documents provided by the Burundian administration. Work permit requirements, camp restrictions, and high unemployment rates make the formal labor market challenging for refugees to access.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">Burundi’s record in practice is mixed. More than half of refugees live in camps, and freedom of movement is curtailed; refugees must have passes to travel and authorization to change their addresses, which impacts their access to employment. However, a significant number (estimated at 41 percent in 2018) live in urban areas and report few issues in dealing with authorities. Work permits for formal employment are somewhat difficult to come by, but business permits are available and self-employment is accepted both in the camps and in urban areas. According to a survey respondent, some refugees are able to leave the camps to participate in economic cooperatives, as well.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong></p>



