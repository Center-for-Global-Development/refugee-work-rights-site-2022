content: |-
  <p class="wp-block-paragraph">According to UNHCR, Kenya hosted 466,286 refugees and 54,878 asylum seekers in 2021. The majority of refugees originated from Somalia, whereas the most common country of origin for asylum seekers is the Democratic Republic of Congo.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">On paper, Kenya has a relatively progressive refugee legal framework, as it is a party to the 1951 Refugee Convention and its 1967 Protocol, and the 2021 Refugees Act provides refugees with the right to employment and identity cards and support in local integration. Kenya is also a party to the ICESCR and ratified the 1969 Organization of African Unity Convention Governing the Specific Aspects of Refugee Problems in Africa.</p>



  <p class="wp-block-paragraph">The 2006 Refugee Act, its 2009 Refugee Regulations, and the 2021 Refugees Act governs the status and treatment of refugees in Kenya. The legislation provides refugees the rights contained in the human rights treaties ratified by Kenya. Refugees are able to apply for free work permits and can be employed in any occupation or self-employment as long as they satisfy any county-level regulations that may exist.</p>



  <p class="wp-block-paragraph">Currently, the law does not provide refugees with the right to move freely. Kenya’s encampment policy stipulates that refugees must obtain authorization to leave the camps temporarily. The new Refugees Act indicates that refugees will be allowed to move within designated areas, though more details are expected in forthcoming regulations.</p>



  <p class="wp-block-paragraph">Beyond these laws, various development plans seek to support economic opportunities for refugees by enabling greater freedom of movement and work rights, namely, the Intergovernmental Authority on Development Nairobi Declaration, the Kampala Declaration, and the Kalobeyei Integrated Socioeconomic Development Program.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">Kenya hosts one of the largest protracted refugee populations in the world, and they generally struggle to access formal work and to move freely. Some refugees reside in urban centers such as Nairobi, where they can move more freely, and others are able to leave the camps. However, survey respondents indicated that most still struggle to move freely and may face harassment or even arrest when moving. Some noted that restrictions on movement have worsened during the pandemic, and nearly all cited the government’s encampment policy as a major limitation on economic inclusion. Formal work authorization, including work permits, is rarely given to refugees and is difficult to obtain.</p>



  <p class="wp-block-paragraph">The recently passed Refugees Act (November 2021) and initiatives such as the area-based Kalobeyei Integrated Socioeconomic Development Program hold potential to widen opportunities for refugees to achieve self-reliance and income generation. They demonstrate regional and local implementation of more progressive policies that can benefit refugees and hosts alike. However, the barriers to accessing the labor market in other parts of Kenya—most notably difficulties obtaining documentation and moving freely—remain significant for most refugees and asylum seekers.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong></p>



  <p class="wp-block-paragraph">Jimmy Graham and Sarah Miller, From Displacement to Development: How Kenya Can Create Shared Growth by Facilitating Economic Inclusion for Refugees (Washington, DC: Center for Global Development and Refugees International, 2021), <a href="https://reliefweb.int/sites/reliefweb.int/files/resources/From%20Displacement11.18.21.pdf">https://reliefweb.int/sites/reliefweb.int/files/resources/From%20Displacement11.18.21.pdf</a></p>



  <p class="wp-block-paragraph">Mohamed Yusuf, “New Law in Kenya Allows Refugees to Work,” Voice of America, November 19, 2021, <a href="https://www.voanews.com/a/new-law-in-kenya-allows-refugees-to-work-/6320046.html">https://www.voanews.com/a/new-law-in-kenya-allows-refugees-to-work-/6320046.html</a></p>



  <p class="wp-block-paragraph">Roger Zetter and Heloise Ruaudel, Refugees’ Right to Work and Access to Labor Markets—An Assessment (Washington, DC: World Bank KNOMAD, 2016), <a href="https://www.knomad.org/sites/default/files/2017-12/KNOMAD%20Study%201-%20Part%20II-%20Refugees%20Right%20to%20Work%20-%20An%20Assessment.pdf">https://www.knomad.org/sites/default/files/2017-12/KNOMAD%20Study%201-%20Part%20II-%20Refugees%20Right%20to%20Work%20-%20An%20Assessment.pdf</a></p>



  <p class="wp-block-paragraph">Sorcha O’Callaghan, Farah Manji, Kerrie Holloway, and Christina Lowe, The Comprehensive Refugee Response Framework: Progress in Kenya, HPG Working Paper (London: Overseas Development Institute, Humanitarian Policy Group, 2019), <a href="https://cdn.odi.org/media/documents/12940.pdf">https://cdn.odi.org/media/documents/12940.pdf</a></p>



  <p class="wp-block-paragraph">UNHCR, 2021 Global Compact on Refugees Indicator Report (Geneva: UNHCR, 2021), <a href="https://reliefweb.int/sites/reliefweb.int/files/resources/2021_GCR-Indicator-Report_spread_web.pdf">https://reliefweb.int/sites/reliefweb.int/files/resources/2021_GCR-Indicator-Report_spread_web.pdf</a></p>



