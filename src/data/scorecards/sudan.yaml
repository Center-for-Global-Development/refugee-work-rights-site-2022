content: |-
  <p class="wp-block-paragraph">According to UNHCR, Sudan hosted 1,068,339 refugees and 25,102 asylum seekers in 2021. The majority of refugees and asylum seekers were from South Sudan and Eritrea.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">In addition to being a party to the 1951 Refugee Convention, its 1967 Protocol, and the ICESCR, Sudan is also a party to the Organization of African Unity Convention Governing the Specific Aspects of Refugee Problems in Africa, the Bangkok Principles on the Status and Treatment of Refugees (“Bangkok Principles”), the Arab Convention on Regulating Status of Refugees in the Arab Countries, and the Protocol for the Treatment of Palestinians in Arab States (“Casablanca Protocol”). Sudan has a reservation to Article 26 of the Refugee Convention regarding freedom of movement for refugees, however.</p>



  <p class="wp-block-paragraph">In terms of national legislation, Sudan’s Asylum Act provides for an asylum application process and guarantees labor rights to refugees on the same terms as other foreigners, once a corresponding work permit has been obtained. However, the government rarely issues these permits, often because the refugee seeking the permit lacks a “foreigner number,” despite the Asylum Act’s provision that the Refugees Commission “shall issue” an identity card with such a number. South Sudanese, Syrian, and Yemeni refugees do not require work permits to legally access the labor market.</p>



  <p class="wp-block-paragraph">At the same time, Sudan’s encampment policy—in line with its Refugee Convention reservation regarding free movement—requires the internment of refugees and asylum seekers. Despite the fact that a large majority of refugees live outside the camps, Sudanese authorities enforce internment rules against refugees and asylum seekers discovered to have left the camps without permission or found residing in urban areas.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">Although 70 percent of refugees live outside the camps, the government maintains a strict encampment policy. Smuggling networks are common avenues to leave the camps, and refugees outside camps risk harassment and detention. According to the US Department of State, 150 to 200 refugees and asylum seekers are detained each month in Khartoum. The government has also pushed for urban refugees’ relocation from areas near Khartoum to camps. For refugees in other areas, freedom of movement varies by region.</p>



  <p class="wp-block-paragraph">Most refugees, including those in urban areas, face significant barriers to labor market access in practice. Permits for formal employment or to start a registered business are rarely issued. Syrian and Yemeni refugees are an exception; they are allowed to work, as the government regards them as “brothers and sisters.” The right to work is also supposed to be afforded to South Sudanese refugees under the “four freedoms” agreement with South Sudan, but implementation in practice varies significantly. Most refugees work informally, which is tolerated in most places, including in camps and urban areas.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong>:</p>



