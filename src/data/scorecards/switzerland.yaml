content: |-
  <p class="wp-block-paragraph">According to UNHCR, Switzerland hosted 117,169 refugees and 5,612 asylum seekers in 2021. The majority of refugees and asylum seekers originated from Eritrea, Syria, and Afghanistan.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Switzerland is a party to the 1951 Refugee Convention, its 1967 Protocol, and the ICESCR. It also has adopted domestic legislation guaranteeing rights for refugees and asylum seekers, particularly the Asylum Act, revised in 2019, and the Federal Act on Foreign Nationals and Integration.</p>



  <p class="wp-block-paragraph">Asylum seekers are required to stay in federal asylum centers after they lodge their application, for a maximum stay of 140 days, with exceptions for individuals lodging claims at airports or who are held in detention. During this time, asylum seekers are not allowed to engage in lawful employment. Once allocated to a state (canton), they may seek employment, but hiring is subject to confirmation that the job cannot be filled by a Swiss national or citizen of a country with which Switzerland has free labor agreements.</p>



  <p class="wp-block-paragraph">Refugees with temporary admission and recognized refugees are guaranteed the right to lawful employment upon receiving status. Recognized refugees are guaranteed the right to work lawfully without restrictions on moving sectors or professions, or requirements for canton approval for employment.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">Switzerland is divided into cantons, which are given substantial discretion in the implementation of laws. As a result, there is significant variation in access to the labor market, integration, and social assistance for refugees across the country. Asylum seekers are randomly allocated to a canton and can request permission to work but are subject to the precedence of domestic employees, as regulated by the Federal Act on Foreign Nationals and Integration. A survey by the Swiss Forum for Migration and Population Studies also found that asylum seekers are very unlikely to look for employment outside their assigned canton, as the probability of finding work and receiving the approval of the other canton is very low. Therefore, Swiss cantons act as de facto independent, closed economies for refugees and asylum seekers. </p>



  <p class="wp-block-paragraph">The State Secretariat for Migration reports that only nine percent of asylum seekers between the ages of 18 and 65 are active in the labor market. An obstacle to the employment of refugees is that personal qualifications such as diplomas from other countries are not recognized for the most part. Language is another barrier for refugees. Labor market access regulations favor those who speak the language that is most widely spoken in the canton to which they were assigned (the main languages being German, French, and Italian).</p>



  <p class="wp-block-paragraph"><strong>Sources</strong>:</p>



  <p class="wp-block-paragraph">Adriana Romer and Lucia Della Torre, <em>Country Report: Switzerland</em> (Brussels: European Council on Refugees and Exiles, 2021), <a href="https://asylumineurope.org/wp-content/uploads/2022/04/AIDA-CH_2021update.pdf">https://asylumineurope.org/wp-content/uploads/2022/04/AIDA-CH_2021update.pdf</a></p>



  <p class="wp-block-paragraph">Government of Switzerland, Foreign Nationals and Integration Act, 2005. December 16, 2005, <a href="https://fedlex.data.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/2007/758/20200401/en/pdf-a/fedlex-data-admin-ch-eli-cc-2007-758-20200401-en-pdf-a.pdf">https://fedlex.data.admin.ch/filestore/fedlex.data.admin.ch/eli/cc/2007/758/20200401/en/pdf-a/fedlex-data-admin-ch-eli-cc-2007-758-20200401-en-pdf-a.pdf</a></p>



  <p class="wp-block-paragraph">Government of Switzerland, Asylum Act, June 26, 1998, <a href="https://www.fedlex.admin.ch/eli/cc/1999/358/en">https://www.fedlex.admin.ch/eli/cc/1999/358/en</a></p>



  <p class="wp-block-paragraph">Kirk Bansak, Jeremy Ferwerda, Jens Hainmueller, Andrea Dillon, Dominik Hangartner, Duncan Lawrence, and Jeremy Weinstein, “Improving refugee integration through data-driven algorithmic assignment.” <em>Science</em> 359, no. 6373 (2018): 325-329, <a href="https://www.science.org/doi/10.1126/science.aao4408">https://www.science.org/doi/10.1126/science.aao4408</a></p>



  <p class="wp-block-paragraph">Michaela Slotwinski, Alois Stutzer, and Roman Uhlig, “Are Asylum Seekers More Likely to Work with More Inclusive Labor Market Access Regulations?” <em>Swiss Journal of Economics and Statistics</em> 155, no. 17 (2019), <a href="https://sjes.springeropen.com/articles/10.1186/s41937-019-0046-2">https://sjes.springeropen.com/articles/10.1186/s41937-019-0046-2</a></p>



