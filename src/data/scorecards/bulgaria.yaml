content: |-
  <p class="wp-block-paragraph">According to UNHCR, Bulgaria hosted 21,770 refugees and 1,691 asylum seekers in 2021. The most common countries of origin for refugees and asylum seekers were Syria and Iraq. A large number of refugees were stateless, as well, comparable to the number of refugees from Iraq.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Bulgaria is a party to both the 1951 Refugee Convention and its 1967 Protocol, as well as the ICESCR. These obligations are supplemented by the EU Regional Council Directive, which requires that member states authorize recognized refugees to work on par with nationals. Bulgaria also has passed national legislation setting forth the rights of refugees, in particular its Law on Asylum and Refugees.</p>



  <p class="wp-block-paragraph">Bulgaria grants recognized refugees full access to employment opportunities in every sector, per the Law for Employment Promotion. However, asylum seekers are denied the right to undertake employment for the first three months. Recognized refugees have access to employment and social benefits when unemployed. Under the law, asylum seekers and refugees also have access to vocational training, and education is free of charge. </p>



  <p class="wp-block-paragraph">Recognized refugees are not restricted in their freedom of movement. Asylum seekers, by contrast, may be restricted to a particular area or administrative zone, as determined by the asylum authority.</p>



  <p class="wp-block-paragraph">Refugees and asylum seekers face difficulty in obtaining recognition of their credentials. There is a legal process for recognition of foreign diplomas; however, the process is convoluted and requires retaking exams and schooling in certain circumstances.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">Very few refugees seek employment because they consider Bulgaria to be a transit country. According to one survey respondent, many receive remittances from relatives, enabling them to continue westward. Those who seek work tend to find temporary and irregular jobs, mostly in restaurants and retail stores. Professional qualifications or university degrees from refugees’ countries of origin are not generally recognized in Bulgaria, and it is difficult to open a business because of barriers to opening bank accounts.</p>



  <p class="wp-block-paragraph">Initial restrictions on asylum seekers’ right to work and mobility often force them to work informally. In September 2017, Bulgaria restricted registered asylum seekers’ movement to four zones. Asylum seekers cannot leave their assigned zone without official permission from the State Agency for Refugees. While there are exceptions, this regulation is generally enforced.</p>



  <p class="wp-block-paragraph">Furthermore, Bulgaria employs accelerated asylum procedures and sometimes relies on unwritten assumptions that certain countries are “safe,” resulting in the rejection of 100 percent of claims from countries such as Turkey, Morocco, Tunisia, Algeria, and others. These barriers to territorial access and legal status impede refugees’ access to work rights in the country.</p>



  <p class="wp-block-paragraph">In 2013, the Program for Employment and Education of Refugees established the employment of refugees as a priority for the Labor Offices. The program included teaching Bulgarian, training, and subsidized employment, all funded by the state. However, these efforts were intended to benefit only 200 refugees and ultimately only one secured employment. An impediment was that the advertisements, application procedures, and documentation were available only in Bulgarian.</p>



  <p class="wp-block-paragraph">In 2016, the Labor Offices initiated a specialized refugee employment and training program for those with international protection. The program is set to run through the end of 2022.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong></p>



