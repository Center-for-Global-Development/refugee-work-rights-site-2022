title: Malaysia
country_id: MY
levels:
  de_jure: "2"
  de_facto: "2"
  overall: "2"
content: |-
  <p>According to UNHCR, Malaysia hosted some 131,101 refugees and 52,012 asylum seekers registered with UNHCR in 2021. Some 120,126 are from Myanmar, with the vast majority being Rohingya.</p>
  <p><strong>De Jure Summary</strong></p>
  <p><i></i>Despite hosting one of the largest refugee populations in Southeast Asia, Malaysia is not a party to the 1951 Refugee Convention nor to the ICESCR. Malaysia has not developed any domestic or administrative framework that provides rights for refugees. Malaysia’s immigration laws do not distinguish between refugees, asylum seekers, irregular migrants, and undocumented persons.</p>
  <p>Therefore, refugees do not have access to fundamental rights such as legal status, safe and lawful employment, formal education, and equal protection of the law. Refugees are at constant risk of arrest, detention, and exploitation. Malaysian law continues to classify refugees as “illegal immigrants.” Nevertheless, UNHCR conducts a registration process and provides identity documentation that “may reduce the risk of arrest” but “has no formal legal value in Malaysia.” However, since 2019, the situation of refugees in the country has worsened, as UNHCR has been denied entry into detention centers and is thus unable to provide protection to persons of concern.</p>
  <p>In a landmark case in 2014, an industrial court decided that a UNHCR-recognized refugee was wrongfully dismissed from employment. This decision holds that all employees, including those without legal status, are equal before the law.</p>
  <p><strong>De Facto Summary</strong></p>
  <p>In Malaysia, forcibly displaced people are deprived of their basic human rights, education, health, and work. Rohingya especially face significant segregation and discrimination. Given the lack of recognition from the government, refugees fear deportation and are subject to harassment and extortion. This harassment also limits refugees’ freedom of movement.</p>
  <p>Some refugees have de facto been able to obtain a visa and work in a limited number of sectors through existing labor migration schemes by forgoing UNHCR registration. Yet these jobs tend to be “dirty, dangerous and degrading” according to the United States Department of Labor. As a result, the majority of refugees work in the informal sector, where they are also subject to exploitation and abuse. NGOs report that employers often withhold refugees’ salaries, and refugees also do not have access to important services, such as bank accounts.</p>
  <p>The country has stated its intention to improve legal work rights for displaced people, with some previous instances limited in scope. For instance, in 2017, the country implemented a pilot program to grant formal work to 300 Rohingya refugees in a state-owned company and a private company. But no further action has been taken to provide regularization and access to employment to other displaced individuals.</p>
  <p>A recent report from the Institute for Democracy and Economic Affairs estimated that providing the right to work could generate over 4,000 jobs for Malaysians, 700 million USD in annual GDP, and 10 million USD in annual tax revenue by 2024.</p>
