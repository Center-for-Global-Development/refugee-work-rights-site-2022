title: United States
country_id: US
levels:
  de_jure: "4"
  de_facto: "4"
  overall: "4"
content: |-
  <p>According to UNHCR, the United States of America (US) hosted 337,870 refugees and 1,247,223 asylum seekers in 2021. The most common country of origin for refugees was China, and the most common country of origin for asylum seekers was El Salvador.</p>
  <p><strong>De Jure Summary</strong></p>
  <p>While the US is not a party to the 1951 Refugee Convention, it agreed to uphold the convention’s provisions by ratifying the 1967 Protocol. In US domestic law, this commitment to international refugee law is reflected by the Refugee Act of 1980, which incorporates the refugee definition contained in the 1951 Refugee Convention.</p>
  <p>The US grants the right to work to those with refugee status through resettlement or a grant of asylum. Resettled refugees may begin working immediately upon entry into the US, and the Office of Refugee Resettlement supports programming that facilitates their job placement and training, business creation, and credentialing. Asylum seekers may apply for work authorization 150 days after filing an asylum application, which may be granted as soon as 30 days later. In addition to these avenues, people granted parole, Temporary Protected Status, or Deferred Enforced Departure are eligible for work authorization.</p>
  <p>Since 2019, the US has restricted access to US territory for asylum seekers coming from the Americas through executive rulemaking, creating nearly insurmountable barriers for the largest populations seeking asylum. These policies include the Migrant Protection Protocols, also known as the Remain in Mexico policy, which requires non-Mexican asylum seekers who enter at the US southern border to pursue their US asylum claims while remaining physically in Mexico; and the COVID-19 pandemic-era use of Title 42, a public health law, to bar asylum seekers from entering the US and to expel those found inside the country (the same public health standard is not applied to citizens). Both policies are the subject of court disputes at the time of writing.</p>
  <p><strong>De Facto Summary</strong></p>
  <p>In the US, the Trump administration significantly limited access to employment eligibility for asylum seekers by changing regulations and diverting resources such as staff away from adjudication, leading to long delays in the processing of employment documents. This prevented asylum seekers from being able to legally work, made them reliant on private charity for support (since they are ineligible for federal benefits), pushed them into exploitative informal work, and made it difficult for them to afford shelter, food, and healthcare. Anti-immigrant rhetoric such as &#8220;Hire American,&#8221; followed by the COVID-19 pandemic, also impacted refugees’ ability to obtain formal employment.</p>
  <p>De facto barriers to freedom of movement in the US occur largely when individuals lack identification documents. The long delays in issuing work authorization documents make it harder for asylum seekers and asylees to travel if they do not have other valid government ID.</p>
  <p>In the US, healthcare is generally obtained through employment, so inaccessibility to formal work also hinders access to healthcare. Asylum seekers are eligible for marketplace health coverage (known as “Obamacare”), but only once they have obtained work authorization. Resettled refugees are eligible for health benefits through the Office of Refugee Resettlement and some states; however, only some states grant refugees the right to state Medicaid programs.</p>
  <p><strong>Sources</strong>:</p>
  <p>American Immigration Council, “Temporary Protected Status: An Overview,” April 27, 2022, <a href="https://www.americanimmigrationcouncil.org/research/temporary-protected-status-overview">https://www.americanimmigrationcouncil.org/research/temporary-protected-status-overview</a></p>
  <p>New York Times, “Supreme Court Struggles Over Biden’s Bid to end ‘Remain in Mexico’ Program”, April 26, 2022, <a href="https://www.nytimes.com/2022/04/26/us/politics/supreme-court-remain-in-mexico.html">https://www.nytimes.com/2022/04/26/us/politics/supreme-court-remain-in-mexico.html</a></p>
  <p>Office of Refugee Resettlement, “Resettlement Services,” last updated February 23, 2022, <a href="https://www.acf.hhs.gov/orr/programs/refugees">https://www.acf.hhs.gov/orr/programs/refugees</a></p>
  <p>Sarah McCammon, Miguel Macias, Justine Kenin, “Remain in Mexico, the Trump era policy that Haunts the Biden Administration,” October 22, 2021, <a href="https://www.npr.org/2021/10/22/1048492677/remain-in-mexico-the-trump-era-policy-that-haunts-the-biden-administration">https://www.npr.org/2021/10/22/1048492677/remain-in-mexico-the-trump-era-policy-that-haunts-the-biden-administration</a></p>
  <p>US Citizenship and Immigration Services, “Asylum,” last updated April 28, 2022, <a href="https://www.uscis.gov/humanitarian/refugees-and-asylum/asylum">https://www.uscis.gov/humanitarian/refugees-and-asylum/asylum</a></p>
  <p>US Citizenship and Immigration Services, “Refugees,” last updated March 2, 2022, <a href="https://www.uscis.gov/humanitarian/refugees-and-asylum/refugees">https://www.uscis.gov/humanitarian/refugees-and-asylum/refugees</a></p>
  <p>US Department of Health and Human Services, “Immigration status and the marketplace,” last accessed May 24, 2022, <a href="https://www.healthcare.gov/immigrants/immigration-status/">https://www.healthcare.gov/immigrants/immigration-status/</a></p>
  <p>US Department of Health and Human Services, “Cash &amp; Medical Assistance,” last accessed May 24, 2022, <a href="https://www.acf.hhs.gov/orr/programs/refugees/cma">https://www.acf.hhs.gov/orr/programs/refugees/cma</a></p>
  <p>US Government, US Code: Title 42, July 1, 1944, <a href="https://www.law.cornell.edu/uscode/text/42">https://www.law.cornell.edu/uscode/text/42</a></p>
