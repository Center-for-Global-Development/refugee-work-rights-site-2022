content: |-
  <p class="wp-block-paragraph">According to UNHCR, Bangladesh hosted 889,775 refugees and 27 asylum seekers in 2021. Nearly all refugees were from Myanmar, with only 11 refugees from elsewhere.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Bangladesh is not a party to the 1951 Refugee Convention nor its 1967 Protocol. However, in a 2017 ruling, the Supreme Court held that the 1951 Refugee Convention was part of customary international law and therefore binding, notwithstanding formal ratification. Bangladesh is party to the UN Convention Against Torture of 1984 and as such respects the principle of non-refoulement (Article 2). The Constitution of Bangladesh guarantees all persons on the nation’s territory the right to enjoy protection of the law and prohibits forced labor beyond citizens, including all those within its boundaries.</p>



  <p class="wp-block-paragraph">The country has no domestic law relating to refugees, and as such refugees are not guaranteed formal legal status, are not guaranteed the right to work. They are considered ‘illegal foreigners’ under the Foreigners Act of 1946, though classified as “Forcibly Displaced Myanmar Nationals” by the government. Refugees are guaranteed access to legal aid through the Legal Aid Services Act of 2000.</p>



  <p class="wp-block-paragraph">Rohingya refugees in Bangladesh are interned in camps in Cox’s Bazar. UNHCR and the government jointly register Rohingya refugees with the aims of enabling access to essential services and future voluntary repatriation to Myanmar.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">In Bangladesh, the rights of Rohingya refugees are significantly curtailed. Legally, they are not able to work, meaning many revert to volunteering with the UN or local NGOs, or setting up small informal businesses both within and just outside the camps. These shop owners are frequently harassed, and their shops, which are run without obtaining commercial licenses or paying taxes, are frequently destroyed by local officials. Rohingya are also informally employed by locals to work outside the camps—mostly as day laborers in the fields or as domestic help.</p>



  <p class="wp-block-paragraph">These informal arrangements have been threatened by an increasing militarization of the camps; the Bangladeshi government has taken steps to build barbed wire fencing and guard towers. The government also periodically restricts Internet access and confiscates cell phones. Aid groups have argued that these measures seriously hampered their ability to provide emergency health services during the COVID-19 pandemic.</p>



  <p class="wp-block-paragraph">Most Rohingya want to return to Myanmar and have their citizenship rights restored when it is safe to do so. The Bangladeshi government and UNHCR have tried to organize repatriation opportunities, but refugees still feel that it is unsafe to return. Instead, the Bangladeshi government has begun moving tens of thousands of the Rohingya population, potentially involuntarily, to Bhasan Char Island, which provides limited livelihood opportunities. </p>



