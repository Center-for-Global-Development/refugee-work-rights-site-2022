content: |-
  <p class="wp-block-paragraph">According to UNHCR, France hosted 457,153 refugees and 82,032 asylum seekers in 2021. The most common countries of origin for people who were displaced were Afghanistan, Syria, Sri Lanka, Russia, and the Democratic Republic of Congo.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">France is a party to the 1951 Refugee Convention and its 1967 Protocol as well as the ICESCR. These international obligations are supplemented by the EU Regional Council Directive, which requires that member states authorize recognized refugees to work on par with nationals. France also has passed national legislation setting forth the rights of refugees, centrally its Code of Entry and Residence of Foreigners and Right of Asylum. </p>



  <p class="wp-block-paragraph">Refugees and those with subsidiary protection are afforded the right to work and freedom of movement once their status has been recognized by the government. For those with pending asylum applications, formal employment is allowable only after the application has been in process for six months. Refugees able to access formal employment must have initially obtained a temporary work permit prior to filing for a work permit, and they must produce a contract of employment for this work permit. Work permits are valid only for the duration of the employment contract. Prefectures have considerable authority in approving work permits to ensure that professions are adequately regulated, resulting in diversity in permit approvals across the country. </p>



  <p class="wp-block-paragraph">Refugees also need a work permit to access vocational training. Asylum seekers’ freedom of movement is restricted to the region of their assigned reception area, where they receive food, housing, and clothing; these benefits can be lost when they leave.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph"><span style="font-size: revert; color: initial;">Refugees and asylum seekers are generally supported with employment services and corresponding social support, such as language classes and vocational training. However, the qualification recognition system is “poorly efficient,” according to one survey respondent, which makes work in most occupations on the “shortage occupation” list more difficult to obtain. According to a study published by the French Institute of International Relations (IFRI), a majority of refugees work in jobs that are a “professional downgrade.” Work permit issuance is also dependent on these lists, and, in practice, it is very difficult for people who have been displaced to obtain a work permit in a timely manner that supports their livelihood. Many therefore accept jobs that are below their skill level and require fewer prerequisites.</span></p>



  <p class="wp-block-paragraph">The government does fund NGO programs that support refugee self-employment, such as those developed by Singa, and there are many private initiatives doing the same. In practice, however, asylum seekers generally do not have efficient access to self-employment due to bureaucratic barriers regarding documentation and loans.<span style="font-size: revert; color: initial;">Additional services that support livelihoods, such as financial or healthcare services, are also different for those who have been displaced as compared to French citizens. After the first three months following their arrival, asylum seekers’ health coverage is restricted to emergency care, whereas the care offered to citizens covers a wider array of services. Financial services can also be more difficult for refugees to access, though the government has published a tool kit to help banks engage better on this subject.</span></p>



  <p class="wp-block-paragraph"><strong>Sources</strong></p>



  <p class="wp-block-paragraph">Gisti, “Demander l’asile en France: Le droit au travail,” accessed April 29, 2022, <a href="https://www.gisti.org/spip.php?article5157">https://www.gisti.org/spip.php?article5157</a></p>



  <p class="wp-block-paragraph">Laurent, Delbos and Claire Tripier, Country Report: France (Brussels: European Council on Refugees and Exiles, 2020), <a href="https://asylumineurope.org/wp-content/uploads/2021/03/AIDA-FR_2020update.pdf">https://asylumineurope.org/wp-content/uploads/2021/03/AIDA-FR_2020update.pdf</a></p>



  <p class="wp-block-paragraph">S. Bilongand F. Salin, L’emploi des personnes réfugiées: des trajectoires professionnelles aux politiques de recrutement des entreprises (Paris: Institut Français des Relations Internationales, 2022), <a href="https://www.ifri.org/fr/publications/etudes-de-lifri/lemploi-refugiees-trajectoires-professionnelles-aux-politiques-de">https://www.ifri.org/fr/publications/etudes-de-lifri/lemploi-refugiees-trajectoires-professionnelles-aux-politiques-de</a></p>



