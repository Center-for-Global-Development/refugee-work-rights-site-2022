content: |-
  <p class="wp-block-paragraph">According to UNHCR, Serbia hosted 5,051 refugees and “persons under other forms of international protection” in 2021. The most common countries of origin were Afghanistan, Syria, and Bangladesh.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Serbia is a party to the 1951 Refugee Convention, its 1967 Protocol, and the ICESCR. Serbia’s domestic legislation, including the Law on Asylum and Temporary Protection (Asylum Act) and the Law on Employment of Foreign Citizens (Employment of Foreigners Act), governs rights for refugees, asylum seekers, and those with subsidiary protection. Individuals in all three categories are guaranteed freedom of movement and the right to work.</p>



  <p class="wp-block-paragraph">Once a refugee is granted asylum in Serbia, they enjoy work rights equal to those of “permanently residing foreigners” under the Asylum Act. For those granted subsidiary protection, the requirements of the Asylum Act and of the Employment of Foreigners Act are in conflict with each other, as the Asylum Act states that grants of asylum and subsidiary protection come with equal work rights, but the Employment of Foreigners Act specifies that persons with subsidiary protection shall be granted work permits only for the duration of their protection status. As a result, work permits for persons granted asylum are issued for five years, while work permits for persons with subsidiary protection are issued for one year.</p>



  <p class="wp-block-paragraph">Asylum seekers are able to seek a work permit nine months after the submission of their asylum application if the application is still pending. These work permits require a fee and are valid for six months, renewable for the time that the application is pending.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">Serbia does not formally encourage the employment of refugees through any government programming; as a result, the de facto conditions of employment largely depend on refugees’ ability to navigate the language and labor market. Many people who have been displaced work in jobs that require low levels of education, regardless of the level of education they bring with them from their country of origin.</p>



  <p class="wp-block-paragraph">Self-employment is bureaucratically challenging for refugees and citizens alike. However, due to discrimination against the migrant population, it can be more difficult for refugees to obtain even the minimum level of processing of the required documentation, according to one survey respondent.</p>



  <p class="wp-block-paragraph">Additionally, in order to establish a company, it is necessary to submit a valid passport—a document that refugees often do not have. Refugees can be provided with identification documents on the condition that they have a registered address. These documents allow refugees to access all their rights wherever they live temporarily.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong>:</p>



  <p class="wp-block-paragraph">Belgrade Centre for Human Rights, <em>Right to Asylum in the Republic of Serbia Periodic Report for July–September 2020 </em>(Belgrade: Belgrade Centre for Human Rights, 2020), <a href="http://azil.rs/en/wp-content/uploads/2020/11/Right-to-Asylum-in-the-Republic-of-Serbia-july-september-2020.pdf">http://azil.rs/en/wp-content/uploads/2020/11/Right-to-Asylum-in-the-Republic-of-Serbia-july-september-2020.pdf</a></p>



  <p class="wp-block-paragraph">Government of Serbia, Law on Employment of Foreign Citizens, 2019, <a href="https://www.refworld.org/pdfid/6048fe6f4.pdf">https://www.refworld.org/pdfid/6048fe6f4.pdf</a></p>



  <p class="wp-block-paragraph">Government of Serbia, Law on Asylum and Temporary Protection, 2018, <a href="https://www.refworld.org/pdfid/6050d9c24.pdf">https://www.refworld.org/pdfid/6050d9c24.pdf</a></p>



  <p class="wp-block-paragraph">Nikola Kovačević, “Access to the Labour Market: Serbia,” European Council on Refugees and Exiles, last updated May 2, 2022, <a href="https://asylumineurope.org/reports/country/serbia/content-international-protection/employment-and-education/access-labour-market/">https://asylumineurope.org/reports/country/serbia/content-international-protection/employment-and-education/access-labour-market/</a></p>



