content: |-
  <p class="wp-block-paragraph">According to UNHCR, Niger hosted 249,945 refugees and 16,501 asylum seekers as well as 50,384 others of concern in 2021. The most common countries of origin for refugees and asylum seekers were Nigeria and Mali.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Niger is a party to the 1951 Refugee Convention and its protocol, the ICESCR, and the Organization of African Unity regional convention. Niger enacted the Refugee Law (Law No 97-016) in 1997, with an accompanying decree in 1998. The law guarantees freedom of movement for refugees and asylum-seekers (Article 10) and the right to work for most refugees (Article 9). ECOWAS nationals have the same access to the labor market as Nigeriens and do not need a work permit. Labor market access for non-ECOWAS nationals depends on bilateral agreements with the origin country.</p>



  <p class="wp-block-paragraph">Refugees in Niger can register a business, own property (including land), and access health, education, and financial systems. They cannot work in the public sector.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">The Nigerien government imposes few barriers on refugees and asylum-seekers in practice. For work, most refugees originate from ECOWAS countries and therefore have the right to work in wage and self-employment. In practice, there is also little enforcement; UNHCR estimates that 76 percent of refugees in rural areas work in agriculture, for instance. Ten percent of refugees in urban areas work in the formal sector. For movement and residence, three camps were closed as part of an out-of-camp, urbanization strategy. One camp remains, Sayam Forage, though refugees are allowed to leave. Refugees have the right to move freely across the country, though there are reports of government employees demanding bribes.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong>:</p>



  <p class="wp-block-paragraph"><em>IDA19 Mid-Term Refugee Policy Review (English).&nbsp;</em>23 September, 2021. Washington, D.C.: World Bank Group.&nbsp;<a href="http://documents.worldbank.org/curated/en/826851636575674627">http://documents.worldbank.org/curated/en/826851636575674627</a></p>



