content: |-
  <p>According to UNHCR, Tanzania hosted 202,635 refugees and 27,829 asylum seekers in 2021. The majority of refugees and asylum seekers were from Burundi and the Democratic Republic of Congo.</p>
  <p><strong>De Jure Summary</strong></p>
  <p><i></i>Although Tanzania is a party to the 1951 Refugee Convention, its 1967 Protocol, the ICESCR, and the Organization of African Unity regional convention, the country’s national laws and practices regarding employment are not fully aligned with its international commitments. Rights, status, and treatment of asylum seekers and refugees in Tanzania are governed by the Refugees Act of 1998 and the 2003 National Refugee Policy.</p>
  <p>The Refugees Act requires refugees to reside in “designated areas,” which in practice are camps, severely restricting refugees’ freedom of movement. This law also states that work permits may be offered to refugees but does not guarantee refugees the right to work. The 2003 National Refugee Policy goes further, allowing “small income generating activities within the camps” for refugees. The Non-Citizens Employment Act of 2015 further classifies these work permits for refugees but falls short of guaranteeing any expanded rights to lawful employment.</p>
  <p><strong>De Facto Summary</strong></p>
  <p>While Tanzania has hosted large numbers of refugees for years, in practice, Tanzania imposes some of the most significant barriers to economic inclusion for refugees in the world. After former president John Magufuli told Burundian refugees to “go home,” Human Rights Watch and other organizations have documented torture, disappearances, and beatings committed by Tanzanian authorities against Burundian refugees.</p>
  <p>The government wants Burundian refugees to be repatriated, and violence and economic crackdowns are intended to send that message. While the current government has vowed to improve human rights conditions for Tanzanians, its position on refugees is unclear.</p>
  <p>Refugees must live in one of three camps, and even in the camps, livelihood activities are not permitted. All camp markets were closed in 2019. Refugees are rarely allowed to leave the camps for work, school, or economic activities. Tanzania originally joined the Comprehensive Refugee Response Framework intended to promote durable solutions but then withdrew and declined the associated World Bank funding.</p>
  <p><strong>Sources</strong>:</p>
  <p>Clayton Boeyink and Jean-Benoît Falisse, “Kicking Refugees Out Makes Everyone Less Safe,” <em>Foreign Policy</em>, February 18, 2021, <a href="https://foreignpolicy.com/2021/02/18/tanzania-burundi-kicking-refugees-out-makes-everyone-less-safe/">https://foreignpolicy.com/2021/02/18/tanzania-burundi-kicking-refugees-out-makes-everyone-less-safe/</a></p>
  <p>Eline Anker, “Will Tanzania Remain a Safe Haven for Refugees?” <em>Norwegian Refugee Council</em>, May 17, 2018, <a href="https://www.nrc.no/news/2018/may/will-tanzania-remain-a-safe-haven-for-refugees/">https://www.nrc.no/news/2018/may/will-tanzania-remain-a-safe-haven-for-refugees/</a></p>
  <p>Government of Tanzania, Non-citizens (Employment Regulation) Act, 2015, <a href="https://procedures.tic.go.tz/media/The%20non-citizens%20(employment%20Regulations)%20Act,%202015.pdf">https://procedures.tic.go.tz/media/The%20non-citizens%20(employment%20Regulations)%20Act,%202015.pdf</a></p>
