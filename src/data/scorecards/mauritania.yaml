title: Mauritania
country_id: MR
levels:
  de_jure: "3"
  de_facto: "2"
  overall: "2"
content: |-
  <p class="wp-block-paragraph">According to UNHCR, Mauritania hosted 101,942 refugees and 3,369 asylum seekers in 2021. The most common countries of origin for refugees and asylum seekers were Mali and Western Sahara.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Mauritania is a party to the 1951 Refugee Convention and its 1967 Protocol, the ICESCR, and the 1969 Organization of African Unity regional convention. There is currently no national asylum law. A draft law was developed in 2016 and has been in discussion ever since, with the <a href="https://reliefweb.int/report/mauritania/mauritania-supporting-inclusion-refugees-national-social-safety-net">government pledging to pass the law during the 2019 Global Refugee Forum</a>. If approved, this law would provide a more comprehensive framework to manage both refugees and asylum-seekers.</p>



  <p class="wp-block-paragraph">In the absence of a refugee law, UNHCR manages refugee registration and management. There is <a href="https://documents1.worldbank.org/curated/en/826851636575674627/pdf/IDA19-Mid-Term-Refugee-Policy-Review.pdf">some oversight by the National Consultative Commission on Refugees (CNCR)</a>, as included within <a href="https://www.refworld.org/legal/decreees/natlegbod/2005/fr/63033">Decree 022/2005</a>. Despite the fact that the Decree allows refugees to move freely within Mauritania, 95 percent of refugees live in and around the Mbera refugee camp, while the remainder of both refugees and asylum-seekers live in urban areas. Historically, refugees were only able to register with UNHCR if they resided in a camp, but this policy was relaxed in 2020.</p>



  <p class="wp-block-paragraph">The Decree also specifies that refugees have the same rights as nationals within the private sector (but does not allow them to work in the public sector). However, Decree 2018-025, which restricts foreigner engagement in the labor market, makes no exceptions for refugees. The government is <a href="https://documents1.worldbank.org/curated/en/826851636575674627/pdf/IDA19-Mid-Term-Refugee-Policy-Review.pdf">apparently in discussions to clarify this</a>.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">Given the policy context above, and the fact that <a href="https://www.ilo.org/africa/countries-covered/mauritania/lang--fr/index.htm">more than 70 percent of the work in Mauritania is informal</a>, it is extremely difficult for refugees to find work in the formal sector. In addition, refugees have <a href="https://documents1.worldbank.org/curated/en/826851636575674627/pdf/IDA19-Mid-Term-Refugee-Policy-Review.pdf">reported difficulties getting their qualifications and experience recognized</a>. A <a href="https://data.unhcr.org/en/documents/details/71198">study conducted by UNHCR in 2019</a> looked at 10,000 migrants and refugees in the second largest city, Nouadhibou. 64 percent were recognized refugees, and 7 percent were applying for asylum. Across the board, the main source of income was working on building sites or in the construction sector, although none had a formal work contract.</p>



  <p class="wp-block-paragraph">Financial services are also limited. While most refugees are able to access a bank account (given they have a national identification number), only <a href="https://documents1.worldbank.org/curated/en/826851636575674627/pdf/IDA19-Mid-Term-Refugee-Policy-Review.pdf">11 percent of urban refugees</a> had one as at 2019. In addition, only one percent of the loans taken out by camp-based refugees in 2017 were from micro-finance institutions. It is unclear exactly why this is the case, but may have something to do with difficulties having documentation recognised, as has been seen in other areas.</p>



  <p class="wp-block-paragraph">Decree 022/2005 allows refugees to enrol in all levels of education under the same conditions as nationals, yet <a href="https://www.fmreview.org/sites/fmr/files/FMRdownloads/en/when-does-internal-displacement-end/lindstrom.pdf">elementary education and healthcare comes at a cost</a>, both for Mauritanian nationals an for refugees. The lack of access to employment makes it very difficult for refugees to access these services. UNICEF and UNHCR fund placements for refugee children in the Mbera camp, but still, <a href="https://documents1.worldbank.org/curated/en/826851636575674627/pdf/IDA19-Mid-Term-Refugee-Policy-Review.pdf">only 36 percent were enrolled</a> in primary education and 5 percent in secondary education. Similarly, UNHCR and others fund healthcare services within the Mbera camp, and they are taking steps to <a href="https://reporting.unhcr.org/operational/operations/mauritania">integrate these services into the national health system</a>.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong>:</p>



