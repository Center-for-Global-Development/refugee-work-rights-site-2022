  <p class="wp-block-paragraph">National Legislative Bodies / National Authorities, <em>Mauritanie: Décret No. 2005-022 du 2005 fixant les modalités d&#8217;application en République Islamique de Mauritanie des Convention internationales relatives aux réfugiés</em>, 3 March 2005, available at: <a href="https://www.refworld.org/docid/492530d02.html">https://www.refworld.org/docid/492530d02.html</a></p>



  <p class="wp-block-paragraph">National Legislative Bodies / National Authorities, <em>Mauritania: Arrêté n° 0782 portant établissement de la Carte d&#8217;Identification de Refugié Malien à M&#8217;Berra (Moughataa de Bassikounou, Wilaya du Hodh Charghi)</em>, 29 October 2018, available at: <a href="https://www.refworld.org/docid/60a501d74.html">https://www.refworld.org/docid/60a501d74.html</a></p>



