title: Guyana
country_id: GY
levels:
  de_jure: "1"
  de_facto: "3"
  overall: "3"
content: |-
  <p class="wp-block-paragraph">According to UNHCR, Guyana hosted 23 refugees and 111 asylum seekers as well as 23,307 Venezuelans displaced abroad in 2021. Aside from Venezuelans displaced abroad, the majority of asylum seekers were from Cuba.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Guyana does not have national asylum and refugee legislation or a government-led asylum procedure but has nevertheless welcomed Venezuelan refugees. Guyana is not a party to the 1951 Refugee Convention nor to its 1967 Protocol, but the country has ratified the ICESCR. Guyana is not a party to the American Convention on Human Rights.</p>



  <p class="wp-block-paragraph">The immigration authorities register Venezuelan migrants and provide them three-month stay permits, which afford them temporary protection. Venezuelans are not given the right to work with these temporary stay permits. Beyond the initial three months, a Venezuelan can renew their permit; however, this process is lengthy and often results in a loss of legal status. For non-Venezuelans, refugee status determination is carried out by UNHCR, and successful applicants are issued a UNHCR certificate with limited protections that does not include the right to work.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">Lack of work rights and minimal protections to stay lawfully result in precarious situations for refugees, who frequently work informally and are often at risk of deportation. The International Organization for Migration (IOM), through the Response for Venezuelans (R4V) Platform, also determined that Venezuelans living in Guyana experience limited access to formal employment and livelihoods. The language barrier hinders Spanish-speaking Venezuelans from accessing services and integrating in the English-speaking country. As a result, many workers, including migrants and refugees, work in the informal economy. A report from the International Labor Organization showed that in 2017 Guyana’s informal employment comprised 48 to 53 percent of total employment in the country, with the majority occurring in the agricultural sector. A 2019 IOM Displacement Tracking Matrix showed that 98 percent of Venezuelans interviewed in Guyana reported that income generation and employment were important needs that went unfulfilled.</p>



  <p class="wp-block-paragraph">The lack of a formal right to work leaves limited opportunities for refugees to gain self-reliance, and women and children are particularly vulnerable to sexual exploitation and trafficking. It has been reported that many displaced Venezuelans engage in sex work as a survival mechanism in Guyana.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong></p>



  <p class="wp-block-paragraph">Interagency Coordination Platform for Refugees and Migrants from Venezuela (R4V), “Legal Framework: Asylum and Migration,” June 2021, <a href="https://www.r4v.info/sites/default/files/2021-06/Legal%20framework%20-web.pdf">https://www.r4v.info/sites/default/files/2021-06/Legal%20framework%20-web.pdf</a></p>



  <p class="wp-block-paragraph">International Organization for Migration, Guyana Needs Assessment on Migration Governance (San José, Costa Rica: International Organization for Migration, 2021).</p>



  <p class="wp-block-paragraph">UNHCR, “Fact Sheet,” February 2022, <a href="https://www.r4v.info/en/document/unhcr-guyana-factsheet-jan-feb-2022">https://www.r4v.info/en/document/unhcr-guyana-factsheet-jan-feb-2022</a></p>



  <p class="wp-block-paragraph">UNHCR, Refugee Data Finder, accessed May 23, 2022, <a href="https://www.unhcr.org/refugee-statistics/download/?url=3HMho5">https://www.unhcr.org/refugee-statistics/download/?url=3HMho5</a></p>



  <p class="wp-block-paragraph">UNHCR, “Submission by the United Nations High Commissioner for Refugees for the Office of the High Commissioner for Human Rights’ Compilation Report Universal Periodic Review: 3rd Cycle, 35th Session: Guyana,” accessed April 29, 2022, <a href="https://www.refworld.org/pdfid/5e1732dd2.pdf">https://www.refworld.org/pdfid/5e1732dd2.pdf</a></p>



