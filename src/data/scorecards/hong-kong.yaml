title: Hong Kong
country_id: HK
levels:
  de_jure: "1"
  de_facto: "2"
  overall: "2"
content: |-
  <p class="wp-block-paragraph">According to UNHCR, Hong Kong hosted 265 refugees and no asylum seekers in 2021.&nbsp; The most common countries of origin for asylum seekers were Somalia, Yemen, and Rwanda.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">The Hong Kong Special Administrative Region (HKSAR) is not a party to the 1951 Refugee Convention or its 1967 Protocol. HKSAR does not have any domestic legal framework providing the right to asylum or protection of refugees. The ICESCR is applicable in its territories.&nbsp;</p>



  <p class="wp-block-paragraph">Since 2014, HKSAR has implemented the “unified screening mechanism” (USM) for determining claims for non-refoulement protection. However, since the USM was launched in 2014, only 1 percent of applicants have been recognized.In 2021 the Immigration Ordinance was passed, introducing “fast-track” procedures to the USM process; these are largely seen as additional barriers to successful recognition.</p>



  <p class="wp-block-paragraph">People seeking protection may apply only if they are subject to removal from HKSAR and do not have the right to reside in another foreign territory that could grant them non-refoulement protection. During these proceedings, no temporary protection is afforded, and individuals are classified as “illegal immigrants.” If their application is successful, refugees are protected from removal on a temporary basis, as long as HKSAR deems the claim to be substantiated. This leaves refugees in a constant precarious and deportable state.</p>



  <p class="wp-block-paragraph">The 2021 Immigration Ordinance bars recognized non-refoulement claimants from any paid or unpaid lawful employment. There does exist, however, a discretionary process for recognized claimants to apply to the Immigration Department for a six-month work permit.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">In practice, only a few non-refoulement claimants are able to obtain work permits. Approvals have increased, but the permit process is complex, requires an employment contract, and is limited to six months at a time. The few that have the permit also struggle to find formal jobs as the six-month duration of the permit is too short to provide stability. Moreover, self-employment is not allowed.</p>



  <p class="wp-block-paragraph">The government provides a monthly humanitarian assistance package to claimants. The support includes food cards; housing allowance paid directly to the landlord; transportation support; and stipend to cover utilities and other basic needs. If a refugee works, they can risk losing this support. However, the assistance does not grant enough cash to cover daily expenses, and refugees in Hong Kong commonly live below the poverty line. &nbsp;</p>



  <p class="wp-block-paragraph">Despite the risks, many claimants in Hong Kong resort to work informally. Most work in low-paid sectors and are also common targets for criminal groups. Furthermore, due to the weak labor rights in Hong Kong, refugees and migrant workers are often subject to exploitation and abuse without access to support to report violations.</p>



  <p class="wp-block-paragraph">With the argument that Hong Kong is not party to the Refugee Convention, immigration officers deny asylum seekers the access to the territory or force many to return.&nbsp; Many asylum seekers are not even able to present their cases and request protection in Hong Kong. Those that ultimately enter the country undergo significant violations to their rights like cavity searches, forced signing of documents without proper interpretation assistance, verbal abuse, and humiliation.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong></p>



