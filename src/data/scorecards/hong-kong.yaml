  <p class="wp-block-paragraph">Government of the Hong Kong Special Administrative Region, “Humanitarian Assistance for Non-refoulement Claimants,” February 15, 2017, <a href="https://www.info.gov.hk/gia/general/201702/15/P2017021500554.htm">https://www.info.gov.hk/gia/general/201702/15/P2017021500554.htm</a>.</p>



  <p class="wp-block-paragraph">Government of Hong Kong, “Notice to Persons Making a Non-Refoulement Claim,” August 1, 2021, <em><a href="https://www.immd.gov.hk/pdf/non-refoulement_claim_flow_chart.pdf">https://www.immd.gov.hk/pdf/non-refoulement_claim_flow_chart.pdf</a></em></p>



  <p class="wp-block-paragraph">Justice Centre Hong Kong, “Parallel Report to the Committee on the Elimination of Discrimination Against Women,” February 2021. <a href="https://www.justicecentre.org.hk/framework/uploads/2021/02/JusticeCentre-Hong-Kong-CEDAW-LoI-submission_updated.pdf">https://www.justicecentre.org.hk/framework/uploads/2021/02/JusticeCentre-Hong-Kong-CEDAW-LoI-submission_updated.pdf</a> </p>



