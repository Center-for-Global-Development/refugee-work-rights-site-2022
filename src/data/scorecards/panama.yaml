  de_facto: "3"
  overall: "3"
content: |-
  <p>According to UNHCR, Panama hosted 2,542 refugees and 11,630 asylum seekers as well as 121,870 Venezuelans displaced abroad in 2021. The majority of refugees originated from Colombia, and the most common country of origin for asylum seekers from Nicaragua.</p>
  <p><strong>De Jure Summary</strong></p>
  <p>Panama guarantees the right to work to refugees and asylum seekers. In addition to being a party to the 1951 Refugee Convention, its 1967 Protocol, and the ICESCR, Panama is a party to several regional declarations: the 2014 Brazil Plan of Action, the 2016 San Jose Action Statement, and the Cartagena Declaration. In 2017, Panama joined the regional Comprehensive Regional Protection &amp; Solutions Framework (MIRPS, for its acronym in Spanish), as well.</p>
  <p>Panama offers both refugee status and asylum status, the latter for those seeking “temporary protection, while they await return to their country of origin or resettlement to a third state.” Refugees and asylees are offered the same rights and protections as those with temporary residence.</p>
  <p>Recognized refugees are provided a refugee card for a one-year renewable period. The card confers the right to apply for a work permit, under Executive Decree No. 5. For those undergoing the refugee status determination process, temporary residency is offered for one year, renewable, accompanied by the right to work, which was extended under Executive Decree No. 20 in May 2019. The Ministry of Labor has also issued a resolution to enable lawful work while renewal is pending.</p>
  <p>Law 74, Article 2, provides the right to apply for permanent residency after 3 years of maintaining refugee or temporary protection status. Those who maintain permanent residency for 10 years may apply for naturalization.</p>
  <p><strong>De Facto Summary</strong></p>
  <p>Asylum seekers who start the application process at the border cannot freely move or transit within the country until their status is determined. Those who obtain asylum receive a permit to move within the country.</p>
  <p>After three years, recognized refugees in Panama can apply for legal permanent residence in the country. This grants them indefinite work permits, access to bank accounts, and a pathway to citizenship.</p>
  <p>However, refugees who are not yet eligible for this residency barriers to labor market access. The one-year validity period of the work permit often deters employers. Refugees also struggle to open bank accounts. While there are some microcredit programs for refugees, financial inclusion is difficult until they obtain residency or citizenship.</p>
  <p>In other countries that host displaced Venezuelans, retail sales are a major livelihood strategy. However, in Panama, this violates the law. Even other jobs such as hairdressing, food production, or cleaning are restricted since they require special certifications provided by the government.</p>
  <p>Panama provides recourse for refugees, asylum seekers, and other forcibly displaced individuals to denounce abuses by their employers. However, informal employment is heavily penalized by the law; these sanctions have been recently increased and target primarily the hiring of undocumented individuals.</p>
  <p><strong>Sources</strong>:</p>
  <p>Government of Panama, Decreto Ejecutivo No. 5, Nuevas Disposiciones para la Protección de las Personas Refugiadas, 2018, January 14, 2018, <a href="https://www.refworld.org/topic,50ffbce5220,50ffbce5247,5a7c51514,0,,,PAN.html">https://www.refworld.org/topic,50ffbce5220,50ffbce5247,5a7c51514,0,,,PAN.html</a></p>
  <p>Government of Panama, Decreto Ley No. 3, Que crea el Servicio Nacional de Migración, la Carrera Migratoria y dicta otras disposiciones, February 22, 2008, <a href="https://www.acnur.org/fileadmin/Documentos/BDL/2008/6077.pdf">https://www.acnur.org/fileadmin/Documentos/BDL/2008/6077.pdf</a></p>
  <p>Grupo Articulador Regional del Plan de Acción Brasil, <em>El Derecho al Trabajo de las Personas Solicitantes de Asilo y Refugiadas en América Latina y el Caribe</em> (Brasilia: Grupo Articulador Regional del Plan de Acción Brasil, 2019), <a href="https://asylumaccess.org/wp-content/uploads/2019/07/Derechos-Laborales-Refugiadas-en-America-Latina-y-el-Caribe-final-ESP.pdf">https://asylumaccess.org/wp-content/uploads/2019/07/Derechos-Laborales-Refugiadas-en-America-Latina-y-el-Caribe-final-ESP.pdf</a></p>
