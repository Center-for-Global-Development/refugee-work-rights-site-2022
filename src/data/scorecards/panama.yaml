  <p>RET International, <em>Guía Informativa para las personas refugiadas y solicitantes de la condición de refugiado en Panamá</em> (Panama City: Oficina Nacional para la Atenció n de Refugiados, 2015), <a href="https://www.acnur.org/fileadmin/Documentos/Publicaciones/2016/10692.pdf?file=t3/fileadmin/Documentos/Publicaciones/2016/10692">https://www.acnur.org/fileadmin/Documentos/Publicaciones/2016/10692.pdf?file=t3/fileadmin/Documentos/Publicaciones/2016/10692</a></p>
