title: Italy
country_id: IT
levels:
  de_jure: "4"
  de_facto: "3"
  overall: "3"
content: |-
  <p class="wp-block-paragraph">According to UNHCR, Italy hosted 134,499 refugees and 53,686 asylum seekers in 2021. The most common countries of origin for refugees and asylum seekers were Pakistan and Nigeria.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Italy is a party to the 1951 Refugee Convention, its 1967 Protocol, and the ICESCR. These international obligations are supplemented by the EU Regional Council Directive, which requires that member states authorize recognized refugees to engage in lawful employment on par with nationals immediately after refugee status has been granted. Italy’s domestic legislation, in particular the Reception Decree, also sets forth the rights of asylum seekers and recognized refugees.</p>



  <p class="wp-block-paragraph">An asylum seeker may begin work 60 days after applying for asylum, according to the Reception Decree. Once refugee status is granted, a residence permit is supposed to be issued that provides the right to work, including in government employment. Refugees are treated the same as Italian citizens in terms of their ability to access employment and self-employment and to engage with professional associations and vocational training.</p>



  <p class="wp-block-paragraph">Refugees, asylum seekers, and those with subsidiary protection may move freely within Italy. They are given the right to stay within a reception center, but they are not obligated to do so and may settle outside such centers. Registered asylum seekers in government reception centers may be subject to curfews and restrictions on travel timing and permission, and they must request permission to transfer between reception centers.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">In practice, refugees in Italy experience long delays in obtaining a residence permit, and bureaucratic barriers are significant. It is common to have a short-term stay permit, with renewal requirements, for years on end, which makes obtaining a job very difficult. Employers are responsible for the documentation of anyone they hire, so many do not want to hire refugees with documentation that has a short period of validity or is close to expiration.</p>



  <p class="wp-block-paragraph">A stay permit filed under self-employment is less likely to be renewed than a stay permit filed under formal, wage employment, according to survey respondents. That, in conjunction with de facto discrimination in obtaining the documents necessary to open a business, makes formal self-employment quite difficult.</p>



  <p class="wp-block-paragraph">Additionally, very few refugees are able to access banks to obtain a loan or establish a savings account. Both asylum seekers and refugees are entitled to a monthly subsidy, but only if they are residing in a reception center. Otherwise, they do not receive these benefits. Most funding for resettlement and support services is provided by European governance structures and is distinct from services available to citizens.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong></p>



  <p class="wp-block-paragraph">Caterina Bove, Country Report: Italy (Brussels: European Council on Refugees and Exiles, 2020), <a href="https://asylumineurope.org/wp-content/uploads/2021/06/AIDA-IT_2020update.pdf">https://asylumineurope.org/wp-content/uploads/2021/06/AIDA-IT_2020update.pdf</a></p>



  <p class="wp-block-paragraph">Government of Italy, Reception Decree of 2015, August 18, 2015, <a href="https://www.gazzettaufficiale.it/eli/id/2015/09/15/15G00158/sg">https://www.gazzettaufficiale.it/eli/id/2015/09/15/15G00158/sg</a></p>



  <p class="wp-block-paragraph">UNHCR, Refugee Data Finder, accessed May 23, 2022, <a href="https://www.unhcr.org/refugee-statistics/download/?url=3HMho5">https://www.unhcr.org/refugee-statistics/download/?url=3HMho5</a></p>



