  <p class="wp-block-paragraph">Daniela Célleri, Situación laboral y aporte económico de inmigrantes en el norte de Quito-Ecuador (Bonn: Friedrich-Ebert-Stiftung, 2019), <a href="https://library.fes.de/pdf-files/bueros/quito/15204.pdf">https://library.fes.de/pdf-files/bueros/quito/15204.pdf</a></p>



  <p class="wp-block-paragraph">Diana Herrera, “Refugees and Migrants in Ecuador Face Rising Risks among Decreased Protections,” OpenGlobalRights, August 13, 2020, <a href="https://www.openglobalrights.org/refugees-and-migrants-in-ecuador-face-rising-risks-among-decreased-protections/">https://www.openglobalrights.org/refugees-and-migrants-in-ecuador-face-rising-risks-among-decreased-protections/</a></p>



