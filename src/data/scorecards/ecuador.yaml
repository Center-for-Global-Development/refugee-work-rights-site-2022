title: Ecuador
country_id: EC
levels:
  de_jure: "5"
  de_facto: "3"
  overall: "3"
content: |-
  <p class="wp-block-paragraph">According to UNHCR, Ecuador hosted 55,424 refugees and 6,565 asylum seekers as well as 446,679 Venezuelans displaced abroad in 2021. Aside from Venezuelans displaced abroad, the most common country of origin for refugees was Colombia.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Ecuador is a party to the main international instruments concerning refugees, such as the 1951 Refugee Convention and its 1967 Protocol, and the ICESCR, as well as regional instruments such as the 1984 Cartagena Declaration.</p>



  <p class="wp-block-paragraph">Since 2008, Ecuador’s constitution has guaranteed foreigners residing in the country the same rights as Ecuadorian nationals without discrimination of any kind. This guarantee extends to the right to work.</p>



  <p class="wp-block-paragraph">Once a person has applied for refugee status, Ecuador grants a 90-day humanitarian visa (renewable for an additional 30 days) that allows the individual to stay and work in the country. Once recognized as a refugee in Ecuador, the individual receives a temporary resident visa, valid for two years, after which they may apply for a permanent resident visa. In both cases, the right to work is guaranteed.</p>



  <p class="wp-block-paragraph">While Ecuador has a strong legal foundation protecting the rights for refugees, the government implemented a temporary visa from 2019-2020 for Venezuelans which required them to obtain the humanitarian visa prior to entering the country, limiting access to legal status and work authorization. The process required a valid passport, which many do not have, and has high costs. The visa program was stopped in 2020 and a plan to regularize roughly half of the Venezuelans in Ecuador, offering legal status and the right to work, was announced in 2021.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">Despite the promising de jure framework in place for refugees in Ecuador, the de facto reality does not fulfill expectations. According to multiple survey respondents, employers generally do not know that the humanitarian or refugee statuses grant the right to work; if a refugee does not have a Temporary or Permanent visa, only a humanitarian visa, they often cannot find formal work. Access to obtaining regular status persists as a primary barrier to the labor market.</p>



  <p class="wp-block-paragraph">The majority (88 percent) of foreigners in Ecuador work in the informal sector despite having the same legal right to work as Ecuadorian citizens. The Center for International Relations of the Institute of Higher National Studies found that in Quito, local integration is a constant challenge for refugees, and refugee workers have reported labor exploitation, abuse of power, discrimination, and even the need to provide sexual favors to obtain employment. However, a survey respondent highlighted the case study of Lago Agrio, a region on the border with Colombia, that identifies as a city of refuge and whose population consists of over 25 percent refugees.</p>



  <p class="wp-block-paragraph">Further, an Ecuadoran ID card is needed to open a formal bank account, which impedes financial integration for people who have been displaced. Banks and economic cooperatives do not see refugees as clients of interest and thus are not proactive in their outreach toward those populations.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong></p>



