content: |-
  <p class="wp-block-paragraph">According to UNHCR, Rwanda hosted 122,806 refugees and 228 asylum seekers. The majority of refugees and asylum seekers were from the Democratic Republic of Congo and Burundi.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Rwanda is a party to the 1951 Refugee Convention, its 1967 Protocol, the ICESCR, and the Organization of African Unity regional convention. Rwanda does make the reservation to the 1951 Refugee Convention “to determine the place of residence of refugees and to establish limits to their freedom of movement.” The status and treatment of refugees is governed by Law No. 13ter/2014 of 21/05/2014 Relating to Refugees, which includes rights to non-refoulement, freedom of movement, and freedom of employment.</p>



  <p class="wp-block-paragraph">Refugees are granted the same employment rights as Rwandan citizens, including labor protections, private-sector salary protections, and the right to self-employment. Rwanda also guarantees refugees the right to pursue Rwandan citizenship after they have demonstrated “self-reliance” for five years. Refugees live both in camps and urban areas and are granted freedom of movement. Those in camps may exit and enter to seek employment outside camps.</p>



  <p class="wp-block-paragraph">In 2022, the UK government proposed processing refugees and migrants at offshore sites in Rwanda; countries such as Denmark and Austria have considered similar plans. The Rwandan government states that those undergoing asylum procedures in Rwanda would be offered protection under Rwandan law and guaranteed the right to work. It remains to be seen how such a plan would to protect refugee rights.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">Rwanda’s refugee population is able to access some rights that are critical to refugees’ economic inclusion. Refugees are able to travel freely, though many live in camps and may face other limitations to their mobility. Research from Rwanda has shown that the proximity of host communities to refugee camps can boost refugees’ economic activity, yet many still struggle to integrate into local communities due to other constraints. Survey respondents indicated that refugees may be harassed when moving outside camps or their residences, or they may be subjected to checkpoints and other barriers.</p>



  <p class="wp-block-paragraph">Some refugees in Rwanda are able to live outside camps and subsequently access both formal and informal employment. Respondents noted that refugees are generally able to obtain work permits, register businesses, and compete for jobs alongside the wider population. However, work permits can be expensive. Businesses owned by refugees may face additional scrutiny from authorities, and despite the comparatively fewer barriers to employment than in neighboring countries, refugees in Rwanda still have considerably lower employment rates. Challenges remain due to a lack of work opportunities, misperceptions of refugees’ skills, and employers’ lack of knowledge of acceptable ID cards. COVID-19 has exacerbated some of these challenges and confined some refugees to camps.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong>:</p>



