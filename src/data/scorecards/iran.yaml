title: Iran
country_id: IR
levels:
  de_jure: "3"
  de_facto: "2"
  overall: "2"
content: |-
  <p class="wp-block-paragraph">According to UNHCR, Iran hosted 800,025 refugees and 34 asylum seekers in 2021. The majority of refugees were from Afghanistan and Iraq.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Iran is a party to the 1951 Refugee Convention and its 1967 Protocol; however, the country maintains reservations to Article 17, Article 24, and Article 26. Iran is also a party to the ICESCR.</p>



  <p class="wp-block-paragraph">Under Iran’s Labor Code, refugees are allowed to obtain a temporary work permit with a valid refugee card or immigration visa, which is valid for one year. However, this right to work is limited because the permit is very costly, must be renewed every year, and limits the type of occupations available to refugees.</p>



  <p class="wp-block-paragraph">Refugees’ freedom of movement is limited; two-thirds of Iran’s territory is designated as no-go areas for foreigners, imposing restrictions on areas where they may legally reside and work. Prima facie status was implemented for Afghan and Iraqi refugees before 2002; however, in 2003 a new process known as Amayesh was introduced to reregister all refugees. This process is complex, lengthy, and expensive and has resulted in many refugees losing their status.</p>



  <p class="wp-block-paragraph">Iran has effectively closed its doors to asylum seekers, starting with the right to asylum, and especially with respect to Afghan refugees. Since 2007, the registration process has been suspended for Afghans, and the Solutions Strategy for Afghan Refugees program has been implemented to facilitate the repatriation of Afghans back to Afghanistan. Despite the ongoing crisis in Afghanistan, the asylum process is still closed for Afghan refugees, repatriations are still ongoing, and refugees are being returned at the border by authorities.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">Iran has hosted large numbers of Afghan and other refugees for years, with a generally poor record on de facto access to rights. With the ongoing crisis in Afghanistan and the expected continuing outflow of refugees, there is concern that the situation will worsen.</p>



  <p class="wp-block-paragraph">In addition to blocking access to asylum, including by using detention and deportation for would-be asylum seekers, Iran has a long-standing record of physical abuse, detention in inhumane conditions, forced labor, forced separation of families, among other types of abuses. Unaccompanied migrant children in particular have been subject to abuse and exploitation.</p>



  <p class="wp-block-paragraph">Even refugees who are fully registered face significant difficulties, as Iran has imposed a challenging process to maintain status, including regular reregistration with different government agencies, excessive fees, and bureaucratic hurdles. Refugees also risk losing status and deportation if they make even a small mistake, and refugees are not able to move freely, as many parts of Iran are considered “no go” zones.</p>



  <p class="wp-block-paragraph">Afghan refugees in particular are often limited to low-paying, dangerous jobs, regardless of their education and skills. In addition, although children can technically access education, in reality bureaucratic obstacles mean that many refugee children cannot attend school. Refugees also face discrimination, scapegoating, and anti-foreigner sentiment.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong></p>



  <p class="wp-block-paragraph">Fatemeh Aman, “Afghan Migrants: Unwanted in Iran and at Home,” Atlantic Council, May 15, 2020, <a href="https://www.atlanticcouncil.org/blogs/iransource/afghan-migrants-unwanted-in-iran-and-at-home/">https://www.atlanticcouncil.org/blogs/iransource/afghan-migrants-unwanted-in-iran-and-at-home/</a></p>



  <p class="wp-block-paragraph">Fatemah Aman, “The Afghan Refugee Crisis: What Does It Mean for Iran?” Middle East Institute, September 20, 2021, <a href="https://www.mei.edu/publications/afghan-refugee-crisis-what-does-it-mean-iran">https://www.mei.edu/publications/afghan-refugee-crisis-what-does-it-mean-iran</a></p>



  <p class="wp-block-paragraph">Government of Iran, Labour Code, November 20, 1990, <a href="https://www.ilo.org/dyn/natlex/docs/WEBTEXT/21843/64830/E90IRN01.htm">https://www.ilo.org/dyn/natlex/docs/WEBTEXT/21843/64830/E90IRN01.htm</a></p>



