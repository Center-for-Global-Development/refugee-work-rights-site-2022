  <p class="wp-block-paragraph">UNHCR, “Afghanistan Situation: Emergency Preparedness and Response in Iran, 11–31 March 2022,” April 6, 2022, <a href="https://reliefweb.int/report/iran-islamic-republic/afghanistan-situation-emergency-preparedness-and-response-iran-11-31">https://reliefweb.int/report/iran-islamic-republic/afghanistan-situation-emergency-preparedness-and-response-iran-11-31</a></p>



  <p class="wp-block-paragraph">UNHCR, “Iran: An Overview of How the Global Compact on Refugees Is Being Turned into Action in the Islamic Republic of Iran,” March 12, 2021, <a href="https://globalcompactrefugees.org/article/iran">https://globalcompactrefugees.org/article/iran</a></p>



