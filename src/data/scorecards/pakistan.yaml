title: Pakistan
country_id: PK
levels:
  de_jure: "2"
  de_facto: "3"
  overall: "3"
content: |-
  <p>According to UNHCR, Pakistan hosted 1,438,523 refugees and 10,192 asylum seekers in 2021. The majority of refugees and asylum seekers originated from Afghanistan.</p>
  <p><strong>De Jure Summary</strong></p>
  <p>Pakistan does not currently have any national refugee legislation. Therefore, refugees and asylum seekers hold no official legal status and cannot work legally. Pakistan is not a party to the 1951 Refugee Convention nor its 1967 Protocol but is a party to the ICESCR by ratification with no reservations.</p>
  <p>Pakistan has a long history of hosting refugees and hosts one of the highest refugee populations in the world, the majority of whom are Afghan. UNHCR holds the mandate to implement refugee status determination procedures in the country. However, over half of the 3 million refugees remain unregistered. Afghan refugees are allowed to freely move but are not guaranteed rights to work lawfully, access education or financial services, or buy property.</p>
  <p>Pakistan has implemented various legalization programs over the years. In 2017, the government developed a Comprehensive Policy on the Repatriation and Management of Afghans and affirmed efforts to develop a national refugee law. The Comprehensive Policy included ‘Afghan Citizen Cards’ which legalized Afghans’ stay without term limits but did not grant them refugee status. Alongside this, Pakistan has implemented various programs to repatriate Afghan refugees. Advocates, however, report that these were often coerced and in 2016, a Human Rights Watch cited nearly half of the 600,000 returnees as having been forced to return.</p>
  <p>Regarding a possible national refugee law, there is draft legislation, which has not been released. There is no detail on if and how the government will uphold the protection of the right to work for asylum seekers and refugees.</p>
  <p><strong>De Facto Summary</strong></p>
  <p>Refugees work informally in a variety of sectors, from day wage laborers in the construction and agricultural sectors to small-scale workers in carpet weaving, fresh fruit production, heavy machinery, and honey beekeeping. While some refugees set up businesses, they are either unregistered or under the proxy ownership of Pakistani friends and relatives. The one million Afghans who do not hold Proof of Registration cards mostly live in remote areas and perform menial jobs.</p>
  <p>Many refugees remain in the camps because there they can access limited work, healthcare, and education assistance. Afghan children are legally able to attend Pakistani state schools, though in practice these schools are both oversubscribed and hard to access, leaving much of the provision of education in the hands of UNHCR. Finally, while Proof of Registration card holders are entitled to access public healthcare, not all facilities accept the card as proof of identity. In addition, some hospitals will turn away pregnant refugee mothers, as they would not be able to issue a birth certificate if the baby were to be born at their hospital.</p>
  <p>The Pakistani government response has shifted dramatically over the years. Afghan refugees are seen as a drain on Pakistan’s economy and resources as well as a security threat. As a result, the government has focused on encouraging voluntary return to Afghanistan. Recent events suggest that further repatriation will be unlikely in the coming years, and new refugee waves are likely.</p>
  <p><strong>Sources</strong>:</p>
  <p>Ali Furqan, “Pakistan Refuses to Host Additional Afghan Refugees,” July 13, 2021,<br />
  <a href="https://www.voanews.com/a/south-central-asia_pakistan-refuses-host-additional-afghan-refugees/6208191.html">https://www.voanews.com/a/south-central-asia_pakistan-refuses-host-additional-afghan-refugees/6208191.html</a></p>
  <p>Amnesty International, “Afghanistan’s refugees: Forty Years of Dispossession,” June 20, 2019, <a href="https://www.amnesty.org/en/latest/news/2019/06/afghanistan-refugees-forty-years/">https://www.amnesty.org/en/latest/news/2019/06/afghanistan-refugees-forty-years/</a></p>
  <p>CODE Pakistan, <em>Afghan Refugees in Pakistan: The Road Ahead</em> (Islamabad: CODE Pakistan, 2019), <a href="https://codepak.org/news/analytical-report-on-afghan-refugees/">https://codepak.org/news/analytical-report-on-afghan-refugees/</a></p>
  <p>Denielle Amparado, Helen Dempster, and Imran Khan Laghari, “With US Withdrawal, Rights of Afghan Refugees in Pakistan Hang in the Balance,” August 25, 2021, <a href="https://www.cgdev.org/blog/us-withdrawal-rights-afghan-refugees-pakistan-hang-balance">https://www.cgdev.org/blog/us-withdrawal-rights-afghan-refugees-pakistan-hang-balance</a></p>
