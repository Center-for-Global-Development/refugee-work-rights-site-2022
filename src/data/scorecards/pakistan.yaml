  <p>Maliha Safri, “The Transformation of the Afghan Refugee: 1979–2009,” <em>The Middle East Journal</em> 65, no. 4 (2011): 587–601, <a href="https://doi.org/10.3751/65.4.14">https://doi.org/10.3751/65.4.14</a></p>
