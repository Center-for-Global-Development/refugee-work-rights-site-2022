content: |-
  <p class="wp-block-paragraph">According to UNHCR, Ethiopia hosted 782,896 refugees and 2,110 asylum seekers in 2021. The majority of refugees and asylum seekers originated from South Sudan and Somalia.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Ethiopia is a party to the 1951 Refugee Convention and its Protocol, the ICESCR, and the Organization of African Unity regional convention. Under the Refugee Proclamation 1110 of 2019, Ethiopia guarantees free movement and the right to work to refugees and establishes procedures for refugee status determination.</p>



  <p class="wp-block-paragraph">Policy directives both elucidate and limit the rights set forth in the 2019 Refugee Proclamation. Under the Right to Work Directive, refugees can access employment via two channels. The first is through wage-earning employment on projects funded by the international community, which grants refugees labor market access on equal terms with Ethiopian nationals and is accompanied by a five-year residency permit. The second is wage-earning or self-employment in the private or public sector on par with other foreign workers, no Ethiopian nationals are available to fill them.</p>



  <p class="wp-block-paragraph">The Free Movement and Choice of Residency Directive allows refugees to move outside of the camps for work. A limited number of refugees are offered Out of Camp permits to live outside camps in approved locations, and in 2019, the government had administered over 35,000. Refugees who wish to seek a job may obtain a permit for temporary free movement. In most cases a refugee may only access the right to long-term free movement if they can prove that they already have a sponsor, a job, or the financial means to support themselves.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">Ethiopia maintains a number of barriers that block refugee access to the labor market in practice. </p>



  <p class="wp-block-paragraph">While some refugees are in urban centers such as Addis Ababa, most are in government-managed camps. Survey respondents indicated that refugees are regularly harassed or even arrested when traveling. Despite some initiatives to increase access to the labor market and variance across country of origin, most refugees still struggle to move freely and obtain official work documentation.</p>



  <p class="wp-block-paragraph">A number of NGOs financing institutions such as the World Bank, have invested in various programs to improve refugee economic inclusion. For the most part, however, refugees in Ethiopia still struggle to access the formal labor market and earn livelihoods. The conflict over the last year, which has been most intense in the Tigray and Amhara regions, has only exacerbated these challenges.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong></p>



  <p class="wp-block-paragraph">Asylum Access, Improving Refugees’ Labor Market Access and Work Rights in Ethiopia: Gaps and Opportunities: Landscape Analysis, 2021.</p>



