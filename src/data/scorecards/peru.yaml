  de_facto: "3"
  overall: "3"
content: |-
  <p class="wp-block-paragraph">According to UNHCR, Peru hosted 4,895 refugees and 536,779 asylum seekers as well as 515,162 Venezuelans displaced abroad in 2021. The majority of asylum seekers were also from Venezuela. The second most common country of origin for refugees and asylum seekers was Cuba.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Peru is a party the 1951 Refugee Convention and its 1967 Protocol, the ICESCR, and the 1984 Cartagena Declaration. Peru’s, National Refugee Law, guarantees refugee and asylum seekers the right to work.</p>



  <p class="wp-block-paragraph">The temporary stay permit (PTP), created for Venezuelans in 2017, granted work rights and stay for two years. This program was closed in 2018, with a series of policies implemented thereafter. The government implemented a temporary residence permit card (CPP) for those entering without lawful status while they apply for something more permanent, such as refugee status. The CPP is valid for one year (nonrenewable) and guarantees the right to work.</p>



  <p class="wp-block-paragraph">Peru also implemented a humanitarian visa (CMH) for Venezuelans seeking refugee status. CMH requires that Venezuelans apply with a valid passport and other civil documentation, which is often difficult to obtain. The CMH guarantees the right to work and can be renewed as long as “conditions of vulnerability” remain. However, Peru has consistently closed its land borders, most of which remain closed at the time of writing.</p>



  <p class="wp-block-paragraph">Recognized refugees can access the labor market, but labor law stipulates that no more than 20 percent of a company’s workforce may be foreign and that foreign salaries may not exceed 30 percent of a company’s total payroll. Foreigners must pay an additional 30 percent in income taxes.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">In Peru, over 70 percent of the labor force works informally.405 Most Venezuelans and other forcibly displaced individuals are able to work in the informal sector, mainly in the commerce and service industries.</p>



  <p class="wp-block-paragraph">While access to regularization is important for Venezuelans and other refugees, in practice it has little impact on their labor market opportunities. Even those with regular status and work authorization struggle to obtain formal jobs. Their status as foreigners also leaves them vulnerable to exploitation and abuse, with many reporting working longer hours or earning a lower income than locals.</p>



  <p class="wp-block-paragraph">Despite challenges, the government of Peru has instituted initiatives for refugee professionals to integrate into the formal labor market. During the pandemic, the country implemented a program to include Venezuelan doctors in the COVID-19 response. This allowed Venezuelan doctors to work in state-owned hospitals and fast-track their professional accreditation procedure.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong>:</p>



