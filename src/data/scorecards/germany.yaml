content: |-
  <p class="wp-block-paragraph">According to UNHCR, Germany hosted 1,235,160 refugees and 232,481 asylum seekers in 2021. The majority of refugees and asylum seekers originated from Syria, Afghanistan, and Iraq.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Germany is a party to the 1951 Refugee Convention, its 1967 Protocol, and the ICESCR. These international obligations are supplemented by the EU Regional Council Directive, which requires that member states authorize recognized refugees to work on par with nationals. Germany also has broad national legislation setting forth the rights of refugees.</p>



  <p class="wp-block-paragraph">Refugees are guaranteed the right to work and be self-employed under the four forms of protection offered: asylum, refugee protection, subsidiary protection, and deportation ban. These forms of protection are codified in the Asylum Act, Basic Law, and Residence Act. In addition, the Labor Agency provides support for training programs and for fees required for qualifications recognition. Germany provides the same social benefits to refugees that German citizens receive. Therefore, refugees are entitled to unemployment benefits.</p>



  <p class="wp-block-paragraph">Since 2016, refugees with protection have been required to reside for three years in the state or town where their asylum procedure was conducted, which limits freedom of movement and work opportunities.</p>



  <p class="wp-block-paragraph">Asylum seekers are obligated to stay in reception centers during their initial asylum proceedings. They are not allowed to work for the first nine months of their stay in the centers. After they are released from the center and after three months have passed, they are permitted to work. Work is restricted during this period: a permit must be obtained for a specific job, and self-employment is not allowed. Once recognition of refugee status has been granted, refugees are afforded the same rights to the labor market as German citizens.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">The German government manages specific programs that promote formal employment of people with refugee status, such as the PROFI Program, which seeks to increase the likelihood that academically qualified refugees in Germany will gain employment that matches their level of education. Vocational training is often provided by private enterprises, as well.</p>



  <p class="wp-block-paragraph">However, asylum seekers are restricted in certain respects. They generally cannot open their own businesses, as work permits are valid for employed work but not self-employment, and asylum seekers can face discrimination based on nationality or language in certain federal states according to a survey respondent.</p>



  <p class="wp-block-paragraph">In practice, recognized refugees are entitled to the same employment benefits as German citizens. Asylum seekers and various other groups are generally only granted reduced benefits called “asylum seekers’ benefits.” Further, a gray area exists for persons whose applications have been rejected and in cases in which Germany does not accept responsibility for the asylum process (usually because another European country is supposed to be responsible for carrying out the procedure). This leaves the person’s legal status, and resulting labor market access and resources, in limbo.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong></p>



  <p class="wp-block-paragraph">Asylum Act in the version promulgated on September 2, 2008 (Federal Law Gazette I, p. 1798), last amended by Article 2 of the Act of March 11, 2016 (Federal Law Gazette I, p. 394).</p>



  <p class="wp-block-paragraph">Deutscher Akademischer Austauschdienst, “‘PROFI’ Programme—Promoting Professional Integration of Academics with a Refugee Background in the German Labour Market,” accessed January 20, 2022, <a href="https://www.daad.de/en/information-services-for-higher-education-institutions/further-information-on-daad-programmes/profi/">https://www.daad.de/en/information-services-for-higher-education-institutions/further-information-on-daad-programmes/profi/</a></p>



  <p class="wp-block-paragraph">Federal Office for Migration and Refugees, “The Stages of the German Asylum Procedure,” accessed April 29, 2022, <a href="https://www.bamf.de/SharedDocs/Anlagen/EN/AsylFluechtlingsschutz/Asylverfahren/das-deutsche-asylverfahren.pdf?__blob=publicationFile&amp;v=12">https://www.bamf.de/SharedDocs/Anlagen/EN/AsylFluechtlingsschutz/Asylverfahren/das-deutsche-asylverfahren.pdf?__blob=publicationFile&amp;v=12</a></p>



  <p class="wp-block-paragraph">Michael Kalkmann and Daniel Kamiab Hesari, Country Report: Germany (Brussels: European Council on Refugees and Exiles, 2019), <a href="https://www.asylumineurope.org/wp-content/uploads/2020/07/report-download_aida_de_2019update.pdf">https://www.asylumineurope.org/wp-content/uploads/2020/07/report-download_aida_de_2019update.pdf</a></p>



  <p class="wp-block-paragraph">UNHCR, Refugee Data Finder, accessed May 23, 2022, <a href="https://www.unhcr.org/refugee-statistics/download/?url=3HMho5">https://www.unhcr.org/refugee-statistics/download/?url=3HMho5</a></p>



