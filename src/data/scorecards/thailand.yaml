  de_facto: "2"
  overall: "2"
content: |-
  <p class="wp-block-paragraph">According to UNHCR, Thailand hosted 96,175 refugees and 756 asylum seekers in 2021. The majority of refugees originated from Myanmar.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Thailand is not a party to any international conventions relating to the rights of refugees, but is party to the ICESCR.</p>



  <p class="wp-block-paragraph">Domestic legislation in Thailand does not recognize refugee status. Refugees are able to access Asylum Seeker and Refugee Cards via UNHCR. However, these do not provide any protection from detention or deportation, do not guarantee any employment rights, and are not recognized by the Thai government. Most refugees in Thailand are ethnic Karen from Myanmar and live in nine camps at the Thai-Myanmar border, where they face restrictions on their freedom to move. Refugees of other nationalities generally live in cities and without legal status.</p>



  <p class="wp-block-paragraph">Domestic law in Thailand could be applied to refugees to expand and protect their work rights; however, with a lack of foundational rights that afford and protect refugee status, and a lack of commitment by legislators and enforcement by authorities, these laws do not result in employment protections. The Labor Protection Act B.E. 2541490 protects all employees from abuse and exploitation from employers, but this is not monitored or enforced in practice. The 2017 Foreigners’ Working Management Emergency Decree B.E. 2560 also contains an article regarding the right to employment for those who are in exile or who have entered the country unlawfully, in a “refugee-like” situation; however, this law has not been enacted.</p>



  <p class="wp-block-paragraph">A Cabinet Resolution was passed in 2021 granting seven unauthorized migrant workers from Myanmar, Laos, and Cambodia release from detention and approval to work. This represents a small but positive development in legal precedent for migrant worker protections in Thailand, although no additional legislation has been enacted to grant such rights more broadly.</p>



  <p class="wp-block-paragraph">The Thai Cabinet approved the establishment of a national screening mechanism that would identify those who need international protection, as opposed to economic migrants, in December 2019. However, this status does not include the right to work and has yet to be implemented.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">Refugees in Thailand experience rights denials regularly and are met with a range of barriers that limit their ability to find work. The vast majority of refugees in Thailand live in camps and do not have freedom of movement. Survey respondents emphasized that some manage to travel outside the camps, but when they do they may be subject to inspection or harassment. Refugees also struggle to obtain the documents needed to move freely.</p>



  <p class="wp-block-paragraph">Refugees are not allowed to work and are subject to fines or detention if they do so. Where they do find work—most often in the informal sector—refugees are vulnerable to exploitation, including exploitative wages, illegal conditions, withholding of wages, and arbitrary termination of employment. Likewise, businesses are discouraged from hiring refugees and can face severe penalties if they are caught doing so. In addition, refugees are not able to operate businesses, though some do so by paying bribes to the authorities. Those who live in cities are generally undocumented and struggle to access services and livelihood opportunities. They may access assistance from NGOs, including cash support.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong>:</p>



  <p class="wp-block-paragraph">Government of Thailand, Labour Protection Act, B.E. 2541, 1998, <a href="http://web.krisdika.go.th/data/outsitedata/outsite21/file/LABOUR_PROTECTION_ACT_B.E._2541.pdf">http://web.krisdika.go.th/data/outsitedata/outsite21/file/LABOUR_PROTECTION_ACT_B.E._2541.pdf</a></p>



  <p class="wp-block-paragraph">International Labor Organization, <em>How Immigrants Contribute to Thailand’s Economy</em> (Paris: OECD Publishing, 2017), <a href="http://dx.doi.org/10.1787/9789264287747-en">http://dx.doi.org/10.1787/9789264287747-en</a></p>



  <p class="wp-block-paragraph">“Joint Open Letter,” Center for Alliance of Labor and Human Rights, November 4, 2021, <a href="https://www.central-cambodia.org/archives/5553">https://www.central-cambodia.org/archives/5553</a></p>



  <p class="wp-block-paragraph">Lara Thiele, “The Right-to-Work for Rohingya in Thailand,” <em>Notre Dame Journal of International and Comparative Law</em> 9 (2019), no. 1, <a href="https://scholarship.law.nd.edu/ndjicl/vol9/iss1/7">https://scholarship.law.nd.edu/ndjicl/vol9/iss1/7</a></p>



  <p class="wp-block-paragraph">Naiyana Thanawattho, Waritsara Rungthong, and Emily Arnold-Fernández, “Advancing Refugee Rights in Non-signatory States: The Role of Civil Society in Thailand,” <em>Forced Migration Review </em>67 (July 2021), <a href="https://www.fmreview.org/issue67/thanawattho-rungthong-arnoldfernandez">https://www.fmreview.org/issue67/thanawattho-rungthong-arnoldfernandez</a></p>



