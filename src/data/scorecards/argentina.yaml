content: |-
  <p class="wp-block-paragraph">According to UNHCR, Argentina hosted 4,007 refugees and 10,354 asylum seekers as well as 167,853 Venezuelans displaced abroad in 2021. The most common countries of origin for refugees and asylum seekers were Senegal and Cuba.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Argentina is a party to the 1951 Convention and its 1967 Protocol, as well as the ICESCR. Within the General Law for the Recognition and Protection of Refugees (Law 26.165), Argentina enshrines work rights for refugees in its domestic legislation.</p>



  <p class="wp-block-paragraph">Law 26.165 provides asylum seekers the right to work within 20 days of applying for refugee status. While their asylum application is underway, refugees are allowed to work legally, move freely, and access public health and education services. When refugees are recognized they are then able to obtain a two-year temporary residency visa and national identity document (known as a DNI in Spanish). Refugees may apply for citizenship after two years.</p>



  <p class="wp-block-paragraph">“Patria Grande” (Law 25.781) provided legal status for immigrants from full and associate MERCOSUR members. It guaranteed work rights for immigrants residing in the country without legal status, the right to stay, exit, and enter the country, and a pathway to permanent residency. While not specifically for refugees, the law enabled more than 650,000 previously unauthorized migrants to regularize their status and gain access to legal employment.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">The legal procedures assuring refugees’ right to work, as described above, are generally upheld in practice. There are rare instances of police officers repeatedly asking for refugees’ documentation when it is no longer necessary, but there are no extralegal detentions. Businesses ask that refugees present a DNI for hiring purposes, and, according to survey respondents, the COVID-19 pandemic has caused significant delays in the processing of DNIs, which limits formal labor market access.</p>



  <p class="wp-block-paragraph">Refugees and asylum seekers may live wherever they choose. Often, economic conditions dictate that refugees and asylum seekers live in peripheral neighborhoods, which makes accessing government services more difficult. Big cities such as Buenos Aires host many displaced individuals who work informally. Additionally, while resettled refugees are offered housing opportunities from implementing partners, they often lack de facto access to national housing programs, according to a survey respondent.</p>



  <p class="wp-block-paragraph">Administrative delays in regularization have implications for access to other government services. Access to certain government services depends on years of residency, so delays in processing documentation can have secondary impacts.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong></p>



  <p class="wp-block-paragraph">Government of Argentina, Ley No. 26.165 de 2006, Ley general de reconocimiento y protección al refugiado, November 8, 2006, <a href="https://www.refworld.org/docid/46d559e92.html">https://www.refworld.org/docid/46d559e92.html</a></p>



  <p class="wp-block-paragraph">MERCOSUR, Mercosur Countries, Accessed May 06, 2022, <a href="https://www.mercosur.int/en/about-mercosur/mercosur-countries/">https://www.mercosur.int/en/about-mercosur/mercosur-countries/</a></p>



  <p class="wp-block-paragraph">Micol Pistelli, “Argentina Amplía el Acceso a Servicios Financieros Para Solicitantes de Asilo y Refugiados,” FinDev Blog, FinDev Gateway, December 18, 2018, <a href="https://www.findevgateway.org/es/blog/2018/12/argentina-amplia-el-acceso-servicios-financieros-para-solicitantes-de-asilo-y">https://www.findevgateway.org/es/blog/2018/12/argentina-amplia-el-acceso-servicios-financieros-para-solicitantes-de-asilo-y</a></p>



