title: Republic of the Congo
country_id: CG
levels:
  de_jure: "3"
  de_facto: "2"
  overall: "2"
content: |-
  <p class="has-black-color has-text-color wp-block-paragraph">According to UNHCR, the Republic of the Congo hosted 40,765 refugees and 13,670 asylum seekers as well as 10,206 others of concern in 2021. The most common countries of origin for refugees and asylum seekers were the Central African Republic and the Democratic Republic of the Congo.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">The Republic of Congo is a party to the 1951 Refugee Convention and its protocol, the ICESCR, and the Organization of African Unity Convention on Refugees. An order issued in 2001 created a National Refugee Assistance Committee but did not contain any specific provisions on work. Other rights that are not explicitly set out in the law have been governed by laws applying to foreigners more generally. </p>



  <p class="wp-block-paragraph">A more restrictive 2005 law prohibits foreigners from small trade activities or work in the public transportation sector. If work authorization for foreigners is obtained, it must be renewed every two years. The Employment Agency, which was established in 2019, offers both nationals and refugees business opportunities and guidance through an established legal and regulatory framework.</p>



  <p class="wp-block-paragraph">The Foreigners Law of 2017 allows for choice of residence and freedom of movement. </p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">Refugees can live outside of camps and often do – 83 percent live outside settlements. However, travel is difficult. There are checkpoints in the northern part of the country that charge a fee when refugee documents are not recognized.</p>



  <p class="wp-block-paragraph">According to the World Bank, there are &#8220;no known cases of refugees who possess work permits or who are employed in the formal sector.” Informal employment is much more likely. For all foreigners, refugees included, it is burdensome to obtain authorizations and work permits.</p>



  <p class="wp-block-paragraph">Refugees can and do open bank accounts at two financial institutions in the country. Authorities severely limited access to secondary and vocational education. There is supposed to be equal access to health facilities but refugees often experience discrimination when seeking healthcare. Gaps in laws result in refugees often being subject to arbitrary detentions, as well.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong>:</p>



