  de_facto: "3"
  overall: "3"
content: |-
  <p class="wp-block-paragraph">According to UNHCR, North Macedonia hosted 296 refugees and 17 asylum seekers in 2021. The majority of refugees originated from Serbia and Kosovo, while the most common country of origin for asylum seekers was Turkey.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">North Macedonia is a party to the 1951 Refugee Convention and its 1967 Protocol as well as the ICESCR. Refugee work rights in North Macedonia are enshrined in the 2018 Law on International and Temporary Protection and the 2018 Law on Foreigners.</p>



  <p class="wp-block-paragraph">North Macedonia maintains three policies for protecting refugees: refugee status, subsidiary protection, and temporary protection. Recognized refugees and persons with subsidiary protection are guaranteed full access to employment opportunities as soon as they receive their status, with the same rights and protections as foreign workers. Those with pending refugee status applications are not allowed to apply for a work permit until nine months have passed. These work permits is not accessible, however, because asylum seekers are required to have an identification number in order to obtain it, and they are not granted ID numbers until they are formally recognized as refugees. Often, applications are pending for two to three years, presenting serious challenges to refugees’ ability to access lawful employment.</p>



  <p class="wp-block-paragraph">Temporary protection is applicable to those seeking asylum in “mass influx” events. This affords protection from non-refoulement for one year and can be renewed for a total of three years but does not guarantee work rights.</p>



  <p class="wp-block-paragraph">Since 2015, a “state of crisis” has been imposed in the country, with border pushbacks justified by a “safe third country” rule, hampering individuals’ access to refugee status proceedings. Freedom of movement is granted to asylum seekers who are able to cross the border; however, North Macedonian authorities arbitrarily restrict this right in practice.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">Asylum seekers and refugees in North Macedonia are not granted personal identification numbers, a requisite for formal employment, until they are granted status. This prevents them from working; while there is a policy that refugees may work if their case is not processed within 9 months, this is often overlooked by employers according to a survey respondent. The lack of an identification number also makes school enrollment difficult. The Ministry of Labor and Social Policy touts active measures to promote the employment of refugees. The proposals that they have put forth, however, has not yet been adopted, according to UNHCR.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong>:</p>



  <p class="wp-block-paragraph">Giuseppe Cataldi, Adele Del Guercio, and Anna Liguori, eds., <em>Migration and Asylum Policies Systems Challenges and Perspectives</em> (Naples, Italy: Editoriale Scientifica, 2020), <a href="https://eprints.ugd.edu.mk/26872/1/koshevaliska%20and%20nikodinovska%20krstevska%20publication%20Orientale%202020.pdf">https://eprints.ugd.edu.mk/26872/1/koshevaliska%20and%20nikodinovska%20krstevska%20publication%20Orientale%202020.pdf</a></p>



  <p class="wp-block-paragraph">Government of North Macedonia, Law on International and Temporary Protection of 2018, April 11, 2018, <a href="https://www.refworld.org/docid/5b55e5de4.html">https://www.refworld.org/docid/5b55e5de4.html</a></p>



  <p class="wp-block-paragraph">Government of North Macedonia, Law on Foreigners of 2018, <a href="https://www.refworld.org/docid/6290d0774.html">https://www.refworld.org/docid/6290d0774.html</a></p>



