content: |-
  <p class="wp-block-paragraph">According to UNHCR, Israel hosted 1,860 refugees and 29,156 asylum seekers in 2021. The majority of refugees and asylum seekers were from Eritrea and Sudan.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Israel is a party to the main international instruments concerning refugees, such as the 1951 Refugee Convention and its 1967 Protocol, as well as the ICESCR.</p>



  <p class="wp-block-paragraph">The Israel refugee law defines three different types of refugees: recognized refugees, asylum seekers and persons under collective protection. Few refugees are recognized by the state, with a .06% recognition rate between 2011-2019, leaving most as asylum-seekers with almost no rights.</p>



  <p class="wp-block-paragraph">Historically, Israel has held a large number of asylum seekers in administrative immigrant detention until recent years. In 2020, numbers of migrants and asylum seekers declined from 5,000 to ‘a few dozen migrants’.</p>



  <p class="wp-block-paragraph">Many refugees historically barred from applying for asylum have been given ‘conditional release visas’ under the Entry of Israel Law (Art 2(A)5), most of whom are Eritrean and Sudanese refugees. Conditional release visas are given alongside pending deportation orders, only enabling the right to stay pending implementation of the order, and must be renewed every two to three months. This visa does not confer the right to work and includes the phrase “this temporary permit does not constitute a work permit”, despite a High Court ruling in 2011 requiring the government to issue work permits for these visa holders.</p>



  <p class="wp-block-paragraph">In a court ruling in 2022, Israel granted temporary residence status to 2,445 Eritrean and Sudanese asylum seekers, some of whom had been in the country for over a decade. Although not confirmed, reporting suggests that this legal status may offer a pathway to formal employment.</p>



  <p class="wp-block-paragraph">Even for recognized refugees, the law does not provide a clear right to work. Israel does not have specific legislation concerning refugees’ labor rights; instead, the Foreign Workers Law regulates the right to work for all persons residing in Israel, regardless of their legal status. Because this law was not designed to consider the situation of most refugees, it creates barriers to refugees’ access to work by imposing legal requirements that refugees and their employers often cannot meet.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">For a time, government-sponsored advertisements advocated against hiring refugees without formal work permits. Some employers seem to take advantage of this confusion and lack of transparency by threatening refugees with deportation or by not paying their employees’ salaries. Now, however, the Israeli government seems to tolerate the informal hiring of those seeking refugee status. A work permit system does exist, but not all refugees request or access it. The Supreme Court ruled that refugees have the right to work, so the absence of a work permit is not punished.</p>



  <p class="wp-block-paragraph">Delays have been reported in the processing of asylum applications for individuals of particular nationalities, including those from Eritrea and Sudan. And, in practice though not legally, many refugees and asylum seekers are consigned to low-wage jobs.</p>



  <p class="wp-block-paragraph">For years, the Deposit Law required employers to automatically take 20 percent of asylum seekers’ salaries and deposit it into a fund that the workers could only access upon leaving the country. Furthermore, a report written by Kav LaOved and the Hotline for Refugees and Migrants revealed that while many people’s salaries were docked, the money was never deposited into their fund. This law was repealed in January 2022.</p>



  <p class="wp-block-paragraph">There has been a slight improvement in freedom of movement over the last five years, since the closure of the Holot detention facility in the Negev Desert; previously, those released from Holot were subject to geographical restrictions. But, according to a survey respondent, most asylum seekers live in the greater Tel Aviv area because there is more access to NGOs and services, as well as community support.</p>



