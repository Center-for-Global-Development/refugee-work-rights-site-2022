content: |-
  <p class="wp-block-paragraph">According to UNHCR, Costa Rica hosted 9,976 refugees and 95,275 asylum seekers as well as 21,995 Venezuelans displaced abroad in 2021. The majority of refugees and asylum seekers were from Nicaragua.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Costa Rica is a party to the 1951 Refugee Convention and its Protocol, and the ICESCR. The country has made regional commitments to refugees through the Cartagena Declaration, the San José Declaration, and the Brazil Declaration and Plan of Action.</p>



  <p class="wp-block-paragraph">Costa Rica’s laws grant refugees legal status and the right to work, and enable an appeal process, enshrined in The General Law on Migration No. 8764. Asylum seekers with their applications pending are granted the right to work and access education during this period. Additionally, Costa Rica has an established integration program that helps refugees find jobs, start businesses, and adapt to the culture.</p>



  <p class="wp-block-paragraph">Under Costa Rica’s national laws, all those with recognized refugee status are granted the right to work and be self-employed and may apply for work permits. Asylum seekers with pending applications for at least three months are granted the right to work and be self-employed, and may apply for a provisional work permit while the asylum application is being evaluated. This process for obtaining a work permit and renewal is free.</p>



  <p class="wp-block-paragraph">In 2021, Costa Rica implemented the Asylum Seeker Card for Venezuelans, Nicaraguans, and Cubans which offers legal status for two years and the ability to obtain a work permit after three months.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">Overall, Costa Rica allows for significant labor market access in practice for refugees, although barriers remain. Newly arrived asylum seekers must wait 90 days after submitting a refugee status application before they can request a work permit. Individuals who are granted refugee status in Costa Rica are given a special ID card that allows them access to a variety of employment-related activities, such as opening a bank account. After being granted status, refugees can request a work permit, which is normally granted for a specific job or job field. Denial of work permits is rare. Some businesses have a legal limit on the number or percentage of foreign-born workers that they can hire. However, after a refugee has resided in Costa Rica for three or more years, they automatically become entitled to a work permit and are exempt from any limits on foreign-born employment.</p>



  <p class="wp-block-paragraph">While refugees are legally allowed to be employed by a business or to be self-employed, the strict requirements and large number of documents necessary to receive a business license often prevent refugees from legalizing their establishments. Refugees and asylum seekers are able to search for work opportunities throughout the country, as freedom of movement within Costa Rica is guaranteed.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong></p>



