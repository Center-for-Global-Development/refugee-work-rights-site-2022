title: Indonesia
country_id: ID
levels:
  de_jure: "1"
  de_facto: "2"
  overall: "2"
content: |-
  <p class="wp-block-paragraph">According to UNHCR, Indonesia hosted 10,076 refugees and 3,309 asylum seekers in 2021. The majority of refugees and asylum seekers were from Afghanistan and Somalia.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Indonesia is not a party to the 1951 Refugee Convention or its 1967 Protocol. The country does, however, have a legal human rights framework stemming from its commitments to other international and regional human rights conventions. There is no domestic law that protects refugee rights outright, although a constitutional amendment passed in 2000 recognizes the right to seek political asylum, and Law No. 37 of 1999 on foreign relations stipulates that the granting of asylum must be implemented in accordance with international law and practice.</p>



  <p class="wp-block-paragraph">A Presidential Decree in 2016 adopts the definition of refugee presented in the 1951 Refugee Convention and describes procedures for processing asylum claims; however, it does not codify any rights for refugees. The government has enabled UNHCR to implement the refugee status determination process. Refugees who are successful in this process are granted a UNHCR identification card. This card does not guarantee the right to work.</p>



  <p class="wp-block-paragraph">Indonesian Immigration Regulation No. IMI0352.GR.02.07 of 2016 prohibits employment for refugees, stating that they must not engage in income-generating activities and must sign a letter agreeing to this condition. This results in many refugees working in the informal sector; however, refugees pursuing this type of employment have been subject to detention and/or fines.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">NGOs have delivered some training programs and internships to refugees in Indonesia, but translating these programs into economic opportunity is difficult without full work rights. A very small number of refugees are able to open businesses by partnering with Indonesians, but they often face issues with documentation, harassment by local officials, and a lack of legal recourse for difficulties.</p>



  <p class="wp-block-paragraph">One area in which there has been some slight improvement in recent years is freedom of movement. Until 2019, refugees were confined to detention centers. Today, refugees are able to live in hostels run by the International Organization for Migration (IOM) within the community. However, they are still placed under curfew and are not able to travel outside of their city without permission. If they breach these conditions, they can be sent back to the detention center. Within the hostel, refugees are given a monthly stipend by IOM. Those living outside these hostels receive no government support.</p>



  <p class="wp-block-paragraph">Refugee children are also eligible to attend state-run primary schools, but in practice they face difficulties in accessing education due to quotas (which prioritize locals over refugee children) and language obstacles. Even if they are able to enroll, they will not be able to obtain an official certification, as this is derived from a citizenship card, which refugees do not have. There is no right to secondary or tertiary education, and many students learn through NGOs.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong></p>



  <p class="wp-block-paragraph">Alfred Pek, “Indifference in Diversity: Ignorance and Apathy towards Refugees in Indonesia,” New Mandala, October 8, 2021, <a href="https://www.newmandala.org/indifference-in-diversity-ignorance-apathy-towards-refugees-in-indonesia/">https://www.newmandala.org/indifference-in-diversity-ignorance-apathy-towards-refugees-in-indonesia/</a></p>



  <p class="wp-block-paragraph">Government of Indonesia, Regulation of Director General of Immigration No. IMI-0352.gr.02.07 (2016) on the Handling of Illegal Migrant Claiming to Be Asylum-Seeker or Refugee, 2016, <a href="https://www.refworld.org/docid/58aeef894.html">https://www.refworld.org/docid/58aeef894.html</a></p>



  <p class="wp-block-paragraph">Government of Indonesia, Regulation of the President of the Republic of Indonesia Number 125 Year 2016 Concerning the Handling of Foreign Refugees, December 31, 2016, <a href="https://www.refworld.org/pdfid/58aeee374.pdf">https://www.refworld.org/pdfid/58aeee374.pdf</a></p>



  <p class="wp-block-paragraph">Suaka Indonesia, Know Your Rights: A Handbook for Refugees and Asylum Seekers (Jakarta: Suaka Indonesia, 2018), <a href="https://suakaindonesia.files.wordpress.com/2018/12/know-your-rights-handbook.pdf">https://suakaindonesia.files.wordpress.com/2018/12/know-your-rights-handbook.pdf</a></p>



  <p class="wp-block-paragraph">Susan Kneebone, Antje Missbach, and Balawyn Jones, “The False Promise of Presidential Regulation No. 125 of 2016?” Asian Journal of Law and Society 8, no. 3 (October 2021): 431–450, <a href="https://www.cambridge.org/core/journals/asian-journal-of-law-and-society/article/false-promise-of-presidential-regulation-no-125-of-2016/1B9D2F47D373E8614F1A1B5E212DF9D9">https://www.cambridge.org/core/journals/asian-journal-of-law-and-society/article/false-promise-of-presidential-regulation-no-125-of-2016/1B9D2F47D373E8614F1A1B5E212DF9D9</a></p>



  <p class="wp-block-paragraph">Luthvi Nola, “Refugee Employment Prohibition in Indonesia,” European Alliance for Innovation, January 11, 2021, <a href="https://eudl.eu/doi/10.4108/eai.1-7-2020.2303641">https://eudl.eu/doi/10.4108/eai.1-7-2020.2303641</a></p>



  <p class="wp-block-paragraph">UNHCR, Refugee Data Finder, accessed May 23, 2022, <a href="https://www.unhcr.org/refugee-statistics/download/?url=3HMho5">https://www.unhcr.org/refugee-statistics/download/?url=3HMho5</a></p>



