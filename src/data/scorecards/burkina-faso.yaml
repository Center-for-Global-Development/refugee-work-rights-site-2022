title: Burkina Faso
country_id: BF
levels:
  de_jure: "4"
  de_facto: "3"
  overall: "3"
content: |-
  <p class="wp-block-paragraph">According to UNHCR, Burkina Faso hosted 25,010 refugees and 9,413 asylum seekers in 2021. The most common country of origin for refugees and asylum seekers was Mali.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Burkina Faso is a party to the 1951 Refugee Convention and its 1967 Protocol, the ICESCR, and the 1969 Organization of African Unity regional convention. <a href="https://www.refworld.org/legal/legislation/natlegbod/2008/fr/79997">Law 042</a> (2008) and its two implementing decrees (2011) govern the status of refugees in Burkina Faso. Under these laws, all refugees in Burkina Faso have the same rights as nationals, including the right to work, freedom of movement, and access services (such as housing, education, and public assistance). Their “Justice and Human Rights” Sectoral Policy 2018-2027 promotes the inclusion of refugees in national systems.</p>



  <p class="wp-block-paragraph">That being said, since 2018, the <a href="https://lefaso.net/spip.php?article94114">government has maintained an encampment policy</a>, restricting refugees freedom of movement. Most refugees therefore live in two official “relocation” camps managed by UNHCR, Mentao and Goudoubo. A small number of others live in the urban areas of Ouagadougou and Bobo-Dioulasso, yet they <a href="https://documents1.worldbank.org/curated/en/826851636575674627/pdf/IDA19-Mid-Term-Refugee-Policy-Review.pdf">forfeit their right to humanitarian assistance</a>. Refugees may also not qualify for asylum if they have undertaken “secondary movements”.</p>



  <p class="wp-block-paragraph">Attacks in Burkina Faso by extremist groups have led many refugees to flee to Mali, and subsequently back to Burkina Faso, shifting the size of the camps. Despite this instability, in 2022, the <a href="https://reporting.unhcr.org/files/2023-06/WA%20-%20Burkina%20Faso.pdf">government was able to provide access to asylum procedures for 100 percent</a> of applicants. This is in line with their commitments under the “<a href="https://www.refworld.org/legal/legislation/natlegbod/2008/fr/79997">Bamako Conclusions</a>”, which aim to ensure humanitarian access to affected populations during periods of counterterrorism operations.</p>



  <p class="wp-block-paragraph">Since 2018, more than two million Burkinabés have been internally displaced due to these attacks. Burkina Faso has also <a href="https://www.refugeesinternational.org/reports-briefs/a-crisis-of-displacement-why-burkina-faso-needs-the-kampala-convention/">signed the 2009 Convention</a> for the Protection and Assistance of Internally Displaced Persons in Africa (the “Kampala Convention”) but it has not codified it into national law.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">As the majority of refugees live in camps, the services they are able to offer largely depends on what is available within the camp. Indeed, one author stated that the “<a href="https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6150966/">fate of refugees differs from one camp to another</a>.” In 2022, UNHCR found that 91 percent of refugees had a legally recognized identity document, enabling them to access the labor market and start businesses. Yet there are limited economic opportunities available within the camps; most work with agriculture or livestock, selling produce in markets. Within cities, <a href="https://www.refworld.org/themes/custom/unhcr_rw/pdf-js/viewer.html?file=https%3A%2F%2Fwww.refworld.org%2Fsites%2Fdefault%2Ffiles%2Flegacy-pdf%2Fen%2F2012-9%2F50693f262.pdf">potential employers are often not familiar with such documents and reject job applications</a>. As a result, unemployment sits at 87.9 percent. To support themselves, 89 percent of refugees had access to formal financial services, with many obtaining cash through mobile money services.</p>



  <p class="wp-block-paragraph">Burkina Faso’s refugee laws provide refugee children with free access to basic education, and entry into secondary education and universities. Yet in 2022, UNHCR found that only 38 percent of refugees and asylum-seekers were enrolled in primary education and only six percent were enrolled in secondary education. This is attributed to the worsening security situation, yet other issues play a role. For example, <a href="https://www.refworld.org/themes/custom/unhcr_rw/pdf-js/viewer.html?file=https%3A%2F%2Fwww.refworld.org%2Fsites%2Fdefault%2Ffiles%2Flegacy-pdf%2Fen%2F2012-9%2F50693f262.pdf">half of refugee children do not have a birth certificate</a>, due to a lack of action on the part of parents and the fact that Malian refugees are a nomadic people who often do not register on birth.</p>



  <p class="wp-block-paragraph">On healthcare, some camps maintain their own healthcare services, while others (such as the largest camp, Mentao) <a href="https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6150966/">rely on health services in nearby urban areas</a>. The worsening security situation has closed some of these health facilities and made it more difficult to access them. That being said, <a href="https://reporting.unhcr.org/files/2023-06/WA%20-%20Burkina%20Faso.pdf">70 percent of refugees were able to access healthcare services in 2022</a>.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong>:</p>



