  de_facto: "4"
  overall: "4"
content: |-
  <p class="wp-block-paragraph">According to UNHCR, Austria hosted 146,025 refugees and 18,308 asylum seekers in 2021. The most common countries of origin for refugees and asylum seekers were Syria, Afghanistan, and Iraq.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Austria is a party to the 1951 Refugee Convention, its 1967 Protocol, and the ICESCR. While Austria has a generally good record on allowing recognized refugees full access to employment opportunities, asylum seekers are denied the right to undertake employment for the first three months after lodging their asylum application in Austria.</p>



  <p class="wp-block-paragraph">Employers of asylum seekers must complete a labor market test to access gainful employment, proving that the job cannot be filled by an Austrian citizen, an EU citizen, or another third-country national who is a lawful resident.</p>



  <p class="wp-block-paragraph">A 2004 ordinance (Bartenstein-Erlass) restricting the sectors of employment available to asylum seekers and term limits for employment was repealed in July 2021. Asylum seekers are no longer barred from certain sectors and do not have term limits on their work permits, but they are still required to prove that their position cannot be filled by another European citizen.</p>



  <p class="wp-block-paragraph">Refugees and beneficiaries of subsidiary protection have free access to the labor market. Moreover, the Act on Recognition and Evaluation of 2016 has improved refugees’ ability to obtain recognition of their education and professional qualifications by relaxing documentation requirements.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">Austria has a generally strong track record of upholding work rights for refugees, though asylum seekers face restrictions. Asylum seekers’ movement, for instance, is restricted to their district during admission proceedings. Furthermore, opportunities for asylum seekers employment were significantly reduced in 2018 when the Ministry of Social Affairs eliminated access to apprenticeships in shortage occupations for those under the age of 25.</p>



  <p class="wp-block-paragraph">Refugees and those with subsidiary protection have more access to the labor market. They are free to move within Austria, though financial support and accommodation may be limited to a state.</p>



  <p class="wp-block-paragraph">They are able to open businesses in the same manner as citizens, facing the same qualification requirements that vary by state. They are also eligible for public benefits, which also depend on the state.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong></p>



  <p class="wp-block-paragraph">Anerkennungs und Bewertungsgesetz, Bundesgesetzblatt für die Republik Österreich, Nr 55/2016, <a href="https://www.ris.bka.gv.at/Dokumente/BgblAuth/BGBLA_2016_I_55/BGBLA_2016_I_55.pdfsig">https://www.ris.bka.gv.at/Dokumente/BgblAuth/BGBLA_2016_I_55/BGBLA_2016_I_55.pdfsig</a></p>



  <p class="wp-block-paragraph">Asylkoordination, “Asylum Coordination Austria Welcomes the Long Overdue Repeal of the Bartenstein Decree by the Constitutional Court,” press release, July 14, 2021, <a href="https://asyl.at/de/info/presseaussendungen/endedesverordnetennichtstunsfuerschutzsuchende/">https://asyl.at/de/info/presseaussendungen/endedesverordnetennichtstunsfuerschutzsuchende/</a></p>



  <p class="wp-block-paragraph">Asylkoordination Österreich, Country Report: Overview of the Main Changes since the Previous Report Update (Vienna: Asylkoordination, 2021), <a href="https://asylumineurope.org/reports/country/austria/overview-main-changes-previous-report-update/">https://asylumineurope.org/reports/country/austria/overview-main-changes-previous-report-update/</a></p>



  <p class="wp-block-paragraph">David Martin, “Austria to ban asylum-seekers from taking up apprenticeships”, Deutsche Welle (DW), August 27, 2018, <a href="https://www.dw.com/en/austria-to-ban-asylum-seekers-from-taking-up-apprenticeships/a-45249042">https://www.dw.com/en/austria-to-ban-asylum-seekers-from-taking-up-apprenticeships/a-45249042</a></p>



  <p class="wp-block-paragraph">Government of Austria, Austrian Aliens Employment Act, Article 4(1), 1975, <a href="https://www.migration.gv.at/fileadmin/downloads/gesetzestexte/AuslBG_englisch_1_10_2017.pdf">https://www.migration.gv.at/fileadmin/downloads/gesetzestexte/AuslBG_englisch_1_10_2017.pdf</a></p>



  <p class="wp-block-paragraph">Lukas Gahleitner-Gertz, Asylum Information Database Country Report: Austria (Brussels: European Council on Refugees and Exiles, 2020), <a href="https://asylumineurope.org/wp-content/uploads/2021/04/AIDA-AT_2020update.pdf">https://asylumineurope.org/wp-content/uploads/2021/04/AIDA-AT_2020update.pdf</a></p>



