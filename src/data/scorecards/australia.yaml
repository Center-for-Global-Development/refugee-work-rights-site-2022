content: |-
  <p class="wp-block-paragraph">According to UNHCR, Australia hosted 56,229 refugees and 79,819 asylum seekers in 2021. The most common countries of origin for refugees and asylum seekers were Malaysia, China, and Iran.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Australia is a party to the 1951 Refugee Convention, its 1967 Protocol, and the ICESCR. Recognized refugees have the right to work under domestic law, yet access to refugee status recognition depends on visa status, which is often determined by method of arrival.</p>



  <p class="wp-block-paragraph">As part of the onshore protection program, which requires arrival with a valid visa and not by boat or without legal status, refugees have the right to apply for a permanent protection visa to legally reside and lawfully work. Those arriving by boat or without a valid visa may not apply for recognition of refugee status unless the government exercises discretion to do so, and they are subject to mandatory detention. Those arriving by boat or without a valid visa are subject to interception and push-back policies, and sent to offshore processing sites or onshore detention sites.</p>



  <p class="wp-block-paragraph">Separately, asylum seekers in offshore resettlement programs (those referred to Australia with refugee status already or proposed for a protection visa) may apply for refugee status, a global special humanitarian visa, a community support program, or family reunification. These pathways are not available to asylum seekers in offshore processing sites. These visas provide recognized refugees the right to stay and work but are subject to a total annual cap set by the Australian government.</p>



  <p class="wp-block-paragraph">While domestic law respects refugees’ right to work, this right is afforded in only a few circumstances, for those seeking refuge with a valid visa upon entry or under resettlement programs.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">As described above, the extent to which a refugee or asylum seeker can access the labor market in Australia depends on their legal status. Recognized refugees are granted permanent residency and therefore have full access to the labor market, while others have temporary visas that force them into specific geographic areas to find employment. Regardless of their status, however, there are institutional, financial, intellectual, societal, and language barriers that prevent refugees from finding work, and discrimination among employers that may be prevent hiring. For example, between 2000 and 2016, only 38 percent of recognized refugees were employed, and of those who do manage to find employment, most are casual rather than permanent jobs. There are some state and federal government programs that aim to support the transition to permanent jobs, though only for recognized refugees.</p>



  <p class="wp-block-paragraph">Access to education and healthcare also differs by status. People seeking asylum struggle to access government-funded programs and tend to rely on services provided by NGOs, including cash assistance, food vouchers, and emergency support. These individuals are not able to access government support to attend university or tertiary education. Yet even recognized refugees often struggle to access education and obtain degree recognition. For example, a survey of around 2,400 refugees found that only one in five were able to get their qualification recognized in Australia 2.5 years after arrival.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong></p>



