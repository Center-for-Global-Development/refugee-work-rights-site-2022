  <p class="wp-block-paragraph">Department of Home Affairs, “Resettle in Australia,” accessed April 17, 2022, <a href="https://immi.homeaffairs.gov.au/what-we-do/refugee-and-humanitarian-program/about-the-program/resettle-in-australia">https://immi.homeaffairs.gov.au/what-we-do/refugee-and-humanitarian-program/about-the-program/resettle-in-australia</a></p>



