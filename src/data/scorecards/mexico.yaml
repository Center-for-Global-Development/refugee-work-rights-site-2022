content: |-
  <p>According to UNHCR, Mexico hosted 58,050 refugees and 114,536 asylum seekers as well as 59,942 Venezuelans displaced abroad in 2021. Aside from Venezuela, the most common country of origin was Honduras.</p>
  <p><strong>De Jure Summary</strong></p>
  <p>Mexico is a party to the 1951 Refugee Convention with reservations to articles 17 and 26. Mexico is a party to the ICESCR and a signatory to the Cartagena Declaration.</p>
  <p>In 2010, the Mexican government passed the Law on Refugees and Complementary Protection, which incorporates the 1951 Refugee Convention principles into domestic law. The refugee definition adopted in this law is the expanded version contained in the Cartagena Declaration. This law offers broad protection to recognized refugees, including residency, the right to work, healthcare, and education, and the possibility of naturalization.</p>
  <p>Domestic law requires that those applying for refugee status submit their application within 30 days of arrival in the country, and they must remain in the state where they lodged their application. This requirement, coupled with a severe backlog, imposes barriers to protection and lawful work opportunities.</p>
  <p>Asylum applicants may apply for a temporary ID during the application process, which may be used for lawful employment. In January 2019, a humanitarian visa program was briefly implemented that guaranteed lawful stay and work authorization for one year. Over 15,000 applications were submitted so the program was deemed “too successful” by the government and closed after one month.</p>
  <p><strong>De Facto Summary</strong></p>
  <p>While the law indicates that the refugee determination process should conclude within 45 working days, in practice, many wait for over a year. Further, many asylum seekers apply in smaller towns in southern Mexico, such as Tapachula, where job opportunities are limited.</p>
  <p>The law states that all asylum seekers must receive a temporary humanitarian visa that allows them to work. But NGOs indicate that some offices refuse to issue these documents or impose significant processing delays. Thus many abandon their cases and move to other cities in search of opportunities.</p>
  <p>Those with refugee status also face barriers to work. Businesses are limited in the number of foreigners they can hire—only up to 10 percent of their total workforce—and also require a special permit to hire non-nationals. These regulations make it difficult for refugees to obtain formal jobs.</p>
  <p>Mexico has a large informal sector, where many refugees work. However, this allows for to abuse and exploitation, as well as harassment from authorities and criminal groups. In practice, there are few effective mechanisms to protect both displaced persons and locals in Mexico from workplace violations, especially when hired informally.</p>
