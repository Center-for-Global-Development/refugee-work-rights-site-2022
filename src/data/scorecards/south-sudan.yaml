content: |-
  <p class="has-black-color has-text-color wp-block-paragraph">According to UNHCR, South Sudan hosted 333,673 refugees and 4,314 asylum seekers in 2021. The most common countries of origin for refugees and asylum seekers were Sudan and the Democratic Republic of the Congo.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">South Sudan is a party to the 1951 Refugee Convention and its protocol, as well as the Organization of African Unity Convention on Refugees, but is not a party to the ICESCR. </p>



  <p class="wp-block-paragraph">The Refugee Act of 2012 states that refugees are guaranteed the right to identity documents, travel documents, employment, and the same basic health services and primary education that nationals of South Sudan can access.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">Respondents report that refugees generally are able to move and choose their location of residence. It is a difficult process to get a business permit, but not just for refugees. While refugees have the right to work, obtaining status documents and work permits is very difficult and often prohibitively expensive. Respondents report that bribes are often necessary to obtain proper paperwork for identity documents or work authorization. </p>



  <p class="wp-block-paragraph"><strong>Sources</strong>:</p>



  <p class="wp-block-paragraph">Refugee Act of 2012, available here: <a href="https://www.refworld.org/pdfid/51499cd02.pdf">https://www.refworld.org/pdfid/51499cd02.pdf</a></p>



  <p class="wp-block-paragraph">UN High Commissioner for Refugees (UNHCR), I am a refugee in South Sudan, n.d., available at: <a href="https://help.unhcr.org/southsudan/who-are-you/i-am-a-refugee-in-south-sudan/"><em>https://help.unhcr.org/southsudan/who-are-you/i-am-a-refugee-in-south-sudan/</em></a><em></em></p>



  <p class="wp-block-paragraph"><em>UN High Commissioner for Refugees (UNHCR), PROTECTION BRIEF: South Sudan, July 2023, available at: </em><a href="https://www.refworld.org/docid/64d258ba4.html"><em>https://www.refworld.org/docid/64d258ba4.html</em></a><em></em></p>



