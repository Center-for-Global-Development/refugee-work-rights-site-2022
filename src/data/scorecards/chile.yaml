content: |-
  <p class="wp-block-paragraph">According to UNHCR, Chile hosted 2,060 refugees and 6,451 asylum seekers as well as 483,343 Venezuelans displaced abroad in 2021. Aside from Venezuelans displaced abroad, the majority of refugees were from Colombia.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Chile is a party to the 1951 Refugee Convention, its 1967 Protocol, and the ICESCR. The country’s regional commitments are outlined in the Cartagena Declaration, the San José Declaration, and the Brazil Declaration and Plan of Action.</p>



  <p class="wp-block-paragraph">The Chilean government implemented Law No. 20.430 on Refugee Protection and its Decree No. 837, incorporating the main international standards on refugee protection, including the 1984 Cartagena regional definition. According to the law, asylum seekers and refugees are entitled to enjoy the rights and freedoms granted to every person by the Chilean Constitution, the country’s laws and regulations, and the international human rights instruments to which Chile is a party. Refugees and their families have the right to access work, via either wage-earning employment or self-employment.</p>



  <p class="wp-block-paragraph">In 2021, Chile enacted Law No. 21.325, which places new limits on migrants’ access to Chilean territory and increases the government’s power to detain or deport refugees. The law also includes specific visa requirements for Venezuelans and Haitians. In 2022, this law is undergoing adjustment related to court decisions and the development of implementing regulations. However, it appears likely that, when it fully enters into force, the law will limit access to refugee status.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">The Chilean government grants all recognized refugees a national identity card that allows them to formally work and start a business. To asylum-seekers, the government of Chile grants a temporary residency which also grants them work authorization. Furthermore, forcibly displaced Venezuelans have access to a special visa that allows them to stay in the country and work for one year, with the possibility of extension.</p>



  <p class="wp-block-paragraph">However, asylum seekers and Venezuelan visa holders face significant barriers that limit their economic inclusion. For instance, the waiting time to obtain the temporary residency permits is often more than six months, which leaves asylum seekers without the possibility to work. As a result, many asylum seekers are pushed to work in the informal sector, where they are subject to exploitation and abuse. Chile seldom grants refugee status and that it is increasingly difficult to apply for asylum or obtain the special visa for Venezuelans.</p>



  <p class="wp-block-paragraph">Displaced Venezuelans in Chile are facing growing obstacles to regularizing their status and work. As the government of Chile has militarized the border and imposed a visa, Venezuelans are pushed to enter through irregular border crossings and constantly face harassment, persecution, and deportation. The lack of regular status limits their ability to join the labor market and is their main obstacle to obtaining a job, as Chilean law dictates harsh punishments for those who hire undocumented migrants. In 2021, the government of Chile started to conduct mass deportations, instilling fear among employers and displaced Venezuelans alike.</p>



  <p class="wp-block-paragraph">Even those with the right to work face obstacles to validating their credentials. The high costs and convoluted process prevent forcibly displaced individuals from obtaining recognition.98 As a result, many are forced to work in jobs that do not match their qualifications.</p>



