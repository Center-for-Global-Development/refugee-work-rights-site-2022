content: |-
  <p class="wp-block-paragraph">According to UNHCR, Chad hosted 508,304 refugees and 4,548 asylum seekers in 2021. The majority of refugees originated from Sudan. Asylum seekers were most commonly from the Central African Republic.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Chad is a party to the 1951 Refugee Convention and its 1967 Protocol, the ICESCR, and the Organization of African Unity regional convention. The country has incorporated the key principles of international protection into its 2020 Refugee Law. It assures refugees and asylum seekers fundamental protections, including freedom of movement; the right to work; and access to healthcare, education, social assistance, and justice.</p>



  <p class="wp-block-paragraph">The law also requires that refugees be treated with the most favorable treatment accorded to nationals of a foreign country in terms of housing, naturalization, movable and immovable property, intellectual property, and trade unions. It also guarantees the right of refugees to wage-earning employment, to self-employment, and to the practice of a liberal profession.</p>



  <p class="wp-block-paragraph">According to the 2020 Refugee Law, all refugees are entitled to identity cards and travel documents provided by the Chadian administration. Identity cards are valid for five years and are renewable. Asylum seekers with pending applications are guaranteed the right to remain throughout the duration of their application process and receive an Asylum Seeker’s Certificate, valid for two months and is renewable.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">The majority of refugees in Chad are from Sudan’s Darfur region. They are largely located in border areas that are isolated and economically lagging. In some cases, refugees are able to settle with host communities and obtain arable land for agricultural production. Broadly speaking, however, refugees are limited in terms of where they can live and work, with survey respondents noting that some face harassment and arrest, while others move more freely. The 2020 Refugee Law, which provides for freedom of movement; the right to work; and access to healthcare, education, and justice, has not yet been fully realized in practice, and its application is inconsistent.</p>



  <p class="wp-block-paragraph">Respondents noted that refugees’ access to work has not changed much in recent years. They particularly highlighted that formal work is difficult to obtain and noted that refugee women and girls are particularly vulnerable in the types of work they do, which can include housework and prostitution. It will also take time for the rights outlined in the new law to be fully recognized by actors at the local level.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong></p>



  <p class="wp-block-paragraph">Government of Chad, Loi 0027/PR/2020 portant asile en République du Tchad, Articles 21, 25, 26, 28, 29 and 31, 2020, <a href="https://www.refworld.org/pdfid/606334e04.pdf">https://www.refworld.org/pdfid/606334e04.pdf</a></p>



  <p class="wp-block-paragraph">Joint Data Center on Forced Displacement, “Chad: Refugees in Chad: The Road Forward,” accessed January 20, 2022, <a href="https://www.jointdatacenter.org/chad-refugees-in-chad-the-road-forward/">https://www.jointdatacenter.org/chad-refugees-in-chad-the-road-forward/</a></p>



  <p class="wp-block-paragraph">Roger Zetter and Heloise Ruaudel, Refugees’ Right to Work and Access to Labor Markets—An Assessment, Part II: Country Cases (Washington, DC: World Bank KNOMAD, 2016), <a href="https://www.knomad.org/sites/default/files/2017-12/KNOMAD%20Study%201-%20Part%20II-%20Refugees%20Right%20to%20Work%20-%20An%20Assessment.pdf">https://www.knomad.org/sites/default/files/2017-12/KNOMAD%20Study%201-%20Part%20II-%20Refugees%20Right%20to%20Work%20-%20An%20Assessment.pdf</a></p>



