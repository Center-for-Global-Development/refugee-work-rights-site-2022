content: |-
  <p class="wp-block-paragraph">According to UNHCR, Denmark hosted 36,431 refugees and 844 asylum seekers in 2021. The majority of refugees and asylum seekers were from Syria.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Denmark has one of the stricter legislative regimes in Europe vis-à-vis refugees. Denmark is a party to the 1951 Refugee Convention and its 1967 Protocol, as well as the ICESCR, but maintains a reservation so that refugees are not entitled the same privileges of wage-earning employment as nationals of Finland, Iceland, Norway, and Sweden. Denmark has opted out of the EU <em>acquis </em>on asylum and thus is not bound by its principles.</p>



  <p class="wp-block-paragraph">Asylum seekers are required to reside in asylum centers throughout the duration of their refugee status determination process. They cannot work or study during this process, but they do receive accommodations and a small living allowance. They must wait at least six months after applying for asylum before applying for permission to work, and they then can work only after meeting certain conditions. Refugees granted protection have access to an integration program with Danish language courses and accommodation.</p>



  <p class="wp-block-paragraph">In the last few years, Denmark has adopted a “no new asylum seekers” policy. This is evidenced by the fact that from 2016 to 2019, Denmark did not accept any new refugees. In a Parliament vote in June 2021, the Danish government approved the establishment of offshore reception centers outside Danish borders, forcing asylum seekers to apply for asylum abroad. If their claim is rejected, they would be forced to leave; if successful, they would be flown to Denmark. Although this program is not yet fully implemented, it effectively bars any new refugees from seeking legal status and work rights in Denmark.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">Asylum seekers must meet several conditions to apply to the Danish Immigration Service for permission to work. Because this permission is only temporary, many employers are wary of hiring them. The government encourages companies to hire recognized refugees by providing job training and wage subsidies for the first few months. It has also initiated and improved an integration education package called IGU (integrationsuddannelsen) to increase labor force participation.</p>



  <p class="wp-block-paragraph">Language lessons are provided for only a short period and do not enable refugees to achieve the language proficiency needed in most workplaces. The Danish state also appears to penalize people with insufficient language skills, for example, by withholding benefits unless migrants learn enough of the language. For these reasons, long-term integration is poor. A study of 43,000 refugees conducted in 2019 found that only 40 percent of men and 25 percent of women were “self-sufficient” eight years after entry, compared with 75 percent of Danes.</p>



  <p class="wp-block-paragraph">Recently, Danish refugee policy has begun to harden. In 2021, Denmark declared certain parts of Syria to be safe and revoked the residence permits of more than 1,200 Syrians who had come from those areas. These people could either return voluntarily, with a payout from the Danish state, or face lifelong detention in a “departure” center. Many are now appealing their cases in the courts.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong></p>



