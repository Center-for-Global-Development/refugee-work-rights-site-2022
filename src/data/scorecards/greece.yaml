content: |-
  <p class="wp-block-paragraph">According to UNHCR, Greece hosted 112,022 refugees and 49,397 asylum seekers in 2021. The most common countries of origin for refugees and asylum seekers were Syria, Afghanistan, and Iraq.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Although Greece is a party to the 1951 Refugee Convention, its 1967 Protocol, and the ICESCR, the country’s national policies and practices do not fully align with its international commitments.</p>



  <p class="wp-block-paragraph">Asylum seekers with valid international protection cards are able to lawfully work after six months, with restrictions on self-employment. Recognized refugees are able to lawfully work with a valid residency permit; no work permit is required. The law provides access to vocational training programs for asylum applicants and refugees; in practice, however, the documentation needed to participate in such programs is often hard to produce. Greece, however, has repeatedly suspended the asylum registration process since 2016, preventing refugees from accessing lawful protection. Furthermore, an EU-Turkey deal implemented in March 2016 required that all unregistered refugee arrivals be sent to Turkey, and in June 2021, Greece designated Turkey as a “safe third country” for asylum seekers from Afghanistan, Bangladesh, Pakistan, Somalia, and Syria. Applicants from these countries can be rejected as “inadmissible” without their cases being examined on their merits, even though Turkey has not accepted readmissions from Greece since March 2020.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">While recognized refugees do have freedom of movement, in practice it is difficult and expensive for them to leave the camps. To work or start a business, refugees need a bank account, but banks often refuse their requests to open an account because of insufficient documentation and discrimination.202 Even if they manage to open a bank account, language barriers and bureaucracy make it very difficult for refugees to become entrepreneurs.</p>



  <p class="wp-block-paragraph">It is even more difficult for asylum seekers to work. Businesses can legally hire them for only six months, leading to large gaps in employment due to delays in renewing their documents. Additionally, labor laws prohibit contract renewals after the third iteration, making it impossible for asylum seekers to stay with the same employer.</p>



  <p class="wp-block-paragraph">The situation regarding access to services is similar. For example, Greek government-run schools do not exist in the camps, yet there is insufficient transport to take refugee and asylum seeker children on the islands to the mainland, and language barriers persist.</p>



  <p class="wp-block-paragraph">To support asylum seekers, cash assistance, accommodations, and food are provided by the state and partner organizations. Once their status is recognized, their assistance is cut off within 30 days. They can then access the Helios program, run by the International Organization for Migration and funded by the state, which provides further cash assistance, access to education, and training for 12 months. But the procedure to access the program is long and requires complicated documentation.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong></p>



