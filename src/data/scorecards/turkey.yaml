content: "<p>According to UNHCR, Turkey hosted 3,696,831 refugees and 322,188 asylum seekers in 2021. The majority of refugees were from Syria, and the majority of asylum seekers were from Iraq.</p>\n<p><strong>De Jure Summary</strong></p>\n\n\n<p class=\"wp-block-paragraph\">Turkey is a party to all major refugee conventions and has national legislation pertaining to refugees and work rights. Turkey is a party to the 1951 Refugee Convention and the 1967 Protocol; however, the country has maintained the “geographical limitation” from the 1951 Refugee Convention. This means that only refugees originating from European countries are able to access refugee status. Non-European refugees are afforded temporary protection under the Law on Foreigners and International Protection.</p>\n\n\n\n<p class=\"wp-block-paragraph\">Protection is defined according to two broad categories: international protection and temporary protection. Three forms of international protection exist: a convention refugee (originating from Europe), a conditional refugee (from a non-European country), and a person under subsidiary protection. Refugees from Syria fall under the temporary protection regime.</p>\n\n\n\n<p class=\"wp-block-paragraph\">Those under international protection may be formally employed or self-employed beginning six months after lodging their application. These work permits may have term limits or sector restrictions imposed, but they are relaxed if a refugee has lived in the country for more than three years, is married to a Turkish citizen, or has Turkish children.</p>\n\n\n\n<p class=\"wp-block-paragraph\">Refugees from Syria under the temporary protection regime may apply for a work permit beginning six months after lodging their protection application. These permits are also subject to term limits, sector restrictions, and total annual quotas. In addition, they are also subject to province-specific employment conditions, whereby the government may take into consideration the refugee’s province of residence as a factor when deciding whether to offer a work permit.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>De Facto Summary</strong></p>\n\n\n\n<p class=\"wp-block-paragraph\">In practice, Turkey’s record on refugee rights is mixed. Syrians under temporary protection may choose their province of residence, though some cities are not accepting new applications; Istanbul hosts the largest number of registered temporary protection beneficiaries.\n\nHowever, Syrians under temporary protection can register only in cities that are open, and 100,000 unregistered Syrians were removed from Istanbul in 2019. Other nationalities under protection are generally not allowed to register in the major cities. Furthermore, movement outside the province of registration is significantly restricted. Temporary protection beneficiaries must apply for travel authorizations, and thousands are arrested for violations.</p>\n\n\n\n<p class=\"wp-block-paragraph\">Work permits are available under the law, and 63,789 were issued to Syrians in 2019. However, the permits are tied to a specific employer, must be renewed annually, and require an application fee. The majority of refugees therefore work in the informal sector, where conditions are difficult, and exploitation is widespread. Large protests for better working conditions took place in 2017. Child labor is also a significant issue that is especially pronounced for Syrians. Survey respondents report that it is possible to obtain a permit to start a formal business, but unregistered businesses are often closed down.</p>\n\n\n\n<p class=\"wp-block-paragraph\"><strong>Sources</strong>:</p>\n\n\n\n<p class=\"wp-block-paragraph\">European Council on Refugees and Exiles, “Access to the Labour Market: Turkey,” January 11, 2022, <a href=\"https://asylumineurope.org/reports/country/turkey/content-temporary-protection/employment-and-education/access-labour-market/\">https://asylumineurope.org/reports/country/turkey/content-temporary-protection/employment-and-education/access-labour-market/</a></p>\n\n\n\n<p class=\"wp-block-paragraph\">European Council on Refugees and Exiles, “Freedom of Movement: Turkey,” January 11, 2022, <a href=\"https://asylumineurope.org/reports/country/turkey/content-temporary-protection/movement-and-mobility/freedom-movement/\">https://asylumineurope.org/reports/country/turkey/content-temporary-protection/movement-and-mobility/freedom-movement/</a></p>\n\n\n\n<p class=\"wp-block-paragraph\">European Council on Refugees and Exiles, “Housing: Turkey,” January 11, 2022, <a href=\"https://asylumineurope.org/reports/country/turkey/content-temporary-protection/housing/\">https://asylumineurope.org/reports/country/turkey/content-temporary-protection/housing/</a></p>\n\n\n\n<p class=\"wp-block-paragraph\">Government of Turkey, Regulation on Work Permit for Applicants for and Beneficiaries of International Protection, April 4, 2013, <a href=\"https://www.refworld.org/cgi-bin/texis/vtx/rwmain?docid=5167fbb20\">https://www.refworld.org/cgi-bin/texis/vtx/rwmain?docid=5167fbb20</a></p>\n\n\n\n<p class=\"wp-block-paragraph\">Government of Turkey, Law on Foreigners and International Protection, November 4, 2013, <a href=\"https://www.unhcr.org/tr/wp-content/uploads/sites/14/2017/04/LoFIP_ENG_DGMM_revised-2017.pdf\">https://www.unhcr.org/tr/wp-content/uploads/sites/14/2017/04/LoFIP_ENG_DGMM_revised-2017.pdf</a></p>\n\n\n\n<p class=\"wp-block-paragraph\">Izza Leghtas, “Insecure Future: Deportations and Lack of Legal Work for Refugees in Turkey,” <em>Refugees International</em>, September 19, 2019, <a href=\"https://www.refugeesinternational.org/reports/2019/9/18/insecure-future-deportations-and-lack-of-legal-work-for-refugees-in-turkey\">https://www.refugeesinternational.org/reports/2019/9/18/insecure-future-deportations-and-lack-of-legal-work-for-refugees-in-turkey</a></p>\n\n\n\n<p class=\"wp-block-paragraph\">Refugee Rights Turkey, <em>Country Report: Turkey</em> (Brussels: European Council on Refugees and Exiles, 2020), <a href=\"https://asylumineurope.org/wp-content/uploads/2021/05/AIDA-TR_2020update.pdf\">https://asylumineurope.org/wp-content/uploads/2021/05/AIDA-TR_2020update.pdf</a></p>\n\n\n\n<p class=\"wp-block-paragraph\"><ul>\n \t<li>Updated as of July 2022</li>\n</ul></p>"
