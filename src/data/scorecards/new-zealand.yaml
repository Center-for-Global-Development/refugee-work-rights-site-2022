content: |-
  <p class="wp-block-paragraph">According to UNHCR, New Zealand hosted 1,785 refugees and 662 asylum seekers in 2021.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">New Zealand is a party to the 1951 Refugee Convention, its 1967 Protocol, and the ICESCR. Refugee protections and work rights in New Zealand are governed by comprehensive national legislation, particularly the Immigration Act of 2009, which is aligned with international refugee protections.</p>



  <p class="wp-block-paragraph">New Zealand offers protection to refugees through the Refugee Quota Program for those being referred to New Zealand via resettlement, through the Refugee Claimant Visitor Visa for spontaneous arrivals, and via temporary visas for protected persons (who fall under the protection of the Convention against Torture or Covenant on Civil and Political Rights). New Zealand maintains an annual cap on refugee resettlement from third countries—currently 1,500 persons—which it revises every three years. In 2019, the country overturned a policy that had restricted resettlement quotas for refugees from Middle Eastern and African countries for more than 10 years, improving equality of refugee access to rights.</p>



  <p class="wp-block-paragraph">Recognized refugees and protected persons are offered permanent residency and the right to work. After holding residency for five years, they may apply for citizenship. Those with applications in process are able to apply for a temporary visa that provides them lawful stay, work authorization, the opportunity to study, and benefits from the Ministry of Social Development. However, if an asylum seeker makes a claim after already being present in New Zealand without a valid visa, or arrives in the country using fake documents, they could be detained while the application is processed.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">Broadly, New Zealand does a good job of protecting the rights of its refugees, who are usually divided into three categories: asylum seekers, “Convention refugees,” and “quota refugees.” Yet confusion about these three categories and the rights they are granted hinders the ability of these people to access work and services. Government interventions appear to be lacking, with many refugees instead relying on NGOs and other forms of civil society support. Many asylum seekers are not granted work rights, and even those refugees who are granted status may need to wait months to access the labor market. Once they do, discrimination by employers can prevent many from accessing work. There is little support for refugees to start businesses, and little encouragement to do so.</p>



  <p class="wp-block-paragraph">While recognized refugees can access primary and secondary education, it is more difficult for them to access university. They are eligible, but, in practice, attending requires numerous prerequisites and language requirements that are difficult to meet. The government has suspended the offering of government scholarships, which means applicants must rely on those provided by individual universities.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong>:</p>



  <p class="wp-block-paragraph">Charlotte Graham-McLay, “Under Pressure, New Zealand Ends a Refugee Policy Branded Racist,” <em>New York Times</em>, October 4, 2019, <a href="https://www.nytimes.com/2019/10/04/world/asia/jacinda-ardern-refugees-new-zealand.html">https://www.nytimes.com/2019/10/04/world/asia/jacinda-ardern-refugees-new-zealand.html</a></p>



  <p class="wp-block-paragraph">Community Law, “How to Claim Refugee Status: The Process,” accessed April 17, 2022, <a href="https://communitylaw.org.nz/community-law-manual/chapter-30-refugees/how-to-claim-refugee-status-the-process/">https://communitylaw.org.nz/community-law-manual/chapter-30-refugees/how-to-claim-refugee-status-the-process/</a></p>



  <p class="wp-block-paragraph">Immigration New Zealand, <em>Refugee Status Unit: Practice Note</em> (Wellington: Ministry of Business, Innovation, and Employment, 2021), <a href="https://www.immigration.govt.nz/documents/forms-and-guides/refugee-status-unit-practice-note-august-2021.pdf">https://www.immigration.govt.nz/documents/forms-and-guides/refugee-status-unit-practice-note-august-2021.pdf</a></p>



