content: |-
  <p class="wp-block-paragraph">According to UNHCR, Malawi hosted 16,359 refugees and 34,461 asylum seekers in 2021. The majority of refugees and asylum seekers were from the Democratic Republic of Congo.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Malawi is a party to the 1951 Refugee Convention, its 1967 Protocol, and the ICESCR. Malawi is also a party to the Organization of African Unity Convention Governing the Specific Aspects of Refugee Problems in Africa. The Refugees Act of 1989 is the domestic law defining refugees and prescribing structure for status determination.</p>



  <p class="wp-block-paragraph">The Refugees Act of 1989 provides protections to refugees from non-refoulement and the right to remain during the asylum application process, to enter without lawful status if a refugee intends to seek asylum, and the right to be protected from detention. However, rights such as the right to freedom of movement and right to work are not guaranteed in this law.</p>



  <p class="wp-block-paragraph">Malawi’s reservations to the Refugee Convention reinforce this lack of work rights: Malawi does not agree to Convention provisions that give refugees rights to own property, join unions, or move freely. It agrees only to allow refugees to work on par with foreigners generally and denies them access to rights at work.</p>



  <p class="wp-block-paragraph">Most refugees have long been restricted to living in camps, and in 2021 authorities ordered refugees living outside camps to relocate to the Dzaleka camp that now is supposed to host all refugees in the country.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">Malawi was on track to participate in the Comprehensive Refugee Response Framework by promoting durable solutions, including local integration and resettlement possibilities. However, the government recently changed course and imposed strict encampment requirements—a clear step backward in its progress toward economic inclusion of refugees. In April 2021, the government announced that all refugees would need to return to the Dzaleka Camp, citing national security reasons. This move stretched already limited access to services in the overcrowded Dzaleka Camp and uprooted some 2,000 refugees who were living and working alongside hosts in Malawi. The denial of rights most notably affects freedom of movement and the right to work, but also access to other socioeconomic rights.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong></p>



  <p class="wp-block-paragraph">BBC News, “Malawi Orders Integrated Refugees into Overcrowded Camp,” May 6, 2021, <a href="https://www.bbc.com/news/world-africa-57007744">https://www.bbc.com/news/world-africa-57007744</a></p>



  <p class="wp-block-paragraph">Benson Kunchezera, “Return to the refugee camp: Malawi orders thousands back to ‘congested’ Dzaleka,” November 25, 2021, <a href="https://www.theguardian.com/global-development/2021/nov/25/return-to-the-refugee-camp-malawi-orders-thousands-back-to-congested-dzaleka">https://www.theguardian.com/global-development/2021/nov/25/return-to-the-refugee-camp-malawi-orders-thousands-back-to-congested-dzaleka</a></p>



  <p class="wp-block-paragraph">Lamick Masina, “Malawi Orders All Refugees Back into Camp within 14 Days,” Voice of America, April 17, 2021, <a href="https://www.voanews.com/a/africa_malawi-orders-all-refugees-back-camp-within-14-days/6204712.html">https://www.voanews.com/a/africa_malawi-orders-all-refugees-back-camp-within-14-days/6204712.html</a></p>



