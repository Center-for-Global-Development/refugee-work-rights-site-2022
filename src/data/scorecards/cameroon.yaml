content: |-
  <p class="wp-block-paragraph">According to UNHCR, Cameroon hosted 446,101 refugees and 6,059 asylum seekers in 2021. The majority of refugees and asylum seekers originated from the Central African Republic and Nigeria.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Cameroon is a party to the 1951 Refugee Convention and its 1967 Protocol, the ICESCR, and the Organization of African Unity regional convention, whose principles on the definition of refugees, non-refoulement, and exemption from sanctions for illegal entry have been incorporated into the country’s 2005 Refugee Law (Act No. 2005/006).</p>



  <p class="wp-block-paragraph">The 2005 Refugee Law requires that refugees be treated the same as nationals in terms of access to work, education, housing, social assistance, property, justice, naturalization and freedom of movement. All refugees are entitled to identity cards and travel documents provided by the Cameroonian administration, giving them the right to freely move within the country. Refugees in Cameroon are also allowed to start businesses and register them in their own names. In 2018, Law 2018/010 was enacted which enabled the government to verify refugees’ credentials and access vocational training.</p>



  <p class="wp-block-paragraph">The 2005 Refugee Law guarantees asylum seekers the right to remain while their asylum application is being processed, without term limits or renewal periods. The right to work is not expressly granted to asylum seekers in the 2005 Refugee Law. Notwithstanding the legislation, freedom of movement is restricted for refugees by unwritten administrative policies, including the internment of Nigerian refugees in closed camps, a refusal to grant legal recognition to Nigerian refugees who do not submit to internment, and administrative practices requiring refugees to obtain a permit for travel outside the district where they have been authorized to reside.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">While Cameroon has historically been a generous host of refugees, the situation has changed significantly in recent years. Since 2015, authorities have deported more than 100,000 Nigerian asylum seekers and refugees, according to Human Rights Watch. The forced repatriations appear to be motivated by the threat of Boko Haram and worries about Cameroon’s own conflict, which has internally displaced more than one million people.</p>



  <p class="wp-block-paragraph">For refugees who remain in Cameroon, the crackdown has also restricted freedom of movement. Refugees traveling outside their home villages report harassment and nonrecognition of their IDs. While there are large camps—including Minawao in the Far North, which was hosting more than 100,000 refugees at one point—most refugees live in villages in the Far North and East regions. Obtaining documentation for many basics such as birth certificates, identification cards, and business and work permits is a significant issue.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong></p>



  <p class="wp-block-paragraph">Government of Cameroon, Loi n°2005/006 du 27 juillet 2005, Portant statut des réfugiés au Cameroun, Article 8(3) and Article 9, 2005, <a href="https://www.refworld.org/pdfid/44eb242e4.pdf">https://www.refworld.org/pdfid/44eb242e4.pdf</a></p>



  <p class="wp-block-paragraph">Government of Cameroon, Loi n°2005/006 du 27 juillet 2005, Portant statut des réfugiés au Cameroun, Article 10, 2005, <a href="https://www.refworld.org/pdfid/44eb242e4.pdf">https://www.refworld.org/pdfid/44eb242e4.pdf</a></p>



  <p class="wp-block-paragraph">Human Rights Watch, “‘They Forced Us onto Trucks Like Animals’: Cameroon’s Mass Forced Return and Abuse of Nigerian Refugees,” September 27, 2017, <a href="https://www.hrw.org/report/2017/09/27/they-forced-us-trucks-animals/cameroons-mass-forced-return-and-abuse-nigerian">https://www.hrw.org/report/2017/09/27/they-forced-us-trucks-animals/cameroons-mass-forced-return-and-abuse-nigerian</a></p>



