content: |-
  <p class="wp-block-paragraph">According to UNHCR, Uganda hosted 1,475,311 refugees and 23,126 asylum seekers in 2021. The majority of refugees were from South Sudan, followed by the Democratic Republic of Congo.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">In addition to being a party to the 1951 Refugee Convention, its 1967 Protocol, and the ICESCR, Uganda is also a party to the Organization of African Unity Convention Governing the Specific Aspects of Refugee Problems in Africa and the Bangkok Principles on the Status and Treatment of Refugees (“Bangkok Principles”).</p>



  <p class="wp-block-paragraph">In terms of national legislation, the Ugandan Refugee Act of 2006 reflects the standards established in international instruments and guarantees refugees the right to work on the same terms granted to foreigners residing in the country. This is also extended to asylum seekers who have residency permission. However, the work permit stamp is often difficult to obtain, which requires having a Convention Travel Document.</p>



  <p class="wp-block-paragraph">Beyond the reservation lodged to Article 17 of the 1951 Refugee Convention (in which Uganda reserves the right to grant greater benefits to foreigners with whose governments it enters into specific agreements), there is no formal discrimination between refugee populations in the country.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">Uganda has hosted a large, protracted caseload of refugees and asylum seekers from neighboring countries for decades. Unlike many of its neighbors, Uganda’s relatively progressive policies have translated into improved labor market access for refugees. Among its most important policies, Uganda allows refugees to work and own their own businesses, and refugees have had freedom of movement since 2006. </p>



  <p class="wp-block-paragraph">Indeed, many survey respondents noted that refugees can travel freely, and many can choose where they live under the self-settlement policy. They can also receive a plot of land to cultivate.<br>However, notable barriers remain. While refugees can choose to leave, those who wish to receive formal assistance must remain in designated settlements, most of which are far from urban centers. Only six percent of refugees are registered in Kampala, the main location outside of the settlements.</p>



  <p class="wp-block-paragraph">Respondents also indicated that formal work permits are still difficult for refugees to obtain, and that some employers still stigmatize refugees or hesitate to hire them because they are unsure about the laws and policies. Moreover, despite Uganda’s progressive regarding refugee rights, refugees are still less likely than Ugandans to be employed and more likely to take work that is below their skill level, education, and pre-displacement occupation.</p>



