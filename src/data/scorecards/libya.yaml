title: Libya
country_id: LY
levels:
  de_jure: "2"
  de_facto: "2"
  overall: "2"
content: |-
  <p class="wp-block-paragraph">According to UNHCR, Libya hosted 3,701 refugees and 39,434 asylum seekers in 2021. The majority of refugees and asylum seekers were from Sudan and Syria.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Although not a party to the 1951 Refugee Convention, Libya is a party to the Organization of African Unity (OAU) Convention Governing the Specific Aspects of Refugee Problems in Africa, the Arab Convention on Regulating Status of Refugees in the Arab Countries, the Protocol for the Treatment of Palestinians in Arab States (“Casablanca Protocol”), and the Bangkok Principles on the Status and Treatment of Refugees (“Bangkok Principles”).</p>



  <p class="wp-block-paragraph">Article 10 of The Libyan Constitutional Declaration determines that the state shall guarantee the rights of refugees. However, specific legislation has not been developed in this regard, leaving refugees without de jure access to legal status, free movement, or work rights.</p>



  <p class="wp-block-paragraph">Libya’s Labor Relations Law (Law No. 12 of 2010) stipulates that foreigners must obtain a permit to work and prescribes a range of labor rights for workers. However, because Libyan law provides no way for refugees to regularize their legal status in the country, the Libyan government most likely would not consider this law to apply to refugees.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">Often cited for its maltreatment of migrants seeking to reach Europe, Libya also hosts a sizable refugee population and has historically received migrants seeking work. The lack of a national asylum means refugees are “illegal migrants” and puts them at risk of arrest, detention, and abuse. In recent raids and crackdowns by authorities, refugees’ and asylum seekers’ homes were demolished, and, in the process, some refugees and asylum seekers were beaten and killed. Many individuals need emergency food and cash assistance, as well as help with finding new housing and accessing basic social services such as healthcare and education. Libya’s ongoing political unrest and the COVID-19 pandemic have exacerbated crackdowns and violence toward refugees and asylum seekers.</p>



  <p class="wp-block-paragraph">Few refugees and asylum seekers have opportunities to access the formal labor market. Survey respondents noted that refugees have little freedom of movement and are regularly harassed and occasionally arrested when traveling. They also reported that the situation has worsened in recent years, and that while Libya is a signatory to the OAU Convention, it generally does not recognize refugees or asylum seekers. UNHCR registers asylum seekers, but this process is limited and thus very few have the documentation needed to access formal work. That being said, respondents noted that the government did not often enforce the need for permits.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong></p>



  <p class="wp-block-paragraph">Amnesty International, “‘Between Life and Death’: Refugees and Migrants Trapped in Libya’s Cycle of Abuse,” September 24, 2020, <a href="https://www.amnesty.org/en/documents/mde19/3084/2020/en/">https://www.amnesty.org/en/documents/mde19/3084/2020/en/</a></p>



  <p class="wp-block-paragraph">Asian-African Legal Consultative Organization, Bangkok Principles on the Status and Treatment of Refugees (“Bangkok Principles”), December 31, 1966, <a href="https://www.refworld.org/docid/3de5f2d52.html">https://www.refworld.org/docid/3de5f2d52.html</a></p>



  <p class="wp-block-paragraph">Attempted sea crossings represented less than 5 percent of the total migrant population in Libya. In 2020, the overall number of migrants in the country decreased by 80,000, to 570,000, while the number of UNHCR-registered refugees and asylum seekers decreased from 48,000 to 44,000 (41,681 as of October 1, 2021). See <a href="https://reporting.unhcr.org/libya">https://reporting.unhcr.org/libya</a> for the latest updates.</p>



  <p class="wp-block-paragraph">“Escaping Hell on Earth: Libya’s Refugee Camps,” DW, December 28, 2020, <a href="https://www.dw.com/en/escaping-hell-on-earth-libyas-refugee-camps/a-56077512">https://www.dw.com/en/escaping-hell-on-earth-libyas-refugee-camps/a-56077512</a></p>



  <p class="wp-block-paragraph">Government of Libya, Draft Constitutional Charter for the Transitional Stage: The Constitutional Declaration, February 7, 2011, <a href="https://www.ndi.org/sites/default/files/Handout%204%20-%20Libya%20Draft%20Interim%20Constitution.pdf">https://www.ndi.org/sites/default/files/Handout%204%20-%20Libya%20Draft%20Interim%20Constitution.pdf</a></p>



  <p class="wp-block-paragraph">Government of Libya, Law No. (12) of 2010 on Labour Relations and Its Bylaw, 2010, <a href="https://security-legislation.ly/en/law/31973#:~:text=(12)%20of%202010%20on%20labour%20relations%20and%20its%20bylaw,-Law%20No.%20(&amp;text=The%20General%20People's%20Congress%3A&amp;text=Not%20be%20dismissed%20from%20service,clear%20the%20penalty%20has%20elapsed">https://security-legislation.ly/en/law/31973#:~:text=(12)%20of%202010%20on%20labour%20relations%20and%20its%20bylaw,-Law%20No.%20(&amp;text=The%20General%20People&#8217;s%20Congress%3A&amp;text=Not%20be%20dismissed%20from%20service,clear%20the%20penalty%20has%20elapsed</a></p>



  <p class="wp-block-paragraph">League of Arab States, Arab Convention on Regulating Status of Refugees in the Arab Countries, 1994, <a href="https://www.refworld.org/docid/4dd5123f2.html">https://www.refworld.org/docid/4dd5123f2.html</a></p>



  <p class="wp-block-paragraph">League of Arab States, Protocol for the Treatment of Palestinians in Arab States (“Casablanca Protocol”), September 11, 1965, <a href="https://www.refworld.org/docid/460a2b252.html">https://www.refworld.org/docid/460a2b252.html</a></p>



