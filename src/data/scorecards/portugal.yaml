content: |-
  <p class="wp-block-paragraph">According to UNHCR, Portugal hosted 2,650 refugees and 303 asylum seekers in 2021. The most common countries of origin for refugees and asylum seekers were Syria and Ukraine. </p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Portugal is a party to the 1951 Refugee Convention, its 1967 Protocol, and the ICESCR. These international obligations are supplemented by the EU Regional Council Directive, which requires that member states authorize recognized refugees to engage in lawful employment on par with nationals. Portugal also enshrines the rights of refugees in domestic legislation in the Asylum Act of 2008.</p>



  <p class="wp-block-paragraph">The Asylum Act provides asylum seekers, refugees, and beneficiaries of subsidiary protection the right to access the labor market. Further, the law allows for a provisional residence permit for those undergoing the asylum application process, which is valid for six months and renewable. Once asylum seekers are deemed eligible to proceed with the asylum application process, they are granted the right to work after 7 days at a border or between 10 and 30 days elsewhere in the territory.</p>



  <p class="wp-block-paragraph">Refugees, those with subsidiary protection, and asylum seekers are granted the same employment rights as citizens. Work permits are offered free of charge, and no labor market test is required to determine work suitability. Portugal restricts the sectors that foreign nationals may work in for the public sector only.</p>



  <p class="wp-block-paragraph">Portugal offers refugees and those with subsidiary protection the right to naturalize after five years of legal residency in the country. An amendment to the Nationality Regulation was proposed in 2020 to grant citizenship to all those with pending asylum applications, though this was modified to extend residence permits until 2022.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">In Portugal, refugees have access to the labor market after their asylum application is accepted. Refugees need to wait only about one month to receive work authorization, making Portugal one of the OECD countries where refugees have the earliest labor market access. Refugees are free to work in any sector of the economy and face few restrictions to their employment. However, NGOs on the ground report that, in practice, refugees struggle to obtain employment.</p>



  <p class="wp-block-paragraph">In Portugal, refugees are overrepresented among the self-employed. The country has implemented a plethora of programs to promote refugee employment and entrepreneurship. In addition, the country has initiated courses and training to help refugees overcome the significant obstacles they face, such as the language barrier. However, credential recognition for refugee professionals remains a major challenge, as there is no process to recognize the professional credentials of those who do not have access to their original diplomas.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong>:</p>



  <p class="wp-block-paragraph">Government of Portugal, Asylum Act of 2008, June 30, 2008, <a href="https://files.dre.pt/1s/2008/06/12400/0400304018.pdf#1">https://files.dre.pt/1s/2008/06/12400/0400304018.pdf#1</a></p>



  <p class="wp-block-paragraph">Inês Carreirinho, <em>Country Report: Portugal</em> (Brussels: European Council on Refugees and Exiles, 2020), <a href="https://asylumineurope.org/wp-content/uploads/2021/05/AIDA-PT_2020update.pdf">https://asylumineurope.org/wp-content/uploads/2021/05/AIDA-PT_2020update.pdf</a></p>



  <p class="wp-block-paragraph">OECD, <em>Finding Their Way: The Integration of Refugees in Portugal</em> (Paris: OECD, 2019), <a href="https://www.oecd.org/els/mig/finding-their-way-the-integration-of-refugees-in-portugal.pdf">https://www.oecd.org/els/mig/finding-their-way-the-integration-of-refugees-in-portugal.pdf</a></p>



