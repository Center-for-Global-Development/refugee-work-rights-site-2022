content: |-
  <p class="wp-block-paragraph">According to UNHCR, Brazil hosted 60,848 refugees and 206,000 asylum seekers as well as 179,736 Venezuelans displaced abroad in 2021. The most common countries of origin for refugees and asylum seekers were Haiti, Cuba, and Syria.</p>



  <p class="wp-block-paragraph"><strong>De Jure Summary</strong></p>



  <p class="wp-block-paragraph">Brazil is a party to the main international instruments concerning refugees, including the 1984 Cartagena Declaration. The National Refugee Act, which was passed in 1997, implements the 1951 Refugee Convention and its related provisions.</p>



  <p class="wp-block-paragraph">The 1997 National Refugee Act establishes that once a refugee application is submitted, the refugee and their family will be issued an authorization ticket that guarantees the right to remain while their application is being processed. This ticket is valid for one year and enables refugees access to a temporary work permit issued by the Ministry of Labor. Recognized refugees are guaranteed access to the National Migration Registration Card, the Work and Social Security Card, an Individual Tax Identification Number, and a passport from the government of Brazil.</p>



  <p class="wp-block-paragraph">In 2019, the government’s refugee agency granted over 20,000 Venezuelan refugees the right to asylum. This decision applied to roughly 10 percent of the Venezuelan refugee population in Brazil at the time, protecting their rights to refugee status and enabling the right to work.</p>



  <p class="wp-block-paragraph"><strong>De Facto Summary</strong></p>



  <p class="wp-block-paragraph">Survey respondents note that refugees and asylum seekers in Brazil have easy access to work permits, freedom of movement, and choice of residence. However, most are still limited to working informally, where protections are limited.</p>



  <p class="wp-block-paragraph">There is no programming to promote formal employment among refugees, which is seen by many as tacit approval of the large number of refugees who work in the informal sector. Further, according to a survey respondent, there is a dearth of information available for employers with respect to the hiring of refugees—many do not know that they can hire refugees.</p>



  <p class="wp-block-paragraph">There is also a lack of information in key service sectors such as banking and education. The clerical workers often do not know what documents refugees need in order to access services for which they are eligible, such as formal financial lending or basic education.</p>



  <p class="wp-block-paragraph"><strong>Sources</strong></p>



  <p class="wp-block-paragraph">Gilberto M.A. Rodrigues, “South America and the Cartagena Regime: A Comprehensive Approach to Forced Migration Responses,” ASILE Forum, November 10, 2020, <a href="https://www.asileproject.eu/south-america-and-the-cartagena-regime/">https://www.asileproject.eu/south-america-and-the-cartagena-regime/</a></p>



  <p class="wp-block-paragraph">Human Rights Watch, “Brazil Grants Asylum to 21,000 Venezuelans in a Single Day,” December 6, 2019, <a href="https://www.hrw.org/news/2019/12/06/brazil-grants-asylum-21000-venezuelans-single-day">https://www.hrw.org/news/2019/12/06/brazil-grants-asylum-21000-venezuelans-single-day</a></p>



  <p class="wp-block-paragraph">Presidência da República, Define mecanismos para a implementação do Estatuto dos Refugiados de 1951, e determina outras providências, 1997, <a href="http://www.planalto.gov.br/ccivil_03/leis/L9474.htm">http://www.planalto.gov.br/ccivil_03/leis/L9474.htm</a></p>



  <p class="wp-block-paragraph">UNHCR, “Documents,” accessed April 17, 2022, <a href="https://help.unhcr.org/brazil/en/documents/">https://help.unhcr.org/brazil/en/documents/</a></p>



  <p class="wp-block-paragraph">UNHCR, Refugee Data Finder, accessed May 23, 2022, <a href="https://www.unhcr.org/refugee-statistics/download/?url=3HMho5">https://www.unhcr.org/refugee-statistics/download/?url=3HMho5</a></p>



